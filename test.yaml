# Throwaway needs.pg app for the 2.4f delete→recover→GC walk.
# NEVER point these destructive steps at landing-cms — its claim's GC
# would drop the real CMS database. ns `demo`, claim `gc-probe-pg`,
# role/db `claim_demo_gc_probe_pg`, snapshot `claim-demo-gc-probe-pg`.
apiVersion: apprafter.io/v1alpha1
kind: Application
metadata:
  name: gc-probe
  namespace: demo
spec:
  base:
    image: registry.k8s.io/pause:3.9   # workload is irrelevant; we test the claim/DB via psql
    replicas: 1
    expose:
      port: 8080
      public: false
      network: internal
    needs:
      pg: {}
