# SPDX-License-Identifier: FSL-1.1-Apache-2.0
[package]
name        = "cli-state"
description = "Local state file (.apprafter/state.json) load/save for apprafter."
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
publish.workspace      = true
authors.workspace      = true
repository.workspace   = true

[features]
# `seam::testing`: the hook a test arms at a `state.json` writer's points (WI-487). Enabled only
# by the [dev-dependencies] of the crates that test their writers (apprafter-core, platform-cli):
# under resolver 2 a dev-dependency's features never reach a shipped binary, so there
# `seam::reached` does nothing.
test-support = []

[dependencies]
cli-core   = { path = "../cli-core" }
serde      = { workspace = true }
serde_json = { workspace = true }
thiserror  = { workspace = true }

[dev-dependencies]
# Per-test state roots. `State::save` writes through
# `cli_core::atomic_replace`, which owns the temp file.
tempfile   = { workspace = true }
# `cli_core::owner_only::testing`, to read state.json's Windows DACL back
# (WI-472). A path crate's dev-dependency reaches neither a shipped binary
# nor desktop/Cargo.lock.
cli-core   = { path = "../cli-core", features = ["test-support"] }
