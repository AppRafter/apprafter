[package]
name        = "backup-core"
description = "Execution-agnostic backup engine for AppRafter (CLI + in-cluster runner)."
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
authors.workspace      = true
repository.workspace   = true

[dependencies]
cli-core   = { path = "../cli-core" }
# RFC-3339 parse + ISO-week/month bucketing for the retention prune planner
# (prune.rs). Already a workspace dependency (used by platform-cli / cli-providers).
chrono     = { workspace = true }
serde      = { workspace = true }
serde_json = { workspace = true }
tempfile   = { workspace = true }
# Sealed-secrets re-seal crypto (used by reseal.rs / sealing.rs).
aes-gcm    = { workspace = true }
base64     = { workspace = true }
rand       = { workspace = true }
rsa        = { workspace = true }
sha2       = { workspace = true }
