# SPDX-License-Identifier: FSL-1.1-MIT
[workspace]
resolver = "2"
members = [
    "platform-cli",
    "cli-core",
    "cli-state",
    "cli-providers",
]

[workspace.package]
# Bumped to match each released patch tag per the CONTRIBUTING.md
# "Versioning" rule. Drifted at 0.1.2 from initial v0.1.2 commit
# through v0.1.76; the policy starts at v0.1.77.
version      = "0.1.80"
edition      = "2021"
rust-version = "1.88"
license      = "FSL-1.1-MIT"
authors      = ["AppRafter Authors"]
repository   = "https://github.com/apprafter/apprafter"

[workspace.dependencies]
clap                 = { version = "4.5", features = ["derive", "env"] }
thiserror            = "1.0"
tracing              = "0.1"
tracing-subscriber   = { version = "0.3", features = ["env-filter", "fmt"] }
serde                = { version = "1.0", features = ["derive"] }
serde_json           = "1.0"
serde_yaml           = "0.9"
color-eyre           = "0.6"
assert_cmd           = "2.0"
predicates           = "3.1"
tempfile             = "3.10"
ureq                 = { version = "2.10", features = ["json"] }
mockito              = "1.5"
age                  = { version = "0.10", default-features = false, features = ["armor"] }
base64               = "0.22"
include_dir          = "0.7"
dirs                 = "5"
inquire              = "0.7"
tabled               = "0.15"

[profile.release]
lto         = "thin"
codegen-units = 1
strip       = "symbols"
