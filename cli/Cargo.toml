# SPDX-License-Identifier: FSL-1.1-Apache-2.0
[workspace]
resolver = "2"
members = [
    "platform-cli",
    "cli-core",
    "cli-state",
    "cli-providers",
]

[workspace.package]
# Bumped to match each released patch tag per the CONTRIBUTING.md
# "Versioning" rule. Drifted at 0.1.2 from initial v0.1.2 commit
# through v0.1.76; the policy starts at v0.1.77.
version      = "0.1.184"
edition      = "2021"
rust-version = "1.88"
license      = "FSL-1.1-Apache-2.0"
authors      = ["AppRafter Authors"]
repository   = "https://github.com/apprafter/apprafter"

[workspace.dependencies]
clap                 = { version = "4.5", features = ["derive", "env"] }
thiserror            = "1.0"
tracing              = "0.1"
tracing-subscriber   = { version = "0.3", features = ["env-filter", "fmt"] }
serde                = { version = "1.0", features = ["derive"] }
serde_json           = "1.0"
serde_yaml           = "0.9"
miette               = { version = "7", features = ["fancy"] }
owo-colors           = { version = "4", features = ["supports-colors"] }
assert_cmd           = "2.0"
predicates           = "3.1"
tempfile             = "3.10"
ureq                 = { version = "2.10", features = ["json"] }
mockito              = "1.5"
age                  = { version = "0.10", default-features = false, features = ["armor"] }
base64               = "0.22"
rsa                  = "0.9"
aes-gcm              = "0.10"
sha2                 = "0.10"
x509-cert            = { version = "0.2", features = ["pem"] }
rand                 = "0.8"
include_dir          = "0.7"
dirs                 = "5"
indicatif            = "0.17"
inquire              = "0.7"
tabled               = "0.15"
semver               = { version = "1", features = ["serde"] }
arboard              = { version = "3", default-features = false }
chrono               = { version = "0.4", default-features = false, features = ["clock", "serde"] }
terminal_size        = "0.4"

[profile.release]
lto         = "thin"
codegen-units = 1
strip       = "symbols"
