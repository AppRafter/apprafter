# SPDX-License-Identifier: FSL-1.1-Apache-2.0
[package]
name        = "apprafter"
description = "AppRafter CLI: bootstrap and lifecycle of clusters."
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
authors.workspace      = true
repository.workspace   = true

[[bin]]
name = "apprafter"
path = "src/main.rs"

# Deprecated shim that warns users about the rename and then exec's
# the `apprafter` binary located next to itself. Slated for removal
# in v0.2.0 alongside the M1.5 closure tag.
[[bin]]
name = "platform-cli"
path = "src/bin/platform-cli.rs"

[dependencies]
age           = { workspace = true }
arboard       = { workspace = true }
base64        = { workspace = true }
chrono        = { workspace = true }
terminal_size = { workspace = true }
cli-core      = { path = "../cli-core" }
cli-state     = { path = "../cli-state" }
cli-providers = { path = "../cli-providers" }
clap          = { workspace = true }
dirs          = { workspace = true }
indicatif     = { workspace = true }
miette        = { workspace = true }
inquire       = { workspace = true }
semver        = { workspace = true }
serde         = { workspace = true }
serde_json    = { workspace = true }
serde_yaml    = { workspace = true }
tabled        = { workspace = true }
tempfile      = { workspace = true }
tracing       = { workspace = true }
ureq          = { workspace = true }

[dev-dependencies]
assert_cmd = { workspace = true }
mockito    = { workspace = true }
predicates = { workspace = true }
serde_json = { workspace = true }
tempfile   = { workspace = true }
