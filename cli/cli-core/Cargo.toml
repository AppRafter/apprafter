# SPDX-License-Identifier: FSL-1.1-Apache-2.0
[package]
name        = "cli-core"
description = "Shared types, logging, and CUE-access helpers for apprafter."
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
publish.workspace      = true
authors.workspace      = true
repository.workspace   = true

[features]
# `StoreLock::unheld`, the guard of a store that cannot be locked, on demand: for the tests of
# what refuses to write without the store's write lock (D.4a T28). Enabled only from
# [dev-dependencies]; under resolver 2 it never reaches a shipped binary.
test-support = []

[dependencies]
thiserror          = { workspace = true }
miette             = { workspace = true }
owo-colors         = { workspace = true }
tracing            = { workspace = true }
tracing-subscriber = { workspace = true }
serde              = { workspace = true }
serde_json         = { workspace = true }
serde_yaml         = { workspace = true }
age                = { workspace = true }
# `timefmt` renders the one absolute-plus-relative timestamp form every
# surface prints; the `clock` feature is unused here (callers pass `now`)
# but the workspace entry carries it.
chrono             = { workspace = true }
dirs               = { workspace = true }
# Used both in production (fsutil::atomic_replace builds tempfiles in
# the destination dir for safe replace) and in tests (per-test root).
tempfile           = { workspace = true }

[target.'cfg(unix)'.dependencies]
# The errno values `target::StoreLock` reads as "this filesystem has no
# locks" (ENOLCK, EOPNOTSUPP, ENOTSUP), which std reports uncategorised.
# Already in the graph; no new crate.
libc               = "0.2"

[target.'cfg(windows)'.dependencies]
# `owner_only` (WI-472): the protected one-ACE DACL of every owner-only file
# and directory — the token's user (Security, System_Threading), the DACL set
# and read back (Security_Authorization), the file rights and the directory
# open (Storage_FileSystem). The version apprafter-core and platform-cli take,
# already in both locks (cli/, desktop/): an edge, no package.
windows-sys        = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Threading"] }

[dev-dependencies]
# Integration tests select a specific Application doc by name from a
# multi-app `cue export` object (order-independent fixture assertions).
serde_json         = { workspace = true }
