# SPDX-License-Identifier: FSL-1.1-Apache-2.0
[package]
name        = "apprafter-core"
description = "The AppRafter CLI domain shared by the apprafter CLI and AppRafter Desktop (ADR 0067)."
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
publish.workspace      = true
authors.workspace      = true
repository.workspace   = true

[features]
# TypeScript declarations of the IPC-facing types, for AppRafter Desktop (ADR 0067). Enabled only
# from desktop/; exports run from desktop/ipc tests, never from here (`#[ts(export)]` is
# forbidden by tests/guards.rs: under cli/'s `cargo test --all-features` it would write files
# into this crate).
ts = ["dep:ts-rs"]
# `error::samples`, one value of every CoreError variant, for another crate's tests (the CLI's
# CoreError renderer). Enabled only by platform-cli's [dev-dependencies]: under resolver 2 a
# dev-dependency's features never reach the shipped binary.
test-support = []

[dependencies]
# `ureq` and `zeroize` are already in both locks (cli/ and desktop/) at the same versions, and
# `cli-state` is the only package new to desktop/Cargo.lock, as a path crate: no registry crate
# moves in either lock.
cli-core      = { path = "../cli-core" }
cli-providers = { path = "../cli-providers" }
cli-state     = { path = "../cli-state" }
miette        = { workspace = true }
serde         = { workspace = true }
serde_json    = { workspace = true }
thiserror     = { workspace = true }
ts-rs         = { version = "12.0", optional = true, features = ["serde-json-impl"] }
ureq          = { workspace = true }
zeroize       = "1.9"

[target.'cfg(unix)'.dependencies]
# `process::run_bounded`: `setsid` before exec, and SIGKILL to the child's whole process group
# on timeout or cancellation. Already in both locks (cli-core's), at the same version.
libc          = "0.2"

[target.'cfg(windows)'.dependencies]
# `process::run_bounded`: the child's Job Object (made, assigned while the child is suspended,
# terminated on timeout or cancellation), resuming it (ToolHelp), and CREATE_NO_WINDOW. The
# version platform-cli takes, already in both locks; `Win32_Security` only because
# `CreateJobObjectW` names SECURITY_ATTRIBUTES.
windows-sys   = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Diagnostics_ToolHelp", "Win32_System_JobObjects", "Win32_System_Threading"] }

[dev-dependencies]
# tests/guards.rs reads the sources as syntax trees, not text. `syn` 2 and
# `toml` 0.5 are the versions already in the lock (no new package);
# `span-locations` gives the guard's findings their line numbers.
proc-macro2   = { version = "1", features = ["span-locations"] }
syn           = { version = "2", features = ["full", "visit", "parsing"] }
tempfile      = { workspace = true }
toml          = "0.5"
# A cli-only dev-dependency: a path crate's dev-dependencies are not resolved in
# desktop/Cargo.lock, so this adds nothing there.
mockito       = { workspace = true }
