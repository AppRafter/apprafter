# SPDX-License-Identifier: FSL-1.1-Apache-2.0
[package]
name        = "apprafter-core"
description = "The AppRafter CLI domain shared by the apprafter CLI and AppRafter Desktop (ADR 0067)."
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
publish.workspace      = true
authors.workspace      = true
repository.workspace   = true

[features]
# TypeScript declarations of the IPC-facing types, for AppRafter Desktop (ADR 0067). Enabled only
# from desktop/; exports run from desktop/ipc tests, never from here (`#[ts(export)]` is
# forbidden by tests/guards.rs: under cli/'s `cargo test --all-features` it would write files
# into this crate).
ts = ["dep:ts-rs"]
# `error::samples`, one value of every CoreError variant, for another crate's tests (the CLI's
# CoreError renderer), and `fixtures`, what a cluster answers, built at a given `now` (D.5
# B76). Enabled only by [dev-dependencies] (platform-cli's, the desktop's): under resolver 2 a
# dev-dependency's features never reach the shipped binary. `chrono` comes with it, for the
# fixtures' times, until d5-b's reads take a `now` of their own (B62).
test-support = ["dep:chrono"]
# Tests and walks only (D.4a T23): `vault::KdfPolicy::active()` becomes the policy whose
# Argon2id parameters a release build refuses. Nothing but [dev-dependencies] and the
# desktop's `test-build` may turn it on (tests/guards.rs, L4); release-cli.yml checks the
# shipped binary (L3, d4a-e).
insecure-fast-kdf = []

[dependencies]
# `ureq` and `zeroize` are already in both locks (cli/ and desktop/) at the same versions, and
# `cli-state` is the only package new to desktop/Cargo.lock, as a path crate: no registry crate
# moves in either lock.
cli-core      = { path = "../cli-core" }
cli-providers = { path = "../cli-providers" }
cli-state     = { path = "../cli-state" }
# The fixtures' times (`test-support` only). Already in both locks through cli-core, at one
# version: an edge, no package.
chrono        = { workspace = true, optional = true }
miette        = { workspace = true }
serde         = { workspace = true }
serde_json    = { workspace = true }
# store.yaml and the credentials marker (D.4a T31, T34) go through the YAML path every store file
# takes. Already in both locks through cli-core: an edge, no package (WI-460 moves them all off).
serde_yaml    = { workspace = true }
thiserror     = { workspace = true }
ts-rs         = { version = "12.0", optional = true, features = ["serde-json-impl"] }
ureq          = { workspace = true }
zeroize       = "1.9"
# The vault (ADR 0068; D.4a T17). Only argon2 0.6.0 and the blake2 0.11.0 it hashes with are
# new to both locks; the rest is already in both through age 0.12 or tempfile 3.27. argon2's
# default features (password-hash, getrandom) stay off: the vault calls the raw hash, into a
# working memory of its own (`vault/kdf.rs`). chacha20poly1305 0.10 and hkdf 0.12 are age's
# generation and move with it; the known-answer tests and the frozen v1 vectors make that
# move a checked change. Not used: `secrecy` (the core's `SecretString` is the one wrapper),
# `rand`, a CBOR crate, argon2's `parallel`.
age              = { workspace = true }
argon2           = { version = "0.6", default-features = false, features = ["alloc", "zeroize"] }
bech32           = "0.11"
chacha20poly1305 = { version = "0.10", default-features = false, features = ["alloc"] }
getrandom        = "0.4"
hkdf             = "0.12"
sha2             = { workspace = true }
subtle           = "2.6"

[target.'cfg(unix)'.dependencies]
# `process::run_bounded`: `setsid` before exec, and SIGKILL to the child's whole process group
# on timeout or cancellation. Already in both locks (cli-core's), at the same version.
libc          = "0.2"

[target.'cfg(windows)'.dependencies]
# `process::run_bounded`: the child's Job Object (made, assigned while the child is suspended,
# terminated on timeout or cancellation), resuming it (ToolHelp), and CREATE_NO_WINDOW. The
# version platform-cli takes, already in both locks; `Win32_Security` only because
# `CreateJobObjectW` names SECURITY_ATTRIBUTES. The vault file (D.4a T27):
# `Win32_Storage_FileSystem` moves a new vault into place without replacing one; its owner-only
# DACL, like the runtime dir's, is cli-core's (`cli_core::owner_only`, WI-472). Features only: no
# package moves in either lock.
windows-sys   = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Diagnostics_ToolHelp", "Win32_System_JobObjects", "Win32_System_Threading"] }

[dev-dependencies]
# tests/guards.rs reads the sources as syntax trees, not text. `syn` 2 and
# `toml` 0.5 are the versions already in the lock (no new package);
# `span-locations` gives the guard's findings their line numbers.
proc-macro2   = { version = "1", features = ["span-locations"] }
syn           = { version = "2", features = ["full", "visit", "parsing"] }
tempfile      = { workspace = true }
# The fixtures' own tests: `cfg(test)` builds `fixtures` without `test-support`.
chrono        = { workspace = true }
toml          = "0.5"
# A cli-only dev-dependency: a path crate's dev-dependencies are not resolved in
# desktop/Cargo.lock, so this adds nothing there.
mockito       = { workspace = true }
# `StoreLock::unheld` (cli-core's test-support), for the write-lock refusals' tests (D.4a T28),
# and `owner_only::testing::ModeGuard`, which puts a folder's mode back (WI-482). A path crate's
# dev-dependency reaches neither a shipped binary nor desktop/Cargo.lock.
cli-core      = { path = "../cli-core", features = ["test-support"] }
# `seam::testing` (cli-state's test-support): a test stops a `state.json` writer between its
# read and its save (WI-487). A path crate's dev-dependency reaches neither a shipped binary nor
# desktop/Cargo.lock.
cli-state     = { path = "../cli-state", features = ["test-support"] }
