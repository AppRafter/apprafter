# AppRafter Desktop (ADR 0067) — its own Cargo workspace, separate from cli/ so the Tauri graph
# never enters cli/Cargo.lock (design spec §3.4). The shared closure of apprafter-core must
# resolve to the same versions here as in cli/ (scripts/check-desktop-core-lock.sh): this lock
# was seeded from cli/Cargo.lock — never run a bare `cargo update` here, only
# `cargo update -p <desktop-only crate>`; a newer shared crate moves cli/Cargo.lock first.
[workspace]
resolver = "2"
members = ["src-tauri", "ipc"]

[workspace.package]
edition      = "2021"
rust-version = "1.90"
license      = "FSL-1.1-Apache-2.0"
publish      = false
authors      = ["AppRafter Authors"]
repository   = "https://github.com/apprafter/apprafter"

[workspace.dependencies]
apprafter-core = { path = "../cli/apprafter-core" }
serde          = { version = "1", features = ["derive"] }
serde_json     = "1"
tauri          = { version = "~2.12", features = ["config-json5"] }
tauri-build    = { version = "~2.7", features = ["config-json5"] }

[profile.release]
# Panics in spawn_blocking must stay catchable (D.2c maps a JoinError to
# apprafter::desktop::internal); `abort` would make that mapping dead code.
panic = "unwind"
