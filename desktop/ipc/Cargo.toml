# SPDX-License-Identifier: FSL-1.1-Apache-2.0
[package]
name        = "apprafter-desktop-ipc"
description = "The types AppRafter Desktop sends across IPC; Tauri-free so its TypeScript export runs on any OS."
# Not a version authority: desktop/src-tauri/Cargo.toml is (design spec §6.1).
version     = "0.0.0"
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
publish.workspace      = true
authors.workspace      = true
repository.workspace   = true

[features]
# TypeScript declarations (tests/export.rs). Off in the app build.
ts = ["dep:ts-rs", "apprafter-core/ts"]

[dependencies]
apprafter-core = { workspace = true }
serde          = { workspace = true }
serde_json     = { workspace = true }
ts-rs          = { version = "12.0", optional = true, features = ["serde-json-impl"] }

[dev-dependencies]
tempfile = "3"
