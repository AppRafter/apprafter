# SPDX-License-Identifier: FSL-1.1-Apache-2.0
[package]
name        = "operator-controllers-resourceclaim-scheduler"
description = "kube-rs Controller for v1alpha1 ResourceClaim — schedules claims to ServiceProviders (Phase 2.3)."
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
authors.workspace      = true
repository.workspace   = true

[lib]
path = "src/lib.rs"

[dependencies]
operator-core = { path = "../../operator-core" }

kube        = { workspace = true }
k8s-openapi = { workspace = true }
tracing     = { workspace = true }
thiserror   = { workspace = true }
futures     = { workspace = true }
tokio       = { workspace = true }
chrono      = { workspace = true }
serde_json  = { workspace = true }

[dev-dependencies]
# `reconcile.rs` drives a full reconcile against a scripted in-process
# apiserver. `kube::Client` is a thin wrapper over a `tower::Service`, so a
# `tower::service_fn` answering from a script exercises the real client
# (real URL construction, real 5xx mapping) with no cluster — the only way
# to assert WHICH calls a reconcile makes, in which order, and that a
# failed ServiceProvider list writes no status at all.
tower = { workspace = true }
http  = { workspace = true }
