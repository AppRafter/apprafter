# SPDX-License-Identifier: FSL-1.1-Apache-2.0
[package]
name        = "operator-controllers-resourceclaim-provisioner"
description = "kube-rs Controller for v1alpha1 ResourceClaim — provisions claims to backends (Phase 2.4c)."
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
publish.workspace      = true
authors.workspace      = true
repository.workspace   = true

[lib]
path = "src/lib.rs"

[dependencies]
operator-core = { path = "../../operator-core" }

kube        = { workspace = true }
k8s-openapi = { workspace = true }
http        = { workspace = true }
tracing     = { workspace = true }
thiserror   = { workspace = true }
futures     = { workspace = true }
tokio       = { workspace = true, features = ["sync"] }
chrono      = { workspace = true }
serde_json  = { workspace = true }
json-patch  = { workspace = true }
rand        = { workspace = true }
async-trait = { workspace = true }
base64      = { workspace = true }
redis       = { version = "1.7", default-features = false, features = ["tokio-comp"] }
async-nats  = "0.50.0"
# 2.29 (ADR 0066 §3.1): the third imperative client, after redis and nats, and
# for the same kind of reason — CNPG's managed.roles cannot create the roles a
# shared database needs, because a CREATEROLE role without superuser may
# administer only what it created (measured).
#
# Default features, which for this crate are just `runtime` (the tokio socket)
# and carry NO TLS backend — that is what we want. `default-features = false`
# was tried first and removes `runtime` along with it, taking `connect` with
# it; the minimal-looking spelling was the wrong one.
tokio-postgres = "0.7"

[dev-dependencies]
# 2.5d Task 9: asserts the NATS connection Secret's key SET against
# `admission_webhook::validator::JETSTREAM_FIELDS` rather than a fourth
# hand-copy of that vocabulary (round-1 review's objection to a third).
# Dev-only — no admission-webhook dependency in the production build; both
# crates already depend only on operator-core, so this adds no cycle.
admission-webhook = { path = "../../admission-webhook" }
# WI-400: the deadline tests run a reconcile against
# `operator_core::testing::stalled_client()` — an apiserver that accepts every
# request and never answers — on a paused clock (`test-util`), so a 120s
# deadline elapses in no wall time and the moment it fires is exact.
operator-core = { path = "../../operator-core", features = ["testing"] }
# `net` + `io-util` (WI-400, pg_client's bound tests): the scripted PostgreSQL
# server those tests run is a `TcpListener` the real `PgClient` dials. Both
# already reach this crate through tokio-postgres; they are named so the
# tests do not depend on that.
tokio         = { workspace = true, features = ["test-util", "net", "io-util"] }
# WI-400: `src/route_apiserver.rs` answers a reconcile's requests from a route
# table through a `tower::service_fn` — `kube::Client` is a thin wrapper over
# a `tower::Service`, so the real client runs with no cluster.
tower = { workspace = true }
