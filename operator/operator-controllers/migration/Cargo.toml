# SPDX-License-Identifier: FSL-1.1-Apache-2.0
[package]
name        = "operator-controllers-migration"
description = "kube-rs MigrationController + MigrationStrategy impls for v1alpha1 MigrationPlan (Track B.1.76)."
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
publish.workspace      = true
authors.workspace      = true
repository.workspace   = true

[lib]
path = "src/lib.rs"

[dependencies]
operator-core = { path = "../../operator-core" }

kube         = { workspace = true }
k8s-openapi  = { workspace = true }
tracing      = { workspace = true }
thiserror    = { workspace = true }
futures      = { workspace = true }
tokio        = { workspace = true }
chrono       = { workspace = true }
serde        = { workspace = true }
serde_json   = { workspace = true }
async-trait  = { workspace = true }

[dev-dependencies]
# WI-400: the deadline tests run a reconcile against
# `operator_core::testing::stalled_client()` — an apiserver that accepts every
# request and never answers — on a paused clock (`test-util`), so the 190s
# deadline elapses in no wall time and the moment it fires is exact.
operator-core = { path = "../../operator-core", features = ["testing"] }
tokio         = { workspace = true, features = ["test-util"] }
