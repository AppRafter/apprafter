# SPDX-License-Identifier: FSL-1.1-Apache-2.0
[package]
name        = "operator-controllers-application"
description = "kube-rs Controller for the v1alpha1 Application CRD."
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
publish.workspace      = true
authors.workspace      = true
repository.workspace   = true

[lib]
path = "src/lib.rs"

[dependencies]
operator-core                         = { path = "../../operator-core" }
operator-controllers-migration        = { path = "../migration" }
operator-controllers-sourcecredential = { path = "../sourcecredential" }
operator-rendering                    = { path = "../../operator-rendering" }

kube             = { workspace = true }
k8s-openapi      = { workspace = true }
oci-client = { workspace = true }
base64           = { workspace = true }
sha2             = { workspace = true }
tracing          = { workspace = true }
thiserror        = { workspace = true }
futures      = { workspace = true }
tokio        = { workspace = true }
chrono       = { workspace = true }
serde        = { workspace = true }
serde_json   = { workspace = true }
reqwest      = { workspace = true }
async-trait  = { workspace = true }

[dev-dependencies]
# The reconcile-level tests drive the whole `reconcile` against a scripted
# in-process apiserver. `kube::Client` is a thin wrapper over a
# `tower::Service`, so a `tower::service_fn` answering from a script exercises
# the real client with no cluster — the only way to read the Deployment a
# reconcile actually APPLIES, which is what decides whether it is a rollout.
tower = { workspace = true }
http  = { workspace = true }
# WI-400: `operator_core::testing::stalled_client()` — a client whose every
# request stays pending forever — builds the Context the deadline tests run
# against. Dev-only: the feature never reaches the shipped operator.
operator-core = { path = "../../operator-core", features = ["testing"] }
# `test-util` for `#[tokio::test(start_paused = true)]`: the deadline tests
# run a reconcile against a client that never answers, and the paused clock
# jumps straight to the 120s deadline instead of waiting it out.
tokio = { workspace = true, features = ["test-util"] }
