# SPDX-License-Identifier: FSL-1.1-Apache-2.0
[package]
name        = "operator-controllers-sourcecredential"
description = "kube-rs Controller for the v1alpha1 SourceCredential CRD — derives Argo repo-creds + workload pull-secrets."
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
authors.workspace      = true
repository.workspace   = true

[lib]
path = "src/lib.rs"

[dependencies]
operator-core = { path = "../../operator-core" }
# 2.16b-sc Task 7: the SourceCredential migration pause-gate calls
# `SourceCredentialMigrationStrategy::{detect_destructive, create_plan_for}`.
# The migration crate depends only on operator-core (not on this crate), so
# this edge is acyclic.
operator-controllers-migration = { path = "../migration" }

kube        = { workspace = true }
k8s-openapi = { workspace = true }
tracing     = { workspace = true }
thiserror   = { workspace = true }
futures     = { workspace = true }
tokio       = { workspace = true }
chrono      = { workspace = true }
serde       = { workspace = true }
serde_json  = { workspace = true }
base64      = { workspace = true }
# Live validity probe (1.79c S5): git smart-HTTP via reqwest, registry
# v2 token-exchange via oci-distribution (already the platform-stack
# OCI client). Both pinned to rustls-tls to match the kube client and
# avoid pulling openssl.
reqwest          = { workspace = true }
oci-distribution = { workspace = true }

[dev-dependencies]
# The unit tests that pin what this controller does when the apiserver
# cannot be reached build a kube `Client`, which constructs a rustls
# connector. rustls 0.23 removed its auto-default CryptoProvider, so that
# panics unless one is installed first — exactly the walk-found bug
# (v0.1.105 → v0.1.106) that `install_rustls_crypto_provider` fixes in the
# operator + webhook binaries. Same provider, same explicit install, so the
# tests match how the binaries actually run.
rustls = { version = "0.23", default-features = false, features = ["aws-lc-rs"] }
