[package]
name        = "operator-controllers-sourcecredential"
description = "kube-rs Controller for the v1alpha1 SourceCredential CRD — derives Argo repo-creds + workload pull-secrets."
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
authors.workspace      = true
repository.workspace   = true

[lib]
path = "src/lib.rs"

[dependencies]
operator-core = { path = "../../operator-core" }

kube        = { workspace = true }
k8s-openapi = { workspace = true }
tracing     = { workspace = true }
thiserror   = { workspace = true }
futures     = { workspace = true }
tokio       = { workspace = true }
chrono      = { workspace = true }
serde       = { workspace = true }
serde_json  = { workspace = true }
base64      = { workspace = true }
# Live validity probe (1.79c S5): git smart-HTTP via reqwest, registry
# v2 token-exchange via oci-distribution (already the platform-stack
# OCI client). Both pinned to rustls-tls to match the kube client and
# avoid pulling openssl.
reqwest          = { workspace = true }
oci-distribution = { workspace = true }
