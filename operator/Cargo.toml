# SPDX-License-Identifier: FSL-1.1-MIT
[workspace]
resolver = "2"
members = [
    "admission-webhook",
    "apprafter-operator",
    "operator-controllers/application",
    "operator-core",
    "operator-rendering",
]

[workspace.package]
version      = "0.1.2"
edition      = "2021"
rust-version = "1.88"
license      = "FSL-1.1-MIT"
authors      = ["AppRafter Authors"]
repository   = "https://github.com/apprafter/apprafter"

[workspace.dependencies]
axum               = "0.7"
tokio              = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
axum-server        = { version = "0.7", features = ["tls-rustls"] }
tower              = { version = "0.5", features = ["util"] }
http-body-util     = "0.1"
serde              = { version = "1", features = ["derive"] }
serde_json         = "1"
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
thiserror          = "1"
kube               = { version = "0.95", default-features = false, features = ["client", "runtime", "derive", "rustls-tls"] }
k8s-openapi        = { version = "0.23", default-features = false, features = ["v1_31"] }
schemars           = "0.8"
futures            = "0.3"
prometheus         = { version = "0.13", default-features = false }
chrono             = { version = "0.4", default-features = false, features = ["clock", "serde"] }

[profile.release]
lto         = "thin"
codegen-units = 1
strip       = "symbols"
