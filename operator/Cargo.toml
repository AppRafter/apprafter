# SPDX-License-Identifier: FSL-1.1-Apache-2.0
[workspace]
resolver = "2"
members = [
    "admission-webhook",
    "apprafter-operator",
    "operator-controllers/application",
    "operator-controllers/migration",
    "operator-controllers/platform-stack",
    "operator-controllers/sourcecredential",
    "operator-controllers/resourceclaim-scheduler",
    "operator-controllers/resourceclaim-provisioner",
    "operator-core",
    "operator-rendering",
    "crdgen",
]

[workspace.package]
version      = "0.1.2"
edition      = "2021"
rust-version = "1.88"
# Never published to crates.io: these crates are a product, not a library,
# and nothing in .github/workflows runs `cargo publish`. Declaring it makes
# that explicit rather than merely true by omission, stops an accidental
# publish, and is what lets cargo-deny treat them as private — without it
# the licence check reads `FSL-1.1-Apache-2.0` (a real licence, but not an
# SPDX identifier) as "unlicensed" on our own code.
publish      = false
license      = "FSL-1.1-Apache-2.0"
authors      = ["AppRafter Authors"]
repository   = "https://github.com/apprafter/apprafter"

[workspace.dependencies]
axum               = "0.8"
tokio              = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
axum-server        = { version = "0.8", features = ["tls-rustls"] }
tower              = { version = "0.5", features = ["util"] }
http               = "1"
http-body-util     = "0.1"
serde              = { version = "1", features = ["derive"] }
serde_json         = "1"
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
thiserror          = "2"
# `jsonpatch` exposes `Patch::Json` (RFC 6902). The shared-backend reaper
# needs it to remove ONE `ownerReferences` entry from a CNPG PVC under a
# `test` precondition (ADR 0042 §9.3) — a merge-patch would replace the
# whole array and silently discard a concurrent co-owner. The feature adds
# no compilation: `json-patch` is already an unconditional dependency of
# kube-runtime, so this only makes the enum variant visible.
kube               = { version = "0.95", default-features = false, features = ["client", "runtime", "derive", "rustls-tls", "jsonpatch"] }
json-patch         = "2"
k8s-openapi        = { version = "0.23", default-features = false, features = ["v1_31"] }
schemars           = "0.8"
futures            = "0.3"
prometheus         = { version = "0.14", default-features = false }
chrono             = { version = "0.4", default-features = false, features = ["clock", "serde"] }
base64             = "0.23"
oci-client         = { version = "0.18", default-features = false, features = ["rustls-tls"] }
reqwest            = { version = "0.13", default-features = false, features = ["rustls"] }
semver             = { version = "1", features = ["serde"] }
serde_yaml         = "0.9"
async-trait        = "0.1"
flate2             = "1.0"
tar                = "0.4"
rand               = "0.9"
anyhow             = "1"
sha2               = "0.11"

[profile.release]
lto           = "thin"
codegen-units = 1
strip         = "symbols"
# Drop unwinding machinery — the operator + admission-webhook
# binaries are not expected to catch panics; on a panic we want
# the pod to exit (kubelet restart picks up). `panic = "abort"`
# shaves a few MB off the final musl-static image and trims
# image-pull time on cold starts (B.1.73 walk-fix #1).
panic         = "abort"
