# SPDX-License-Identifier: MIT
# v1alpha1 MigrationPlan CRD. Hand-rolled OpenAPI v3 mirror of
# schemas/v1alpha1/migrationplan.cue. The scope discriminator
# (application | platform) cannot be expressed cleanly as
# OpenAPI v3 oneOf inside a CRD schema (the apiserver's
# structural-schema requirement rejects most oneOf shapes),
# so we declare both sub-objects as optional here and let the
# admission webhook enforce "scope.<type> is present + non-
# empty when type matches". The CRD layer guarantees the
# field shapes; the webhook layer guarantees the conditional
# correctness.
#
# Wave -5 matches the Application + PlatformStack CRDs so all
# AppRafter CRs are established before any controller starts.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: migrationplans.apprafter.io
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
    argocd.argoproj.io/sync-options: ServerSideApply=true
  labels:
    {{- include "apprafter-operator.labels" . | nindent 4 }}
spec:
  group: apprafter.io
  scope: Namespaced
  names:
    plural: migrationplans
    singular: migrationplan
    kind: MigrationPlan
    listKind: MigrationPlanList
    shortNames:
      - mp
      - migplan
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              required: [scope, trigger]
              properties:
                scope:
                  type: object
                  required: [type]
                  properties:
                    type:
                      type: string
                      enum: [application, platform]
                    application:
                      type: object
                      required: [ref, environment]
                      properties:
                        ref:
                          type: object
                          required: [name, namespace]
                          properties:
                            name:
                              type: string
                            namespace:
                              type: string
                        environment:
                          type: string
                    platform:
                      type: object
                      required: [components]
                      properties:
                        components:
                          type: array
                          items:
                            type: string
                trigger:
                  type: object
                  required: [type, field]
                  properties:
                    type:
                      type: string
                    field:
                      type: string
                    from:
                      x-kubernetes-preserve-unknown-fields: true
                    to:
                      x-kubernetes-preserve-unknown-fields: true
                risks:
                  type: object
                  required: [classification]
                  properties:
                    classification:
                      type: string
                      enum: [safe, requires-restart, data-migration, breaking]
                    estimatedDowntime:
                      type: string
                    dataVolume:
                      type: string
                    reversible:
                      type: boolean
                    requiresFullBackup:
                      type: boolean
                plan:
                  type: array
                  items:
                    type: object
                    required: [step, action]
                    properties:
                      step:
                        type: integer
                        minimum: 1
                      action:
                        type: string
                      estimatedDuration:
                        type: string
                      reversible:
                        type: boolean
                approvers:
                  type: array
                  items:
                    type: string
                previousSpecSnapshot:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
            status:
              type: object
              properties:
                phase:
                  type: string
                  enum:
                    - pending-approval
                    - approved
                    - rejected
                    - executing
                    - completed
                    - failed
                approvedAt:
                  type: string
                  format: date-time
                approvedBy:
                  type: string
                executedSteps:
                  type: array
                  items:
                    type: object
                    required: [step, startedAt, outcome]
                    properties:
                      step:
                        type: integer
                        minimum: 1
                      startedAt:
                        type: string
                        format: date-time
                      finishedAt:
                        type: string
                        format: date-time
                      outcome:
                        type: string
                        enum: [succeeded, failed, skipped]
                      message:
                        type: string
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Scope
          type: string
          jsonPath: .spec.scope.type
        - name: Classification
          type: string
          jsonPath: .spec.risks.classification
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
