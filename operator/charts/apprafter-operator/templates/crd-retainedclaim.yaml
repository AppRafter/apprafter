# SPDX-License-Identifier: MIT
# v1alpha1 RetainedClaim CRD (Phase 2.4f). Hand-rolled OpenAPI v3
# mirror of schemas/v1alpha1/retainedclaim.cue. Operator-generated,
# Namespaced (always lives in apprafter-system). The provisioner
# finalizer snapshots a deleted pg ResourceClaim into a RetainedClaim
# (retainUntil = deletion + 7d) BEFORE removing its finalizer; the GC
# controller drops the role/DB/Secret + the snapshot once retainUntil
# passes.
#
# Immutable: an `x-kubernetes-validations` CEL rule pins the whole
# `spec` to `self == oldSelf` (the admission webhook layers the same
# guard + the operator-only CREATE gate that OpenAPI v3 can't express).
# No `status` subresource — the GC reads `spec` only.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: retainedclaims.apprafter.io
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
    argocd.argoproj.io/sync-options: ServerSideApply=true
  labels:
    {{- include "apprafter-operator.labels" . | nindent 4 }}
spec:
  group: apprafter.io
  scope: Namespaced
  names:
    plural: retainedclaims
    singular: retainedclaim
    kind: RetainedClaim
    listKind: RetainedClaimList
    shortNames:
      - rclaim
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              # Only the backend-agnostic lineage fields are universally
              # required. The CNPG-specific fields (cnpgCluster/role/...) and
              # the dragonfly-specific fields (instance/aclUser/...) are each
              # optional at the CRD layer; the admission webhook enforces the
              # correct GC-load-bearing set per `spec.backend` (ADR 0042).
              required:
                - claimRef
                - provider
                - backend
                - retainUntil
              # Immutable after creation — the snapshot is a fixed
              # record of a deleted claim; nothing legitimately mutates
              # it (the webhook duplicates this guard + gates CREATE).
              x-kubernetes-validations:
                - rule: "self == oldSelf"
                  message: "RetainedClaim spec is immutable"
              properties:
                claimRef:
                  type: object
                  required: [name, namespace]
                  properties:
                    name:
                      type: string
                    namespace:
                      type: string
                provider:
                  type: string
                backend:
                  type: string
                cnpgCluster:
                  type: string
                cnpgNamespace:
                  type: string
                role:
                  type: string
                database:
                  type: string
                databaseObjectName:
                  type: string
                passwordSecretName:
                  type: string
                instance:
                  type: string
                dbnum:
                  type: integer
                  minimum: 0
                  maximum: 1023
                aclUser:
                  type: string
                connectionSecretRef:
                  type: string
                connectionSecretNamespace:
                  type: string
                retainUntil:
                  type: string
                  format: date-time
      additionalPrinterColumns:
        - name: SourceClaim
          type: string
          jsonPath: .spec.claimRef.name
        - name: Backend
          type: string
          jsonPath: .spec.backend
        - name: RetainUntil
          type: date
          jsonPath: .spec.retainUntil
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
