# SPDX-License-Identifier: MIT
{{- if .Values.rbac.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "apprafter-operator.fullname" . }}
  labels:
    {{- include "apprafter-operator.labels" . | nindent 4 }}
rules:
  # Application CRD — watch + status update.
  - apiGroups:
      - apprafter.io
    resources:
      - applications
      - applications/status
    verbs:
      - get
      - list
      - watch
      - patch
      - update
  # PlatformStack CRD — watched by the PlatformController in the
  # same operator binary (B.1.73). Without these the controller
  # fails silently on its first list/watch call and the
  # PlatformStack's `.status` never populates. Walk-found bug
  # v0.1.114 → v0.1.115.
  #
  # B.1.76 extension: PlatformMigrationStrategy.reject also
  # SSA-patches PlatformStack.spec.pin under the field manager
  # `migration-controller-strategy`. The same ClusterRole
  # rule covers both the PlatformController status writes and
  # the strategy's reject patch because RBAC is verb-based,
  # not field-manager-based.
  - apiGroups:
      - apprafter.io
    resources:
      - platformstacks
      - platformstacks/status
    verbs:
      - get
      - list
      - watch
      - patch
      - update
  # MigrationPlan CRD — watched by the MigrationController in
  # the same operator binary (B.1.76). The controller writes
  # `.status` via SSA with field manager `migration-controller`;
  # /status verb scoped separately so the operator can patch
  # status even if subresource RBAC tightens later.
  #
  # B.1.78 extension: PlatformController CREATES MigrationPlan
  # CRs on destructive transitions detected during the bump
  # cycle. `create` verb on the parent `migrationplans`
  # resource enables that path. Without it,
  # `create_platform_migration_plan` would 403 forbidden and
  # the controller would never gate destructive platform-stack
  # upgrades — silently bumping past breaking changes.
  - apiGroups:
      - apprafter.io
    resources:
      - migrationplans
      - migrationplans/status
    verbs:
      - get
      - list
      - watch
      - create
      - patch
      - update
  # Argo CD's `Application` CRD lives under argoproj.io. The
  # PlatformController SSA-patches the parent `platform`
  # Application in the `argocd` namespace with field manager
  # `platform-controller`; cluster-scoped get/patch is the
  # narrowest viable shape since the resource lives outside the
  # operator's own namespace.
  - apiGroups:
      - argoproj.io
    resources:
      - applications
    verbs:
      - get
      - list
      - watch
      - patch
      - update
  # Owned children — phase 1.9 will create + manage these.
  - apiGroups:
      - apps
    resources:
      - deployments
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
  - apiGroups:
      - ""
    resources:
      - services
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
  # SourceCredential CRD + its derivations (1.79c / ADR 0039).
  # The controller watches SourceCredentials, reads the
  # controller-unsealed material Secret (in apprafter-system),
  # and SSA-writes the derived Argo `repo-creds` Secret (in
  # `argocd`) and the workload `dockerconfigjson` pull-secret
  # (in app namespaces). Cluster-scoped because the material,
  # repo-cred, and pull-secret live in different namespaces; the
  # operator is the only holder of derived credential material
  # (ADR 0024 Layer 2). `patch`/`update` on `sourcecredentials`
  # also writes the cleanup finalizer (S5).
  - apiGroups:
      - apprafter.io
    resources:
      - sourcecredentials
      - sourcecredentials/status
    verbs:
      - get
      - list
      - watch
      - patch
      - update
  # Phase 2.3 ResourceClaim scheduler: read ServiceProviders
  # cluster-wide to match claims; read + write ResourceClaim status.
  - apiGroups:
      - apprafter.io
    resources:
      - serviceproviders
    verbs:
      - get
      - list
      - watch
  # 2.4d Application controller: generates child ResourceClaims from
  # `spec.*.needs` via SSA (the `create` verb — SSA-apply that
  # creates the object requires it) and watches them through the
  # `.owns(ResourceClaim)` wiring to resume the AwaitingResourceClaim
  # pause. `resourceclaims/status` is split into its own rule below
  # WITHOUT `create` — the Application controller must never write
  # claim status (the scheduler owns status.provider/Scheduled, the
  # provisioner owns status.ready/connectionSecretRef/Ready).
  - apiGroups:
      - apprafter.io
    resources:
      - resourceclaims
    verbs:
      - get
      - list
      - watch
      - create
      - patch
      - update
  # ResourceClaim status — written by the 2.3 scheduler and the
  # 2.4c provisioner only (NOT the Application controller). No
  # `create` here.
  - apiGroups:
      - apprafter.io
    resources:
      - resourceclaims/status
    verbs:
      - get
      - patch
      - update
  # Phase 2.4c resourceclaim-provisioner: provisions each
  # Scheduled pg ResourceClaim into the shared CloudNativePG
  # cluster. It lazily SSA-applies the `platform-postgres`
  # CNPG `Cluster` (created on the first matched pg claim),
  # read-modify-writes the Cluster's unkeyed
  # `spec.managed.roles` list to add a per-claim login role,
  # and applies a declarative CNPG `Database` CR. The CNPG
  # CRDs are installed at runtime by the `cloudnative-pg`
  # component (plan.md 2.4a); without these verbs the
  # provisioner 403s on its first Cluster apply and every pg
  # claim stalls Pending. Per-claim basic-auth password
  # Secrets (CNPG namespace) and the per-claim connection
  # Secret (claim namespace) are covered by the cluster-wide
  # secrets rule below.
  #
  # 2.4f extension: the RetainedClaim GC also RMW-removes the
  # per-claim role from the same Cluster (get + update) and
  # SSA-patches the Database CR to `spec.ensure: absent`
  # (patch). It does NOT delete the Database CR (the Postgres
  # reclaim default is `retain`; ensure:absent is the drop),
  # so `delete` is not strictly needed for the GC path — but it
  # is granted here so a future hard-cleanup or operator
  # break-glass can remove a stale CNPG CR without an RBAC edit.
  - apiGroups:
      - postgresql.cnpg.io
    resources:
      - clusters
      - databases
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
  # Phase 2.4f RetainedClaim CRD — written by the provisioner
  # finalizer (the deletion snapshot: create/patch via SSA) and
  # consumed + deleted by the RetainedClaim GC controller (the
  # 7th controller). The snapshot lives in apprafter-system but
  # the GC watches cluster-wide, so the rule is part of the
  # ClusterRole. The per-claim role/DB/password-Secret drops
  # the GC performs are covered by the postgresql.cnpg.io rule
  # above and the cluster-wide secrets rule below.
  - apiGroups:
      - apprafter.io
    resources:
      - retainedclaims
    verbs:
      - get
      - list
      - watch
      - create
      - patch
      - delete
  # `delete` (S5): the derived-Secret GC finalizer removes the
  # cross-namespace Argo `repo-creds` + canonical
  # `dockerconfigjson` on SourceCredential deletion (no
  # ownerReference cascade is possible across namespaces).
  - apiGroups:
      - ""
    resources:
      - secrets
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
  - apiGroups:
      - gateway.networking.k8s.io
    resources:
      - httproutes
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
  # Events — operators emit events on Application status changes
  # (legacy core/v1) AND PlatformController emits foreign-writer /
  # source-reverted audit events on PlatformStack
  # (events.k8s.io/v1, walk-fix #6 v0.1.119 → v0.1.120). kube-rs's
  # `Recorder::publish` uses the v1 events API; the legacy ""
  # group is kept for the older Application-controller emission
  # path.
  - apiGroups:
      - ""
    resources:
      - events
    verbs:
      - create
      - patch
  - apiGroups:
      - events.k8s.io
    resources:
      - events
    verbs:
      - create
      - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "apprafter-operator.fullname" . }}
  labels:
    {{- include "apprafter-operator.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "apprafter-operator.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "apprafter-operator.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
---
# Lease for leader election — namespaced to the operator's own
# namespace so the blast radius stays small.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "apprafter-operator.fullname" . }}-leader
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "apprafter-operator.labels" . | nindent 4 }}
rules:
  - apiGroups:
      - coordination.k8s.io
    resources:
      - leases
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "apprafter-operator.fullname" . }}-leader
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "apprafter-operator.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "apprafter-operator.fullname" . }}-leader
subjects:
  - kind: ServiceAccount
    name: {{ include "apprafter-operator.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
