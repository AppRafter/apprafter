# SPDX-License-Identifier: MIT
{{- if .Values.rbac.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "apprafter-operator.fullname" . }}
  labels:
    {{- include "apprafter-operator.labels" . | nindent 4 }}
rules:
  # Application CRD — watch + status update.
  - apiGroups:
      - apprafter.io
    resources:
      - applications
      - applications/status
    verbs:
      - get
      - list
      - watch
      - patch
      - update
  # PlatformStack CRD — watched by the PlatformController in the
  # same operator binary (B.1.73). Without these the controller
  # fails silently on its first list/watch call and the
  # PlatformStack's `.status` never populates. Walk-found bug
  # v0.1.114 → v0.1.115.
  #
  # B.1.76 extension: PlatformMigrationStrategy.reject also
  # SSA-patches PlatformStack.spec.pin under the field manager
  # `migration-controller-strategy`. The same ClusterRole
  # rule covers both the PlatformController status writes and
  # the strategy's reject patch because RBAC is verb-based,
  # not field-manager-based.
  - apiGroups:
      - apprafter.io
    resources:
      - platformstacks
      - platformstacks/status
    verbs:
      - get
      - list
      - watch
      - patch
      - update
  # MigrationPlan CRD — watched by the MigrationController in
  # the same operator binary (B.1.76). The controller writes
  # `.status` via SSA with field manager `migration-controller`;
  # /status verb scoped separately so the operator can patch
  # status even if subresource RBAC tightens later.
  #
  # B.1.78 extension: PlatformController CREATES MigrationPlan
  # CRs on destructive transitions detected during the bump
  # cycle. `create` verb on the parent `migrationplans`
  # resource enables that path. Without it,
  # `create_platform_migration_plan` would 403 forbidden and
  # the controller would never gate destructive platform-stack
  # upgrades — silently bumping past breaking changes.
  #
  # 0.2.31 extension: the PlatformController GCs superseded platform
  # MigrationPlans (stale-pending + terminal completed/rejected/failed)
  # so the Argo tree shows at most one active gate. `delete` enables
  # that — without it the GC's delete 403s (best-effort, logged) and
  # completed plans pile up (walk-found: the GC shipped in 0.2.29/0.2.30
  # but the delete verb did not, so it never cleaned anything).
  #
  # 2.16b-sc extension: the SourceCredential controller (same operator
  # binary) gates a destructive coverage-narrowing behind an SC-scope
  # MigrationPlan — it lists (finder), creates (gate), and deletes
  # (supersede / consume / cleanup) migrationplans in the credential's
  # namespace. All those verbs are already granted below cluster-wide,
  # so no new rule is needed; documented here so the "RBAC matches code
  # verbs" audit finds the new consumer.
  - apiGroups:
      - apprafter.io
    resources:
      - migrationplans
      - migrationplans/status
    verbs:
      - get
      - list
      - watch
      - create
      - patch
      - update
      - delete
  # Argo CD's `Application` CRD lives under argoproj.io. The
  # PlatformController SSA-patches the parent `platform`
  # Application in the `argocd` namespace with field manager
  # `platform-controller`; cluster-scoped get/patch is the
  # narrowest viable shape since the resource lives outside the
  # operator's own namespace.
  - apiGroups:
      - argoproj.io
    resources:
      - applications
    verbs:
      - get
      - list
      - watch
      - patch
      - update
  # Owned children — phase 1.9 will create + manage these.
  - apiGroups:
      - apps
    resources:
      - deployments
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
  - apiGroups:
      - ""
    resources:
      - services
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
  # ADR 0048 approval surface: the PlatformController GETs the
  # chart-emitted `platform-migration-anchor` ConfigMap (in the
  # operator namespace) to set a same-namespace ownerRef on the
  # platform MigrationPlan it creates for a gated upgrade — that
  # ownerRef is what pulls the plan onto the platform-stack root
  # Application's Argo tree (clickable Approve). Read-only: the
  # CHART owns the anchor, the operator only reads its UID.
  # Walk-found v0.2.26 freeze: without this rule the GET 403s, and
  # (before the best-effort fix in the same release) the 403
  # aborted the whole reconcile BEFORE the status write — so
  # `availableVersion` froze and the cluster stopped detecting
  # upgrades entirely. The cluster could not even create its own
  # gate, so GitOps self-healing was impossible (manual RBAC
  # break-glass was required). Both the rule and the best-effort
  # tolerance ship together.
  - apiGroups:
      - ""
    resources:
      - configmaps
    verbs:
      - get
      - list
      - watch
      # ADR 0048 (revised): SSA-stamp/prune the pending-upgrade
      # annotations on the chart-managed platform-migration-anchor
      # ConfigMap so the root App's Argo tile rolls up to Suspended.
      # The chart owns the anchor; the operator only patches its
      # annotations (annotation-only SSA, own field manager).
      - update
      - patch
      # 2.22d (D8): the provisioner now OWNS a ConfigMap of its own — the
      # CNPG monitoring query that publishes the per-database size metric
      # `status.size.bytes` reports. An SSA apply of an object that does not
      # exist yet is a CREATE, so the verb ships with the code that needs it.
      # This repository has been bitten three times by the opposite order
      # (ADR 0048's anchor GET, the 0.2.31 MigrationPlan GC delete, and the
      # 2.22d pods/proxy grant that the local walks could not even see).
      - create
  # SourceCredential CRD + its derivations (1.79c / ADR 0039).
  # The controller watches SourceCredentials, reads the
  # controller-unsealed material Secret (in apprafter-system),
  # and SSA-writes the derived Argo `repo-creds` Secret (in
  # `argocd`) and the workload `dockerconfigjson` pull-secret
  # (in app namespaces). Cluster-scoped because the material,
  # repo-cred, and pull-secret live in different namespaces; the
  # operator is the only holder of derived credential material
  # (ADR 0024 Layer 2). `patch`/`update` on `sourcecredentials`
  # also writes the cleanup finalizer (S5).
  - apiGroups:
      - apprafter.io
    resources:
      - sourcecredentials
      - sourcecredentials/status
    verbs:
      - get
      - list
      - watch
      - patch
      - update
  # Phase 2.3 ResourceClaim scheduler: read ServiceProviders
  # cluster-wide to match claims; read + write ResourceClaim status.
  - apiGroups:
      - apprafter.io
    resources:
      - serviceproviders
    verbs:
      - get
      - list
      - watch
  # 2.4d Application controller: generates child ResourceClaims from
  # `spec.*.needs` via SSA (the `create` verb — SSA-apply that
  # creates the object requires it) and watches them through the
  # `.owns(ResourceClaim)` wiring to resume the AwaitingResourceClaim
  # pause. `resourceclaims/status` is split into its own rule below
  # WITHOUT `create` — the Application controller must never write
  # claim status (the scheduler owns status.provider/Scheduled, the
  # provisioner owns status.ready/connectionSecretRef/Ready).
  #
  # 2.4f Fix A extension: the RetainedClaim GC controller GETs the
  # original ResourceClaim by `spec.claimRef` after the grace window
  # elapses — if it is back (a recovery re-claim) the GC deletes the
  # stale snapshot instead of dropping a now-live claim's role/DB. The
  # `get` verb already granted here covers that read (no new verb).
  # 2.22b (D4): `delete` — the Application controller removes a claim
  # whose `needs.*` entry the user dropped, which is what starts the
  # documented retention path (deletionTimestamp -> provisioner
  # finalizer -> RetainedClaim -> seven-day window). Four documents said
  # this already happened; nothing deleted, and this rule carried no
  # `delete`, so no code path COULD have. Granted in the same change as
  # the code that uses it — the lesson from the ADR 0048 anchor 403 and
  # the 0.2.31 MigrationPlan GC, both of which shipped a verb short.
  - apiGroups:
      - apprafter.io
    resources:
      - resourceclaims
    verbs:
      - get
      - list
      - watch
      - create
      - patch
      - update
      - delete
  # ResourceClaim status — written by the 2.3 scheduler and the
  # 2.4c provisioner only (NOT the Application controller). No
  # `create` here.
  - apiGroups:
      - apprafter.io
    resources:
      - resourceclaims/status
    verbs:
      - get
      - patch
      - update
  # Phase 2.4c resourceclaim-provisioner: provisions each
  # Scheduled pg ResourceClaim into the shared CloudNativePG
  # cluster. It lazily SSA-applies the `platform-postgres`
  # CNPG `Cluster` (created on the first matched pg claim),
  # read-modify-writes the Cluster's unkeyed
  # `spec.managed.roles` list to add a per-claim login role,
  # and applies a declarative CNPG `Database` CR. The CNPG
  # CRDs are installed at runtime by the `cloudnative-pg`
  # component (plan.md 2.4a); without these verbs the
  # provisioner 403s on its first Cluster apply and every pg
  # claim stalls Pending. Per-claim basic-auth password
  # Secrets (CNPG namespace) and the per-claim connection
  # Secret (claim namespace) are covered by the cluster-wide
  # secrets rule below.
  #
  # 2.4f extension: the RetainedClaim GC also RMW-removes the
  # per-claim role from the same Cluster (get + update) and
  # SSA-patches the Database CR to `spec.ensure: absent`
  # (patch). It does NOT delete the Database CR (the Postgres
  # reclaim default is `retain`; ensure:absent is the drop),
  # so `delete` is not strictly needed for the GC path — but it
  # is granted here so a future hard-cleanup or operator
  # break-glass can remove a stale CNPG CR without an RBAC edit.
  #
  # ADR 0042 §9 extension: that "future hard-cleanup" consumer now
  # exists — the shared-backend reaper (`reaper.rs`, the
  # `SharedBackendReaper` loop). It `delete`s the shared `Cluster`
  # once nothing references it, but only after it PATCHES the
  # instance's PersistentVolumeClaim to strip the Cluster's
  # `controller: true` ownerReference first (ADR 0042 §9.3) — an
  # unstripped delete cascades and destroys the volume; the strip
  # converts the delete into a preserved, still-`Bound` PVC that the
  # next provision re-adopts by name with its data intact. The reaper
  # never deletes the PVC itself — see the `persistentvolumeclaims`
  # rule below, where `patch` (not `delete`) is its verb.
  - apiGroups:
      - postgresql.cnpg.io
    resources:
      - clusters
      - databases
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
  # Phase 2.6 dragonfly arm: the provisioner lazily SSA-applies the
  # shared `Dragonfly` pool instances (plural `dragonflies`, group
  # `dragonflydb.io`) the first matched redis claim creates, and the
  # GC may delete a stale instance on hard cleanup. The dragonfly-
  # operator CRD is installed at runtime by the `dragonfly-operator`
  # component (plan.md 2.6-1); without these verbs the provisioner
  # 403s on its first `Dragonfly` apply and every redis claim stalls
  # Pending. The per-instance admin-password Secret (dragonfly-system)
  # and the per-claim connection Secret (claim namespace) are covered
  # by the cluster-wide secrets rule below.
  #
  # ADR 0042 §9: "the GC may delete a stale instance on hard cleanup"
  # above was a prophecy — the shared-backend reaper (`reaper.rs`, the
  # `SharedBackendReaper` loop) is now that consumer. It deletes ONLY
  # the `Dragonfly` CR of a stamped, tenantless pool instance:
  #
  #   - it NEVER deletes the snapshot PVC (measured on
  #     dragonfly-operator v1.5.0: unowned, `Retain` retention policy,
  #     survives the delete and is re-adopted by name with its data
  #     intact on the next provision — ADR 0042 §9.2/§9.5);
  #   - it NEVER deletes `<instance>-admin`.
  #
  # The `persistentvolumeclaims: delete` and `secrets: delete` rules
  # elsewhere in this file WOULD permit either of those deletes — the
  # restriction is enforced in `reaper.rs` and code review, not by
  # this ClusterRole.
  - apiGroups:
      - dragonflydb.io
    resources:
      - dragonflies
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
  # Phase 2.6b disk arm (ADR 0043): the provisioner SSA-applies a
  # standalone ReadWriteOnce PersistentVolumeClaim (group "", core/v1)
  # per `type: disk` claim into the app namespace, and the RetainedClaim
  # GC deletes it after the 7-day grace. The PVC is UNOWNED (no
  # ownerReference) so it survives an app delete + redeploy (retention);
  # without these verbs the disk provisioner 403s on its first PVC apply
  # and every disk claim stalls Pending, and the GC cannot drop the PVC
  # after grace. `delete` covers the GC drop; `get`/`list`/`watch` and
  # the apply verbs cover provisioning + idempotent reattach.
  #
  # Phase 2.6c extension: the SharedVolume reconciler also SSA-applies
  # an unowned RWO PVC (the shared-volume backing PVC `sv-<ns>-<name>`)
  # and its deletion finalizer deletes it on `SharedVolume` remove. Same
  # verbs already granted here; no new rule needed — noted for clarity.
  #
  # ADR 0042 §9 extension: the shared-backend reaper (`reaper.rs`) is a
  # `patch` consumer of this rule too — before it deletes the shared
  # CNPG `Cluster` it strips that Cluster's ownerReference off the
  # instance's PVC (§9.3) so the volume survives the cascade. It never
  # deletes a PVC of either backend; `delete` above is not a verb the
  # reaper uses.
  - apiGroups:
      - ""
    resources:
      - persistentvolumeclaims
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
  # Phase 2.6c SharedVolume CRD (ADR 0049): the SharedVolume reconciler
  # (in the resourceclaim-provisioner binary) watches SharedVolume CRs,
  # SSA-writes their `.status` (ready / pvcRef / refCount / capacity /
  # conditions), and manages the `apprafter.io/sharedvolume-pvc-cleanup`
  # finalizer via merge-patch. `/status` and `/finalizers` are separate
  # subresource rules so the provisioner can patch status without
  # implicitly owning the whole resource. Without these verbs the
  # SharedVolume controller 403s on its first list/watch call and every
  # SharedVolume stalls.
  #
  # The operator NEVER creates or deletes SharedVolume CRs — that is the
  # CLI's job (`apprafter volume create/rm`). The finalizer only deletes
  # the backing PVC (via the persistentvolumeclaims rule above) and then
  # drops its own finalizer entry via patch. `create` and `delete` on
  # the parent resource and /finalizers subresource are therefore not
  # granted here (least-privilege).
  - apiGroups:
      - apprafter.io
    resources:
      - sharedvolumes
      - sharedvolumes/finalizers
    verbs:
      - get
      - list
      - watch
      - update
      - patch
  - apiGroups:
      - apprafter.io
    resources:
      - sharedvolumes/status
    verbs:
      - get
      - patch
      - update
  # Phase 2.6c capacity-signal (ADR 0049, Task 11): the SharedVolume
  # reconciler samples the kubelet Summary API per-reconcile via the
  # apiserver node-proxy subresource
  # (`GET /api/v1/nodes/{node}/proxy/stats/summary`, RBAC group ""
  # resource `nodes/proxy`, verb `get`). On single-node T1 all
  # local-path PVCs live on the one node, so one node-proxy fetch
  # yields both the node-free fraction (CapacityWarning trigger) and
  # the PVC's own used/capacity bytes. The fetch is BEST-EFFORT — any
  # RBAC denial / kubelet unreachable / parse error is logged and
  # swallowed (capacity simply absent that cycle, never fails the
  # reconcile). `nodes` get/list is needed for `first_node_name` (the
  # single-node lookup that identifies which node to proxy through).
  - apiGroups:
      - ""
    resources:
      - nodes
    verbs:
      - get
      - list
  - apiGroups:
      - ""
    resources:
      - nodes/proxy
    verbs:
      - get
  # 2.22d (D8): `pods/proxy` — the provisioner scrapes the CNPG instance
  # manager's Prometheus exporter (:9187/metrics) to read
  # `cnpg_pg_database_size_bytes` for each tenant database. This is why the
  # operator needs no SQL client and takes no connection slot from the shared
  # cluster: the exporter holds its own. Granted in the same change as the
  # code that uses it — the ADR 0048 / 0.2.31 lesson.
  - apiGroups:
      - ""
    resources:
      - pods/proxy
    verbs:
      - get
  # 2.22d (D10): `pods` list — the Application controller reads its own app's
  # pods to find out why a VPA in-place resize has not landed. The kubelet
  # states it on the pod (`PodResizePending` / `PodResizeInProgress`); the VPA
  # CR carries nothing, so there is no other source. Under `InPlace` the
  # updater never evicts, which makes a blocked resize silent and indefinite
  # unless something reads this. Granted in the same change as the code that
  # uses it — the ADR 0048 / 0.2.31 lesson, which we have now paid for twice.
  - apiGroups:
      - ""
    resources:
      - pods
    verbs:
      - list
  # Phase 2.4f RetainedClaim CRD — written by the provisioner
  # finalizer (the deletion snapshot: create/patch via SSA) and
  # consumed + deleted by the RetainedClaim GC controller (the
  # 7th controller). The snapshot lives in apprafter-system but
  # the GC watches cluster-wide, so the rule is part of the
  # ClusterRole. The per-claim role/DB/password-Secret drops
  # the GC performs are covered by the postgresql.cnpg.io rule
  # above and the cluster-wide secrets rule below.
  - apiGroups:
      - apprafter.io
    resources:
      - retainedclaims
    verbs:
      - get
      - list
      - watch
      - create
      - patch
      - delete
  # `delete` (S5): the derived-Secret GC finalizer removes the
  # cross-namespace Argo `repo-creds` + canonical
  # `dockerconfigjson` on SourceCredential deletion (no
  # ownerReference cascade is possible across namespaces).
  - apiGroups:
      - ""
    resources:
      - secrets
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
  - apiGroups:
      - gateway.networking.k8s.io
    resources:
      - httproutes
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
  # Phase 2.10 egress (ADR 0045): the Application controller SSA-applies one
  # per-Application `CiliumNetworkPolicy` (cilium.io/v2) that makes the app's
  # pods egress default-deny and allows DNS + same-ns + world (profile-gated)
  # + one rule per declared network need. Cilium is a bootstrap dependency, so
  # the CRD is already Established; without these verbs the controller 403s on
  # its first CNP apply and every Application's egress stays wide open. The
  # apply is additionally gated at runtime on the CNP CRD being served (the
  # `customresourcedefinitions get` rule below) so non-Cilium clusters skip it.
  # `platformstacks` get/list/watch (read the cluster-wide egress profile) is
  # already granted by the PlatformController rule above.
  - apiGroups:
      - cilium.io
    resources:
      - ciliumnetworkpolicies
    verbs:
      - get
      - list
      - watch
      - create
      - patch
      - delete
  # 2.16e (ADR 0054): the operator emits one VerticalPodAutoscaler per managed
  # app-env, prunes it on the managed→pro transition, and reads its
  # `status.recommendation` to mirror into Application.status. VPACheckpoint is
  # read-only (durability is the recommender's concern, not the operator's).
  - apiGroups:
      - autoscaling.k8s.io
    resources:
      - verticalpodautoscalers
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
  - apiGroups:
      - autoscaling.k8s.io
    resources:
      - verticalpodautoscalercheckpoints
    verbs:
      - get
      - list
      - watch
  # The operator probes ONCE at startup whether the
  # `ciliumnetworkpolicies.cilium.io` CRD is served (a single CRD GET) to
  # decide whether to apply egress CNPs — on a non-Cilium cluster (e2e /
  # kindnet) applying a CNP would 404 every reconcile.
  - apiGroups:
      - apiextensions.k8s.io
    resources:
      - customresourcedefinitions
    verbs:
      - get
  # Events — operators emit events on Application status changes
  # (legacy core/v1) AND PlatformController emits foreign-writer /
  # source-reverted audit events on PlatformStack
  # (events.k8s.io/v1, walk-fix #6 v0.1.119 → v0.1.120). kube-rs's
  # `Recorder::publish` uses the v1 events API; the legacy ""
  # group is kept for the older Application-controller emission
  # path.
  - apiGroups:
      - ""
    resources:
      - events
    verbs:
      - create
      - patch
  - apiGroups:
      - events.k8s.io
    resources:
      - events
    verbs:
      - create
      - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "apprafter-operator.fullname" . }}
  labels:
    {{- include "apprafter-operator.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "apprafter-operator.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "apprafter-operator.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
---
# Lease for leader election — namespaced to the operator's own
# namespace so the blast radius stays small.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "apprafter-operator.fullname" . }}-leader
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "apprafter-operator.labels" . | nindent 4 }}
rules:
  - apiGroups:
      - coordination.k8s.io
    resources:
      - leases
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "apprafter-operator.fullname" . }}-leader
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "apprafter-operator.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "apprafter-operator.fullname" . }}-leader
subjects:
  - kind: ServiceAccount
    name: {{ include "apprafter-operator.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
