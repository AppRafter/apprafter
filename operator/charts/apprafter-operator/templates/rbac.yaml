# SPDX-License-Identifier: MIT
{{- if .Values.rbac.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "apprafter-operator.fullname" . }}
  labels:
    {{- include "apprafter-operator.labels" . | nindent 4 }}
rules:
  # Application CRD — watch + status update.
  - apiGroups:
      - apprafter.io
    resources:
      - applications
      - applications/status
    verbs:
      - get
      - list
      - watch
      - patch
      - update
  # PlatformStack CRD — watched by the PlatformController in the
  # same operator binary (B.1.73). Without these the controller
  # fails silently on its first list/watch call and the
  # PlatformStack's `.status` never populates. Walk-found bug
  # v0.1.114 → v0.1.115.
  #
  # B.1.76 extension: PlatformMigrationStrategy.reject also
  # SSA-patches PlatformStack.spec.pin under the field manager
  # `migration-controller-strategy`. The same ClusterRole
  # rule covers both the PlatformController status writes and
  # the strategy's reject patch because RBAC is verb-based,
  # not field-manager-based.
  - apiGroups:
      - apprafter.io
    resources:
      - platformstacks
      - platformstacks/status
    verbs:
      - get
      - list
      - watch
      - patch
      - update
  # MigrationPlan CRD — watched by the MigrationController in
  # the same operator binary (B.1.76). The controller writes
  # `.status` via SSA with field manager `migration-controller`;
  # /status verb scoped separately so the operator can patch
  # status even if subresource RBAC tightens later.
  #
  # B.1.78 extension: PlatformController CREATES MigrationPlan
  # CRs on destructive transitions detected during the bump
  # cycle. `create` verb on the parent `migrationplans`
  # resource enables that path. Without it,
  # `create_platform_migration_plan` would 403 forbidden and
  # the controller would never gate destructive platform-stack
  # upgrades — silently bumping past breaking changes.
  - apiGroups:
      - apprafter.io
    resources:
      - migrationplans
      - migrationplans/status
    verbs:
      - get
      - list
      - watch
      - create
      - patch
      - update
  # Argo CD's `Application` CRD lives under argoproj.io. The
  # PlatformController SSA-patches the parent `platform`
  # Application in the `argocd` namespace with field manager
  # `platform-controller`; cluster-scoped get/patch is the
  # narrowest viable shape since the resource lives outside the
  # operator's own namespace.
  - apiGroups:
      - argoproj.io
    resources:
      - applications
    verbs:
      - get
      - list
      - watch
      - patch
      - update
  # Owned children — phase 1.9 will create + manage these.
  - apiGroups:
      - apps
    resources:
      - deployments
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
  - apiGroups:
      - ""
    resources:
      - services
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
  # SourceCredential CRD + its derivations (1.79c / ADR 0039).
  # The controller watches SourceCredentials, reads the
  # controller-unsealed material Secret (in apprafter-system),
  # and SSA-writes the derived Argo `repo-creds` Secret (in
  # `argocd`) and the workload `dockerconfigjson` pull-secret
  # (in app namespaces). Cluster-scoped because the material,
  # repo-cred, and pull-secret live in different namespaces; the
  # operator is the only holder of derived credential material
  # (ADR 0024 Layer 2). `patch`/`update` on `sourcecredentials`
  # also writes the cleanup finalizer (S5).
  - apiGroups:
      - apprafter.io
    resources:
      - sourcecredentials
      - sourcecredentials/status
    verbs:
      - get
      - list
      - watch
      - patch
      - update
  # `delete` (S5): the derived-Secret GC finalizer removes the
  # cross-namespace Argo `repo-creds` + canonical
  # `dockerconfigjson` on SourceCredential deletion (no
  # ownerReference cascade is possible across namespaces).
  - apiGroups:
      - ""
    resources:
      - secrets
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
  - apiGroups:
      - gateway.networking.k8s.io
    resources:
      - httproutes
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
  # Events — operators emit events on Application status changes
  # (legacy core/v1) AND PlatformController emits foreign-writer /
  # source-reverted audit events on PlatformStack
  # (events.k8s.io/v1, walk-fix #6 v0.1.119 → v0.1.120). kube-rs's
  # `Recorder::publish` uses the v1 events API; the legacy ""
  # group is kept for the older Application-controller emission
  # path.
  - apiGroups:
      - ""
    resources:
      - events
    verbs:
      - create
      - patch
  - apiGroups:
      - events.k8s.io
    resources:
      - events
    verbs:
      - create
      - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "apprafter-operator.fullname" . }}
  labels:
    {{- include "apprafter-operator.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "apprafter-operator.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "apprafter-operator.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
---
# Lease for leader election — namespaced to the operator's own
# namespace so the blast radius stays small.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "apprafter-operator.fullname" . }}-leader
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "apprafter-operator.labels" . | nindent 4 }}
rules:
  - apiGroups:
      - coordination.k8s.io
    resources:
      - leases
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "apprafter-operator.fullname" . }}-leader
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "apprafter-operator.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "apprafter-operator.fullname" . }}-leader
subjects:
  - kind: ServiceAccount
    name: {{ include "apprafter-operator.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
