# SPDX-License-Identifier: MIT
# v1alpha1 Application CRD. Hand-rolled OpenAPI v3 mirror of
# schemas/v1alpha1/application.cue plus the field-shape
# constraints the OpenAPI v3 layer can express. Cross-field
# rules (image reachable via base or environments; env key
# shape) live in the admission webhook.
#
# Track B.1.72 restoration: B.1.71 removed the CLI-side
# imperative `kubectl apply` path for this CRD (the
# `application_crd.rs` constant) without shipping a chart-side
# replacement. This template closes the gap; Argo CD applies
# it via the operator chart at sync-wave -5 (after cert-manager
# at -10, before operator workloads at default 0).
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: applications.apprafter.io
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
    argocd.argoproj.io/sync-options: ServerSideApply=true
  labels:
    {{- include "apprafter-operator.labels" . | nindent 4 }}
spec:
  group: apprafter.io
  scope: Namespaced
  names:
    plural: applications
    singular: application
    kind: Application
    listKind: ApplicationList
    shortNames:
      - app
      - apps
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              properties:
                base:
                  type: object
                  properties:
                    image:
                      type: string
                      pattern: "^.+$"
                    replicas:
                      type: integer
                      minimum: 0
                    expose:
                      type: object
                      required: [port]
                      properties:
                        port:
                          type: integer
                          minimum: 1
                          maximum: 65535
                        public:
                          type: boolean
                        network:
                          type: string
                          enum: [public, internal, vpn]
                    # env (2.12 / ADR 0046): values are string | {claim:string}
                    # | {secret:string} — a string-or-object union. A structural
                    # CRD node cannot declare `type: [string, object]`; using
                    # x-kubernetes-preserve-unknown-fields mirrors the same
                    # escape hatch `needs` uses for its scalar|array union.
                    # The admission webhook enforces claim/secret format rules.
                    env:
                      type: object
                      additionalProperties:
                        x-kubernetes-preserve-unknown-fields: true
                    # needs (2.6b / ADR 0043): an explicit closed struct.
                    # Each service key accepts a SCALAR #ServiceNeed object OR
                    # an ARRAY of named #ServiceNeeds; `disk` carries a
                    # #DiskClaim (object OR array). A scalar|array union is a
                    # HETEROGENEOUS-type union (object vs array) — a structural
                    # CRD node can declare exactly ONE `type`, and a `oneOf`
                    # spanning two different top-level `type`s is rejected by
                    # the apiserver's structural-schema requirement ("oneOf[*].
                    # type: Forbidden: must be empty to be structural" / the
                    # node "must not be empty for specified object fields").
                    # This is NOT the 2.4h closed-object regression class —
                    # it is a genuine structural-schema limitation, so each
                    # union key uses x-kubernetes-preserve-unknown-fields (the
                    # same escape hatch the MigrationPlan/SourceCredential CRDs
                    # use for their oneOf shapes). The admission webhook WILL
                    # enforce the key-enum / (type,name) / disk-field invariants
                    # (size/mountPath required, class enum) as the runtime gate
                    # — those guards land in 2.6b-2 / -4 / -5; today the CRD
                    # only types `needs` as an object with these known keys.
                    needs:
                      type: object
                      properties:
                        pg:
                          x-kubernetes-preserve-unknown-fields: true
                        jetstream:
                          x-kubernetes-preserve-unknown-fields: true
                        clickhouse:
                          x-kubernetes-preserve-unknown-fields: true
                        redis:
                          x-kubernetes-preserve-unknown-fields: true
                        s3:
                          x-kubernetes-preserve-unknown-fields: true
                        notifications:
                          x-kubernetes-preserve-unknown-fields: true
                        disk:
                          x-kubernetes-preserve-unknown-fields: true
                    imagePolicy:
                      type: object
                      properties:
                        resolve:
                          type: string
                          enum: ["digest", "off"]
                environments:
                  type: object
                  additionalProperties:
                    type: object
                    properties:
                      image:
                        type: string
                        pattern: "^.+$"
                      replicas:
                        type: integer
                        minimum: 0
                      expose:
                        type: object
                        required: [port]
                        properties:
                          port:
                            type: integer
                            minimum: 1
                            maximum: 65535
                          public:
                            type: boolean
                          network:
                            type: string
                            enum: [public, internal, vpn]
                      # env (2.12 / ADR 0046): same string-or-object union as
                      # spec.base.env — x-kubernetes-preserve-unknown-fields.
                      env:
                        type: object
                        additionalProperties:
                          x-kubernetes-preserve-unknown-fields: true
                      # needs (2.6b / ADR 0043): same closed-struct shape as
                      # spec.base.needs. Each union key uses x-kubernetes-
                      # preserve-unknown-fields (scalar object | array of
                      # named entries is a heterogeneous-type union a
                      # structural CRD node cannot type). The webhook WILL
                      # enforce the key-enum / (type,name) / disk-field
                      # invariants as the runtime gate (2.6b-2 / -4 / -5).
                      needs:
                        type: object
                        properties:
                          pg:
                            x-kubernetes-preserve-unknown-fields: true
                          jetstream:
                            x-kubernetes-preserve-unknown-fields: true
                          clickhouse:
                            x-kubernetes-preserve-unknown-fields: true
                          redis:
                            x-kubernetes-preserve-unknown-fields: true
                          s3:
                            x-kubernetes-preserve-unknown-fields: true
                          notifications:
                            x-kubernetes-preserve-unknown-fields: true
                          disk:
                            x-kubernetes-preserve-unknown-fields: true
                      imagePolicy:
                        type: object
                        properties:
                          resolve:
                            type: string
                            enum: ["digest", "off"]
                environment:
                  type: string
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
              properties:
                image:
                  type: object
                  properties:
                    tag: { type: string }
                    resolved: { type: string }
                    resolvedAt: { type: string }
                environment:
                  type: string
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
