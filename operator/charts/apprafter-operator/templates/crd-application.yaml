# SPDX-License-Identifier: MIT
# v1alpha1 Application CRD. Hand-rolled OpenAPI v3 mirror of
# schemas/v1alpha1/application.cue plus the field-shape
# constraints the OpenAPI v3 layer can express. Cross-field
# rules (image reachable via base or environments; env key
# shape) live in the admission webhook.
#
# Track B.1.72 restoration: B.1.71 removed the CLI-side
# imperative `kubectl apply` path for this CRD (the
# `application_crd.rs` constant) without shipping a chart-side
# replacement. This template closes the gap; Argo CD applies
# it via the operator chart at sync-wave -5 (after cert-manager
# at -10, before operator workloads at default 0).
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: applications.apprafter.io
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
    argocd.argoproj.io/sync-options: ServerSideApply=true
  labels:
    {{- include "apprafter-operator.labels" . | nindent 4 }}
spec:
  group: apprafter.io
  scope: Namespaced
  names:
    plural: applications
    singular: application
    kind: Application
    listKind: ApplicationList
    shortNames:
      - app
      - apps
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              properties:
                base:
                  type: object
                  properties:
                    image:
                      type: string
                      pattern: "^.+$"
                    replicas:
                      type: integer
                      minimum: 0
                    expose:
                      type: object
                      required: [port]
                      properties:
                        port:
                          type: integer
                          minimum: 1
                          maximum: 65535
                        public:
                          type: boolean
                        network:
                          type: string
                          enum: [public, internal, vpn]
                    env:
                      type: object
                      additionalProperties:
                        type: string
                    needs:
                      type: object
                      additionalProperties:
                        type: object
                        properties:
                          selector:
                            type: object
                            additionalProperties:
                              type: string
                            minProperties: 1
                          size:
                            type: string
                            enum: [nano, small, medium, large, xlarge]
                          persistent:
                            type: boolean
                    imagePolicy:
                      type: object
                      properties:
                        resolve:
                          type: string
                          enum: ["digest", "off"]
                environments:
                  type: object
                  additionalProperties:
                    type: object
                    properties:
                      image:
                        type: string
                        pattern: "^.+$"
                      replicas:
                        type: integer
                        minimum: 0
                      expose:
                        type: object
                        required: [port]
                        properties:
                          port:
                            type: integer
                            minimum: 1
                            maximum: 65535
                          public:
                            type: boolean
                          network:
                            type: string
                            enum: [public, internal, vpn]
                      env:
                        type: object
                        additionalProperties:
                          type: string
                      needs:
                        type: object
                        additionalProperties:
                          type: object
                          properties:
                            selector:
                              type: object
                              additionalProperties:
                                type: string
                              minProperties: 1
                            size:
                              type: string
                              enum: [nano, small, medium, large, xlarge]
                            persistent:
                              type: boolean
                      imagePolicy:
                        type: object
                        properties:
                          resolve:
                            type: string
                            enum: ["digest", "off"]
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
              properties:
                image:
                  type: object
                  properties:
                    tag: { type: string }
                    resolved: { type: string }
                    resolvedAt: { type: string }
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
