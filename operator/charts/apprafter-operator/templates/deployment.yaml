# SPDX-License-Identifier: MIT
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "apprafter-operator.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "apprafter-operator.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "apprafter-operator.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "apprafter-operator.labels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "apprafter-operator.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: operator
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          # Explicit command — does not rely on the image
          # manifest's ENTRYPOINT field. containerd on k3s
          # v1.35 rejects pods with `failed to generate spec:
          # no command specified` if the image manifest lacks
          # ENTRYPOINT for any reason (walk-found bug v0.1.104
          # → v0.1.105). Hard-wiring `command` here keeps the
          # chart bullet-proof against image-manifest edge
          # cases.
          command: ["/apprafter-operator"]
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: HTTP_PORT
              value: {{ .Values.httpPort | quote }}
            - name: RUST_LOG
              value: {{ .Values.logLevel | quote }}
          ports:
            - name: http
              containerPort: {{ .Values.httpPort }}
              protocol: TCP
          # The operator binary is a pure-Rust musl-static image
          # that boots in ms; the previous 10s/5s initial delays
          # added pointless wait to every cold start. The
          # startupProbe gives a generous grace window for the
          # genuinely-slow first boot while keeping
          # liveness/readiness tight afterwards.
          startupProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 1
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 1
            periodSeconds: 5
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
