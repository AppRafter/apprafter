# SPDX-License-Identifier: MIT
# v1alpha1 PlatformStack CRD. Hand-rolled OpenAPI v3 mirror of
# schemas/v1alpha1/platformstack.cue. Singleton enforcement
# (name=default, namespace=apprafter-system) is the webhook's
# job — OpenAPI v3 can't express name+namespace constraints.
#
# `values` uses x-kubernetes-preserve-unknown-fields to allow
# tier-specific fields the chart adds over time without each
# new field requiring a CRD bump. Cross-field rules
# (checkInterval >= 1h, channel enum mirror as defence-in-depth)
# live in the admission webhook.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: platformstacks.apprafter.io
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
    argocd.argoproj.io/sync-options: ServerSideApply=true
  labels:
    {{- include "apprafter-operator.labels" . | nindent 4 }}
spec:
  group: apprafter.io
  scope: Namespaced
  names:
    plural: platformstacks
    singular: platformstack
    kind: PlatformStack
    listKind: PlatformStackList
    shortNames:
      - ps
      - pstack
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              required: [source, values]
              properties:
                channel:
                  type: string
                  enum: [stable, beta, edge]
                  default: stable
                pin:
                  type: string
                  pattern: "^[0-9]+\\.[0-9]+\\.[0-9]+(-[0-9A-Za-z.-]+)?$"
                autoUpgrade:
                  type: boolean
                  default: false
                defaultEnvironment:
                  type: string
                source:
                  type: object
                  required: [upstream, repoURL, checkInterval]
                  properties:
                    upstream:
                      type: string
                      pattern: "^oci://.+$"
                      default: "oci://ghcr.io/apprafter/platform-stack"
                    repoURL:
                      type: string
                      pattern: "^oci://.+$"
                      default: "oci://ghcr.io/apprafter/platform-stack"
                    checkInterval:
                      type: string
                      pattern: "^[0-9]+(h|m|s)$"
                      default: "6h"
                values:
                  type: object
                  required: [tier]
                  properties:
                    tier:
                      type: integer
                      enum: [1, 2, 3, 4]
                    domain:
                      type: string
                  x-kubernetes-preserve-unknown-fields: true
                overrides:
                  type: object
                  additionalProperties:
                    type: object
                    properties:
                      pin:
                        type: string
                      values:
                        type: object
                        x-kubernetes-preserve-unknown-fields: true
                      enabled:
                        type: boolean
            status:
              type: object
              properties:
                currentVersion:
                  type: string
                targetVersion:
                  type: string
                availableVersion:
                  type: string
                lastUpstreamCheck:
                  type: string
                  format: date-time
                components:
                  type: array
                  items:
                    type: object
                    required: [name, version, ready]
                    properties:
                      name:
                        type: string
                      version:
                        type: string
                      ready:
                        type: boolean
                versionHistory:
                  type: array
                  items:
                    type: object
                    required: [version, appliedAt, outcome]
                    properties:
                      version:
                        type: string
                      appliedAt:
                        type: string
                        format: date-time
                      outcome:
                        type: string
                        enum: [succeeded, rolled-back, failed]
                conditions:
                  type: array
                  items:
                    type: object
                    required: [type, status, lastTransitionTime]
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                        enum: ["True", "False", "Unknown"]
                      reason:
                        type: string
                      message:
                        type: string
                      lastTransitionTime:
                        type: string
                        format: date-time
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Channel
          type: string
          jsonPath: .spec.channel
        - name: Pin
          type: string
          jsonPath: .spec.pin
        - name: Current
          type: string
          jsonPath: .status.currentVersion
        - name: Available
          type: string
          jsonPath: .status.availableVersion
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
