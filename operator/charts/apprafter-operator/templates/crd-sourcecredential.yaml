# SPDX-License-Identifier: MIT
# v1alpha1 SourceCredential CRD. Hand-rolled OpenAPI v3 mirror of
# schemas/v1alpha1/sourcecredential.cue and the operator-core
# kube-rs type. Cross-field rules the structural schema cannot
# express — at least one of git/registry, and "exactly one backend
# kind per half" — live in the admission webhook
# (validator_sourcecredential.rs). `backend` carries BOTH
# sealedSecretRef and openBaoPath as optional (the apiserver's
# structural-schema requirement rejects oneOf), mirroring the
# MigrationPlan scope-discriminator pattern.
#
# Argo CD applies this via the operator chart at sync-wave -5
# (after cert-manager at -10, before operator workloads at 0).
# See ADR 0039 / plan.md 1.79c.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: sourcecredentials.apprafter.io
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
    argocd.argoproj.io/sync-options: ServerSideApply=true
  labels:
    {{- include "apprafter-operator.labels" . | nindent 4 }}
spec:
  group: apprafter.io
  scope: Namespaced
  names:
    plural: sourcecredentials
    singular: sourcecredential
    kind: SourceCredential
    listKind: SourceCredentialList
    shortNames:
      - srccred
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              properties:
                git:
                  type: object
                  required: [backend, repoPrefixes]
                  properties:
                    backend:
                      type: object
                      properties:
                        sealedSecretRef:
                          type: object
                          required: [name]
                          properties:
                            name:
                              type: string
                              pattern: "^.+$"
                            namespace:
                              type: string
                        openBaoPath:
                          type: string
                          pattern: "^.+$"
                    repoPrefixes:
                      type: array
                      minItems: 1
                      items:
                        type: string
                        pattern: "^.+$"
                registry:
                  type: object
                  required: [backend, hosts]
                  properties:
                    backend:
                      type: object
                      properties:
                        sealedSecretRef:
                          type: object
                          required: [name]
                          properties:
                            name:
                              type: string
                              pattern: "^.+$"
                            namespace:
                              type: string
                        openBaoPath:
                          type: string
                          pattern: "^.+$"
                    hosts:
                      type: array
                      minItems: 1
                      items:
                        type: string
                        pattern: "^.+$"
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
