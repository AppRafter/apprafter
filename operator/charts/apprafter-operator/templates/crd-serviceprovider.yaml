# SPDX-License-Identifier: MIT
# v1alpha1 ServiceProvider CRD. Hand-rolled OpenAPI v3 mirror of
# schemas/v1alpha1/serviceprovider.cue. `config` uses
# x-kubernetes-preserve-unknown-fields (backend-defined, opaque to
# the platform). The closed `type` enum is mirrored in the admission
# webhook for a clearer message + the future plugin-extension path.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: serviceproviders.apprafter.io
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
    argocd.argoproj.io/sync-options: ServerSideApply=true
  labels:
    {{- include "apprafter-operator.labels" . | nindent 4 }}
spec:
  group: apprafter.io
  scope: Namespaced
  names:
    plural: serviceproviders
    singular: serviceprovider
    kind: ServiceProvider
    listKind: ServiceProviderList
    shortNames:
      - sp
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              required: [type, backend]
              properties:
                type:
                  type: string
                  enum: [pg, jetstream, clickhouse, redis, s3, notifications]
                backend:
                  type: string
                  minLength: 1
                config:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
            status:
              type: object
              properties:
                health:
                  type: string
                  enum: [healthy, degraded, unhealthy, unknown]
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Type
          type: string
          jsonPath: .spec.type
        - name: Backend
          type: string
          jsonPath: .spec.backend
        - name: Health
          type: string
          jsonPath: .status.health
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
