# SPDX-License-Identifier: MIT
# Default values for the apprafter-admission-webhook chart.

image:
  repository: ghcr.io/apprafter/apprafter-admission-webhook
  pullPolicy: IfNotPresent
  tag: ""  # falls back to .Chart.AppVersion when empty

imagePullSecrets: []

replicas: 1

# cert-manager ClusterIssuer that signs the webhook TLS cert.
# The platform-stack chart installs `apprafter-selfsigned`
# alongside cert-manager.
certIssuer:
  kind: ClusterIssuer
  name: apprafter-selfsigned

# Per-pod and container security contexts. Tightened to match
# the operator chart's contract — non-root, read-only rootfs.
podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 65532

# Request trimmed 64Mi -> 16Mi (0.2.56 node-saturation fix). 2.16d
# baseline measured this pod at 1Mi with the same "already set —
# keep" annotation that dropped it from that measurement's sum. On
# the dogfood cluster 2026-08-21 this pod fell below `kubectl top`'s
# 5Mi reporting cutoff, so no precise live figure exists — just
# confirmation it's comfortably under 16Mi.
#
# limits.cpu removed per ADR 0053 §1 ("modest CPU request, no CPU
# limit" for platform components — a CPU limit only adds latency
# cliffs with no safety benefit, and CPU is compressible so
# throttling, not OOM, is the actual risk). This pod is
# request/response with no watch cache, unlike the operator. The
# memory limit is unchanged.
resources:
  requests:
    cpu: 20m
    memory: 16Mi
  limits:
    memory: 256Mi

# ValidatingWebhookConfiguration knobs. `failurePolicy: Fail`
# is the safe default — admission requests that can't reach
# the webhook are REJECTED rather than silently allowed.
# Cluster-builders who deliberately want the webhook off
# during incident response can set this to `Ignore`.
webhook:
  failurePolicy: Fail
  timeoutSeconds: 10
