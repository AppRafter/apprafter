apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ include "apprafter-admission-webhook.tlsSecretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "apprafter-admission-webhook.labels" . | nindent 4 }}
spec:
  secretName: {{ include "apprafter-admission-webhook.tlsSecretName" . }}
  dnsNames:
    - {{ include "apprafter-admission-webhook.fullname" . }}.{{ .Release.Namespace }}
    - {{ include "apprafter-admission-webhook.fullname" . }}.{{ .Release.Namespace }}.svc
    - {{ include "apprafter-admission-webhook.fullname" . }}.{{ .Release.Namespace }}.svc.cluster.local
  issuerRef:
    name: {{ .Values.certIssuer.name }}
    kind: {{ .Values.certIssuer.kind }}
