apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "apprafter-admission-webhook.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "apprafter-admission-webhook.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      {{- include "apprafter-admission-webhook.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "apprafter-admission-webhook.labels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ include "apprafter-admission-webhook.name" . }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          # See operator chart's deployment.yaml for rationale
          # — explicit command, no reliance on image
          # manifest's ENTRYPOINT.
          command: ["/admission-webhook"]
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: https
              containerPort: 8443
              protocol: TCP
          env:
            - name: PORT
              value: "8443"
            - name: TLS_CERT_PATH
              value: /tls/tls.crt
            - name: TLS_KEY_PATH
              value: /tls/tls.key
            # 2.16b-sec (F-1): the AUTHENTICATED operator ServiceAccount the
            # status guards + ResourceClaim/RetainedClaim identity gates check
            # `request.userInfo.username` against. Templated on the actual
            # release namespace so a namespace change cannot silently open or
            # close writes (the reviewer's F-1 footgun); the binary falls back
            # to `system:serviceaccount:apprafter-system:apprafter-operator`
            # when unset (keeps a mis-deploy + tests safe).
            - name: OPERATOR_SERVICEACCOUNT
              value: "system:serviceaccount:{{ .Release.Namespace }}:apprafter-operator"
          # The webhook binary is a pure-Rust musl-static image
          # that boots in ms; the previous 10s/5s initial delays
          # added pointless wait to every cold start. The
          # startupProbe gives a generous grace window for the
          # genuinely-slow first boot while keeping
          # liveness/readiness tight afterwards.
          startupProbe:
            httpGet:
              path: /readyz
              port: https
              scheme: HTTPS
            periodSeconds: 1
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /readyz
              port: https
              scheme: HTTPS
            initialDelaySeconds: 1
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: https
              scheme: HTTPS
            initialDelaySeconds: 2
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: tls
              mountPath: /tls
              readOnly: true
      volumes:
        - name: tls
          secret:
            secretName: {{ include "apprafter-admission-webhook.tlsSecretName" . }}
