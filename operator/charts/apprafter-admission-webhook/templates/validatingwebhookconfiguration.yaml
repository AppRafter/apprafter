apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: admission-webhook.apprafter.io
  labels:
    {{- include "apprafter-admission-webhook.labels" . | nindent 4 }}
  annotations:
    cert-manager.io/inject-ca-from: {{ printf "%s/%s" .Release.Namespace (include "apprafter-admission-webhook.tlsSecretName" .) }}
webhooks:
  - name: applications.apprafter.io
    sideEffects: None
    failurePolicy: {{ .Values.webhook.failurePolicy }}
    admissionReviewVersions:
      - v1
    timeoutSeconds: {{ .Values.webhook.timeoutSeconds }}
    clientConfig:
      service:
        name: {{ include "apprafter-admission-webhook.fullname" . }}
        namespace: {{ .Release.Namespace }}
        path: /validate
        port: 443
    rules:
      - apiGroups:
          - apprafter.io
        apiVersions:
          - v1alpha1
        operations:
          - CREATE
          - UPDATE
        resources:
          - applications
        scope: Namespaced
  - name: platformstacks.apprafter.io
    sideEffects: None
    failurePolicy: {{ .Values.webhook.failurePolicy }}
    admissionReviewVersions:
      - v1
    timeoutSeconds: {{ .Values.webhook.timeoutSeconds }}
    clientConfig:
      service:
        name: {{ include "apprafter-admission-webhook.fullname" . }}
        namespace: {{ .Release.Namespace }}
        path: /validate
        port: 443
    rules:
      - apiGroups:
          - apprafter.io
        apiVersions:
          - v1alpha1
        operations:
          - CREATE
          - UPDATE
        resources:
          - platformstacks
        scope: Namespaced
  - name: migrationplans.apprafter.io
    sideEffects: None
    failurePolicy: {{ .Values.webhook.failurePolicy }}
    admissionReviewVersions:
      - v1
    timeoutSeconds: {{ .Values.webhook.timeoutSeconds }}
    clientConfig:
      service:
        name: {{ include "apprafter-admission-webhook.fullname" . }}
        namespace: {{ .Release.Namespace }}
        path: /validate
        port: 443
    rules:
      # `migrationplans` + `migrationplans/status` BOTH listed.
      # `kubectl patch --subresource=status -p '{"status":{...}}'`
      # routes through the `/status` subresource endpoint, which
      # is a DIFFERENT URL from the main resource — admission
      # webhook configs must list `<resource>/status` separately
      # to intercept status-subresource writes. Walk-fix #6 post-
      # B.1.77: prior config without `migrationplans/status` let
      # `kubectl patch --subresource=status -p
      # '{"status":{"phase":"rejected"}}'` bypass the webhook
      # entirely, defeating the ADR 0027 application-scope reject
      # guard that walk-fix #2 added to the validator.
      - apiGroups:
          - apprafter.io
        apiVersions:
          - v1alpha1
        operations:
          - CREATE
          - UPDATE
        resources:
          - migrationplans
          - migrationplans/status
        scope: Namespaced
  - name: serviceproviders.apprafter.io
    sideEffects: None
    failurePolicy: {{ .Values.webhook.failurePolicy }}
    admissionReviewVersions:
      - v1
    timeoutSeconds: {{ .Values.webhook.timeoutSeconds }}
    clientConfig:
      service:
        name: {{ include "apprafter-admission-webhook.fullname" . }}
        namespace: {{ .Release.Namespace }}
        path: /validate
        port: 443
    rules:
      - apiGroups:
          - apprafter.io
        apiVersions:
          - v1alpha1
        operations:
          - CREATE
          - UPDATE
        resources:
          - serviceproviders
        scope: Namespaced
  - name: resourceclaims.apprafter.io
    sideEffects: None
    failurePolicy: {{ .Values.webhook.failurePolicy }}
    admissionReviewVersions:
      - v1
    timeoutSeconds: {{ .Values.webhook.timeoutSeconds }}
    clientConfig:
      service:
        name: {{ include "apprafter-admission-webhook.fullname" . }}
        namespace: {{ .Release.Namespace }}
        path: /validate
        port: 443
    rules:
      - apiGroups:
          - apprafter.io
        apiVersions:
          - v1alpha1
        operations:
          - CREATE
          - UPDATE
        resources:
          - resourceclaims
        scope: Namespaced
  - name: retainedclaims.apprafter.io
    sideEffects: None
    failurePolicy: {{ .Values.webhook.failurePolicy }}
    admissionReviewVersions:
      - v1
    timeoutSeconds: {{ .Values.webhook.timeoutSeconds }}
    clientConfig:
      service:
        name: {{ include "apprafter-admission-webhook.fullname" . }}
        namespace: {{ .Release.Namespace }}
        path: /validate
        port: 443
    rules:
      # 2.4f RetainedClaim — operator-only CREATE + spec immutability on
      # UPDATE (the validator reads oldObject for the immutability check,
      # so both CREATE and UPDATE must reach the webhook).
      - apiGroups:
          - apprafter.io
        apiVersions:
          - v1alpha1
        operations:
          - CREATE
          - UPDATE
        resources:
          - retainedclaims
        scope: Namespaced
  - name: sharedvolumes.apprafter.io
    sideEffects: None
    failurePolicy: {{ .Values.webhook.failurePolicy }}
    admissionReviewVersions:
      - v1
    timeoutSeconds: {{ .Values.webhook.timeoutSeconds }}
    clientConfig:
      service:
        name: {{ include "apprafter-admission-webhook.fullname" . }}
        namespace: {{ .Release.Namespace }}
        path: /validate
        port: 443
    rules:
      # 2.6c SharedVolume (ADR 0049) — shape validation on CREATE and
      # UPDATE: `spec.size` must be a non-empty Kubernetes quantity
      # (`[0-9]+[EPTGMK]i?`); `spec.class`, when present, must be
      # `local` (the only supported T1 class; T2 adds `nfs`). The
      # webhook is STATELESS — SharedVolume EXISTENCE checks for
      # `needs.disk.ref` references are the controller's job
      # (AwaitingSharedVolume condition on the Application), not the
      # webhook's.
      - apiGroups:
          - apprafter.io
        apiVersions:
          - v1alpha1
        operations:
          - CREATE
          - UPDATE
        resources:
          - sharedvolumes
        scope: Namespaced
