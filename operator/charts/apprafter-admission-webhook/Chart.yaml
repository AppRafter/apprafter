# SPDX-License-Identifier: MIT
apiVersion: v2
name: apprafter-admission-webhook
description: |
  AppRafter admission webhook — enforces cross-field invariants
  the OpenAPI v3 CRD layer can't express (image required, env
  names DNS-1123, env keys ^[A-Z_][A-Z0-9_]*$). Cert-manager
  issues + rotates the TLS Certificate.
type: application
version: v0.1.97
appVersion: "v0.1.116"
kubeVersion: ">= 1.29.0-0"
home: https://github.com/apprafter/apprafter
sources:
  - https://github.com/apprafter/apprafter
maintainers:
  - name: AppRafter Authors
keywords:
  - apprafter
  - admission-webhook
  - kubernetes
