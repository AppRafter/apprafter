# SPDX-License-Identifier: FSL-1.1-Apache-2.0
[package]
name        = "operator-rendering"
description = "Pure renderer: Application -> Vec of k8s resources."
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
authors.workspace      = true
repository.workspace   = true

[lib]
path = "src/lib.rs"

[dependencies]
operator-core = { path = "../operator-core" }
k8s-openapi   = { workspace = true }
serde         = { workspace = true }
serde_json    = { workspace = true }
thiserror     = { workspace = true }

# Test-only. `egress.rs`'s need-type census reads the key set off `Needs`'s
# own derived JSON schema instead of hand-copying it, so a newly added need
# type cannot slip past the "has a connection target, or is declared
# target-less" gate. operator-core already derives `JsonSchema` on every CRD
# type; this only gives the test a way to read it back.
[dev-dependencies]
schemars = { workspace = true }
