# SPDX-License-Identifier: FSL-1.1-Apache-2.0
[package]
name        = "operator-core"
description = "Shared types for the AppRafter operator (CRDs, errors, helpers)."
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
authors.workspace      = true
repository.workspace   = true

[lib]
path = "src/lib.rs"

[dependencies]
kube         = { workspace = true }
k8s-openapi  = { workspace = true }
schemars     = { workspace = true }
serde        = { workspace = true }
serde_json   = { workspace = true }
prometheus   = { workspace = true }
chrono       = { workspace = true }
tokio        = { workspace = true }
tracing      = { workspace = true }
thiserror    = { workspace = true }
async-trait  = { workspace = true }
sha2         = { workspace = true }
http         = { workspace = true }

[dev-dependencies]
# `leader.rs` drives leader election against a scripted in-process
# apiserver: `kube::Client` is a thin wrapper over a `tower::Service`, so a
# `tower::service_fn` that answers from a script exercises the real client
# (real URL construction, real 404/5xx mapping) with no cluster. It is the
# only way to assert WHICH requests the loop makes — and, for the
# split-brain case, that it makes none.
tower = { workspace = true }
