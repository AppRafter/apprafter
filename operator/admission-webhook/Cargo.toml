# SPDX-License-Identifier: FSL-1.1-Apache-2.0
[package]
name        = "admission-webhook"
description = "AppRafter admission webhook for v1alpha1 Application validation."
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
authors.workspace      = true
repository.workspace   = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "admission-webhook"
path = "src/main.rs"

[dependencies]
axum               = { workspace = true }
tokio              = { workspace = true }
axum-server        = { workspace = true }
tower              = { workspace = true }
serde              = { workspace = true }
serde_json         = { workspace = true }
tracing            = { workspace = true }
tracing-subscriber = { workspace = true }
thiserror          = { workspace = true }
# rustls 0.23+ removed its auto-default CryptoProvider; the
# webhook pod panics at TLS init without an explicit
# `install_default()` call (walk-found bug v0.1.105 →
# v0.1.106). Pull rustls directly with `aws-lc-rs` so the
# `default_provider` function in `lib::install_rustls_crypto_provider`
# resolves at compile time.
rustls             = { version = "0.23", default-features = false, features = ["aws-lc-rs"] }

[dev-dependencies]
http-body-util = { workspace = true }
tower          = { workspace = true }
