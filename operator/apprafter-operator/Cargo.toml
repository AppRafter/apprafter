# SPDX-License-Identifier: FSL-1.1-Apache-2.0
[package]
name        = "apprafter-operator"
description = "AppRafter operator binary — wires controllers + metrics + health endpoints."
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
publish.workspace      = true
authors.workspace      = true
repository.workspace   = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "apprafter-operator"
path = "src/main.rs"

[dependencies]
operator-core                          = { path = "../operator-core" }
operator-controllers-application       = { path = "../operator-controllers/application" }
operator-controllers-migration         = { path = "../operator-controllers/migration" }
operator-controllers-platform-stack    = { path = "../operator-controllers/platform-stack" }
operator-controllers-sourcecredential         = { path = "../operator-controllers/sourcecredential" }
operator-controllers-resourceclaim-scheduler  = { path = "../operator-controllers/resourceclaim-scheduler" }
operator-controllers-resourceclaim-provisioner = { path = "../operator-controllers/resourceclaim-provisioner" }

axum               = { workspace = true }
tokio              = { workspace = true }
# `retry`: `build_client` keeps kube's own in-call retry layer for a Config
# that asks for it (`default_retry`), as kube's builder does.
tower              = { workspace = true, features = ["retry"] }
# WI-417: `build_client` (src/lib.rs) builds kube's own client stack from
# these crates, the ones kube-client builds it from, at the versions
# operator/Cargo.lock already holds, so that it can switch the HTTP/1.1
# connection pool off. `hyper` names the response body type of kube's trace
# hooks and re-exports the `http` types.
hyper              = { version = "1.11.1", features = ["client", "http1"] }
hyper-timeout      = "0.5.2"
hyper-util         = { version = "0.1.20", features = ["client-legacy", "http1", "tokio"] }
tower-http         = { version = "0.6.11", features = ["trace"] }
tracing            = { workspace = true }
tracing-subscriber = { workspace = true }
kube               = { workspace = true }
k8s-openapi        = { workspace = true }
# rustls 0.23+ removed its auto-default CryptoProvider; the
# application must `install_default()` one before any TLS. We
# pull rustls directly with `aws-lc-rs` so the `default_provider`
# helper is in scope. Version must match what `kube` transitively
# pulls in (0.23.x).
rustls             = { version = "0.23", default-features = false, features = ["aws-lc-rs"] }

[dev-dependencies]
http-body-util = { workspace = true }
tower          = { workspace = true }
# WI-417: `tests/watch_connection_stall_test.rs` runs kube watchers against a
# fake apiserver (`TcpListener`, raw HTTP/1.1) and reads their event streams.
futures        = { workspace = true }
tokio          = { workspace = true, features = ["net", "io-util", "time"] }
