[package]
name        = "apprafter-operator"
description = "AppRafter operator binary — wires controllers + metrics + health endpoints."
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
authors.workspace      = true
repository.workspace   = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "apprafter-operator"
path = "src/main.rs"

[dependencies]
operator-core                      = { path = "../operator-core" }
operator-controllers-application   = { path = "../operator-controllers/application" }

axum               = { workspace = true }
tokio              = { workspace = true }
tower              = { workspace = true }
tracing            = { workspace = true }
tracing-subscriber = { workspace = true }
kube               = { workspace = true }

[dev-dependencies]
http-body-util = { workspace = true }
tower          = { workspace = true }
