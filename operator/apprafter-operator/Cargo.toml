# SPDX-License-Identifier: FSL-1.1-MIT
[package]
name        = "apprafter-operator"
description = "AppRafter operator binary — wires controllers + metrics + health endpoints."
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
authors.workspace      = true
repository.workspace   = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "apprafter-operator"
path = "src/main.rs"

[dependencies]
operator-core                      = { path = "../operator-core" }
operator-controllers-application   = { path = "../operator-controllers/application" }

axum               = { workspace = true }
tokio              = { workspace = true }
tower              = { workspace = true }
tracing            = { workspace = true }
tracing-subscriber = { workspace = true }
kube               = { workspace = true }
# rustls 0.23+ removed its auto-default CryptoProvider; the
# application must `install_default()` one before any TLS. We
# pull rustls directly with `aws-lc-rs` so the `default_provider`
# helper is in scope. Version must match what `kube` transitively
# pulls in (0.23.x).
rustls             = { version = "0.23", default-features = false, features = ["aws-lc-rs"] }

[dev-dependencies]
http-body-util = { workspace = true }
tower          = { workspace = true }
