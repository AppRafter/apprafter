# SPDX-License-Identifier: FSL-1.1-MIT
name: Bug report
description: Something is not working as designed.
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Be specific. Include manifests, logs, and commands.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction steps
      description: Minimal steps that reliably reproduce the problem.
    validations:
      required: true
  - type: input
    id: tier
    attributes:
      label: Tier
      placeholder: Tier 1 / Tier 2 / Tier 3 / Tier 4
  - type: input
    id: version
    attributes:
      label: Version (output of `apprafter version`)
  - type: textarea
    id: env
    attributes:
      label: Environment
      description: OS, kernel, container runtime, infra provider.
