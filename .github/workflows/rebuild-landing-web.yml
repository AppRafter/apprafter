name: rebuild-landing-web

# Triggered by Payload's afterChange hook on every content global
# (see landing/cms/src/hooks/notifyRebuild.ts) via a GitHub
# `repository_dispatch` event of type `landing-content-changed`.
#
# Rebuilds the static landing-web image with LANDING_USE_FALLBACK=0
# so the build fetches live content from cms.apprafter.dev, then
# pushes:
#
#   ghcr.io/<owner-lc>/landing-web:edge
#   ghcr.io/<owner-lc>/landing-web:edge-<sha>
#
# `edge` is a moving tag — the deploy host pulls it on a timer
# (see landing/DEPLOY.md). The `landing-v*` release path is
# unaffected and stays the source of truth for pinned versions.
#
# Concurrency: only the latest dispatch finishes. Multiple admin
# saves in a row → in-flight builds get cancelled and replaced by
# a single fresh build, so we don't waste runner minutes coalescing
# in the Payload hook.

on:
  repository_dispatch:
    types: [landing-content-changed]
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

concurrency:
  group: rebuild-landing-web
  cancel-in-progress: true

jobs:
  build:
    name: rebuild landing-web (live CMS)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Compute lowercase image base
        id: image-base
        env:
          REPO_OWNER: ${{ github.repository_owner }}
        run: |
          owner_lc=$(echo "$REPO_OWNER" | tr '[:upper:]' '[:lower:]')
          echo "image=ghcr.io/${owner_lc}/landing-web" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push landing-web (LANDING_USE_FALLBACK=0)
        uses: docker/build-push-action@v5
        with:
          context: landing
          file: landing/web/Dockerfile
          push: true
          tags: |
            ${{ steps.image-base.outputs.image }}:edge
            ${{ steps.image-base.outputs.image }}:edge-${{ github.sha }}
          # Force live-CMS fetch + bake the public CMS origin
          # into the client JS.
          build-args: |
            LANDING_USE_FALLBACK=0
            LANDING_CMS_URL=https://cms.apprafter.dev
            PUBLIC_CMS_URL=https://cms.apprafter.dev
          platforms: linux/amd64
          # Share the cache scope with release-landing.yml's web
          # job — most layers (bun install, workspace copy) hit
          # the same cache entries.
          cache-from: type=gha,scope=landing-web
          cache-to: type=gha,mode=max,scope=landing-web
