# SPDX-License-Identifier: FSL-1.1-Apache-2.0
name: lint

on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  cue:
    name: CUE (fmt + vet)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cue-lang/setup-cue@v1.0.1
        with:
          version: v0.10.0
      - name: lint-cue.sh
        run: ./scripts/lint-cue.sh

  rust:
    name: Rust (fmt + clippy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # cli/cli-providers/build.rs shells out to `cue export`
      # at compile time (Track B.1.71 — chart values are the
      # single source of truth, CLI loader values are derived
      # via cue export -e _loaderValues.<comp>). Without cue
      # on PATH the build script panics on the runner.
      - uses: cue-lang/setup-cue@v1.0.1
        with:
          version: v0.10.0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Detect Cargo workspaces
        id: detect
        run: |
          dirs=$(find . -mindepth 2 -maxdepth 2 -name Cargo.toml \
              -not -path './target/*' -not -path '*/node_modules/*' \
              | xargs -r -n1 dirname | sort -u | tr '\n' ' ')
          if [ -n "$dirs" ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "dirs=$dirs" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "::notice::no Cargo.toml yet — skipping rustfmt/clippy"
          fi
      - name: cargo fmt + clippy
        if: steps.detect.outputs.found == 'true'
        run: |
          for dir in ${{ steps.detect.outputs.dirs }}; do
            echo "::group::cargo fmt + clippy in $dir"
            (cd "$dir" && cargo fmt --all -- --check)
            (cd "$dir" && cargo clippy --all-targets --all-features -- -D warnings)
            echo "::endgroup::"
          done

  bun:
    name: Bun / TypeScript (lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Detect Bun workspaces
        id: detect
        run: |
          dirs=$(find . -maxdepth 4 -name package.json \
              -not -path '*/node_modules/*' \
              -not -path '*/skeleton/*' \
              | xargs -r -n1 dirname | sort -u | tr '\n' ' ')
          if [ -n "$dirs" ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "dirs=$dirs" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "::notice::no package.json yet — skipping bun lint"
          fi
      - name: bun install + lint
        if: steps.detect.outputs.found == 'true'
        run: |
          for dir in ${{ steps.detect.outputs.dirs }}; do
            echo "::group::bun lint in $dir"
            (cd "$dir" && bun install --frozen-lockfile && bun run lint)
            echo "::endgroup::"
          done
