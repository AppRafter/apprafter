# SPDX-License-Identifier: FSL-1.1-Apache-2.0
name: lint

# Per-stack lint gating. Each stack's job is gated on a
# `dorny/paths-filter` flag so a CLI-only push doesn't run
# CUE vet, a CUE-only push doesn't run rust clippy, and a
# landing TypeScript change doesn't run anything else.
#
# Walk-fix post-v0.1.156: operator pointed out a single push
# triggered five separate workflows and all three lint
# sub-jobs (cue / rust / bun) regardless of what actually
# changed. Now the workflow always fires on push to master
# and on every PR, but the per-stack jobs each opt in via
# their path filter — fast-path runs to ~10-30 seconds when
# nothing in a given stack changed.

on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  changes:
    name: detect stack changes
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      cue: ${{ steps.filter.outputs.cue }}
      rust_cli: ${{ steps.filter.outputs.rust_cli }}
      rust_operator: ${{ steps.filter.outputs.rust_operator }}
      bun: ${{ steps.filter.outputs.bun }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          # Filters per stack. Paths are evaluated against
          # the PR's diff (vs base) on pull_request events
          # and against the previous commit on push events.
          #
          # Each list deliberately overlaps with CI source
          # files (`scripts/lint-*.sh`, the workflow itself)
          # so editing the linting tooling re-runs the
          # relevant job.
          filters: |
            cue:
              - 'schemas/**'
              - 'examples/**'
              - 'platform-stack/cue/**'
              - 'argocd-cue-cmp/version.cue'
              - 'argocd-cue-cmp/plugin.yaml'
              - 'cue.mod/**'
              - 'scripts/lint-cue.sh'
              - 'scripts/check-cue-cmp-mirror.sh'
              - 'scripts/check-argocd-health-lua.sh'
              - 'scripts/argocd-health-lua-test.lua'
              - '.github/workflows/lint.yml'
            rust_cli:
              - 'cli/**'
              - '.github/workflows/lint.yml'
            rust_operator:
              - 'operator/**'
              - '.github/workflows/lint.yml'
            bun:
              - 'landing/**'
              - 'backstage-plugins/**'
              - 'scripts/check-payload-types.sh'
              - '.github/workflows/lint.yml'

  cue:
    name: CUE (fmt + vet)
    needs: changes
    if: needs.changes.outputs.cue == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cue-lang/setup-cue@v1.0.1
        with:
          version: v0.10.0
      - name: lint-cue.sh
        run: ./scripts/lint-cue.sh
      # Why this guard exists: see the header of
      # scripts/check-cue-cmp-mirror.sh. Wired here as well as in
      # `just lint` because no workflow runs `just lint`. ADR 0063 §Risks.
      - name: check-cue-cmp-mirror.sh
        run: ./scripts/check-cue-cmp-mirror.sh
      # The argocd-cm health Lua is the only chart payload no other gate
      # executes: `cue vet` and `helm template` both see an opaque string,
      # and Argo CD swallows a broken script at run time. See the header of
      # scripts/check-argocd-health-lua.sh for the two releases that cost.
      # The interpreter is installed rather than left to the script's
      # `nix run` fallback, which no runner here can take.
      - name: Install Lua
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends lua5.4
      - name: check-argocd-health-lua.sh
        run: |
          sudo ln -sf /usr/bin/lua5.4 /usr/local/bin/lua
          ./scripts/check-argocd-health-lua.sh

  rust-cli:
    name: Rust cli/ (fmt + clippy)
    needs: changes
    if: needs.changes.outputs.rust_cli == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # cli/cli-providers/build.rs shells out to `cue export`
      # at compile time (Track B.1.71 — chart values are the
      # single source of truth, CLI loader values are derived
      # via cue export -e _loaderValues.<comp>). Without cue
      # on PATH the build script panics on the runner.
      - uses: cue-lang/setup-cue@v1.0.1
        with:
          version: v0.10.0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: cargo fmt + clippy
        working-directory: cli
        run: |
          cargo fmt --all -- --check
          cargo clippy --all-targets --all-features -- -D warnings

  rust-operator:
    name: Rust operator/ (fmt + clippy)
    needs: changes
    if: needs.changes.outputs.rust_operator == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: cargo fmt + clippy
        working-directory: operator
        run: |
          cargo fmt --all -- --check
          cargo clippy --all-targets --all-features -- -D warnings

  bun:
    name: Bun / TypeScript (lint)
    needs: changes
    if: needs.changes.outputs.bun == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Detect Bun workspaces
        id: detect
        run: |
          # Skip Bun workspace children: their parent package.json
          # already declares them via `workspaces`, and `bun install`
          # / Biome / `bun test` from the workspace root walk into
          # them recursively. Iterating each child separately would
          # re-run the same checks (and re-install deps) for no gain.
          dirs=""
          while IFS= read -r pkg; do
            d="$(dirname "$pkg")"
            parent_pkg="$(dirname "$d")/package.json"
            if [ -f "$parent_pkg" ] && grep -q '"workspaces"' "$parent_pkg"; then
              continue
            fi
            dirs="$dirs $d"
          done < <(find . -maxdepth 4 -name package.json \
              -not -path '*/node_modules/*' \
              -not -path '*/skeleton/*' \
              | sort -u)
          dirs="$(echo "$dirs" | xargs)"
          if [ -n "$dirs" ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "dirs=$dirs" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "::notice::no package.json yet — skipping bun lint"
          fi
      - name: bun install + lint
        if: steps.detect.outputs.found == 'true'
        run: |
          for dir in ${{ steps.detect.outputs.dirs }}; do
            echo "::group::bun lint in $dir"
            (cd "$dir" && bun install --frozen-lockfile && bun run lint)
            echo "::endgroup::"
          done
      # Runs AFTER the loop above, which is what installs `landing/`'s
      # workspace dependencies — the generator lives in `landing/cms`'s
      # node_modules and there is nothing to compare against without them.
      # Unconditional on which package changed: the loop installs every
      # detected dir regardless, and a stale generated file is stale
      # whether or not this push is the one that staled it.
      #
      # Needs no secrets and takes no input from the event payload.
      # `payload generate:types` compiles the schema and writes a file; it
      # opens no database and reads no environment.
      - name: payload-types drift
        if: steps.detect.outputs.found == 'true'
        run: ./scripts/check-payload-types.sh
