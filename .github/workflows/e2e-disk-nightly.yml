# SPDX-License-Identifier: FSL-1.1-Apache-2.0
name: e2e-disk-nightly

# Standalone nightly k3d gate for the Phase-2.6b needs.disk ResourceClaim
# chain (e2e/needs-disk-walk.sh): generate -> schedule -> provision (an
# unowned ReadWriteOnce PVC, retained on claim delete) -> resume + mount
# (volumeMount + Recreate strategy) -> data durability across a pod
# restart -> delete the Application + RetainedClaim snapshot + PVC survives
# the grace floor -> redeploy reattaches the same PVC (data intact) ->
# force-GC drops the PVC + the snapshot. Plus a needs.pg-array assertion
# that the (type,name) generalization yields two CNPG DBs +
# DATABASE_URL_<NAME> for a single Application.
#
# LOCAL_OPERATOR: the 2.6b disk code is not in the released operator image
# yet, so this walk builds + side-loads the working-tree operator +
# admission-webhook (APPRAFTER_E2E_LOCAL_OPERATOR=1). Two cold in-container
# Rust image builds dominate the wall-clock here, hence the wider timeout
# vs the e2e-pg / e2e-redis nightlies (which run the released image). Once
# 2.6b ships and is channel-latest the LOCAL_OPERATOR build becomes
# optional, but keeping it self-contained means the gate is correct on any
# release boundary.
#
# Why a separate workflow (NOT folded into e2e-k3d.yml or the other
# nightlies):
#   - It boots a CNPG cluster (for the pg-array assertion) and provisions
#     real PVCs, so it is heavier than the gitops-walk gate -- keep it off
#     the per-push critical path.
#   - It is decoupled from the Hetzner-cost nightly.yml so the free-k3d
#     failure domain stays independent (no cloud spend, no secrets).
#
# Security note: no secrets are consumed here. Everything runs on a
# local k3d cluster; the only outbound traffic is public image /
# chart pulls. `permissions: contents: read` is the minimum. No
# `github.event.*` input is interpolated into any run: block.

on:
  schedule:
    # 07:00 UTC -- staggered after nightly.yml (04:00 UTC),
    # e2e-pg-nightly.yml (05:00 UTC) and e2e-redis-nightly.yml (06:00 UTC)
    # so the nightly gates don't contend for the runner pool.
    - cron: '0 7 * * *'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  e2e-disk-nightly:
    name: k3d e2e (needs.disk nightly)
    runs-on: ubuntu-latest
    # Wider than the pg/redis nightlies: this walk compiles the operator +
    # admission-webhook images in-container from a cold cache before the
    # chain even starts.
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            cli/target
          key: ${{ runner.os }}-cargo-e2e-${{ hashFiles('cli/**/Cargo.lock', 'cli/**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-e2e-
            ${{ runner.os }}-cargo-

      - name: Install CUE
        uses: cue-lang/setup-cue@v1.0.1
        with:
          version: v0.10.0

      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'v1.31.0'

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.2

      - name: Install k3d
        run: |
          curl -s https://raw.githubusercontent.com/k3d-io/k3d/main/install.sh | bash
          k3d version

      - name: Load iptables kernel modules for Cilium
        # Mirrors e2e-redis-nightly.yml: cluster-bootstrap skips Cilium on
        # k3d (APPRAFTER_BOOTSTRAP_SKIP_CILIUM=1 in lib.sh) so these are a
        # belt-and-braces no-op here, kept for parity in case a future walk
        # re-enables the eBPF datapath.
        run: |
          sudo modprobe -a \
            ip_tables iptable_mangle iptable_raw iptable_filter iptable_nat \
            ip6_tables ip6table_mangle ip6table_raw ip6table_filter ip6table_nat \
            nf_nat xt_socket || true
          lsmod | grep -E 'ip6?table|nf_nat|xt_socket' || true

      - name: Warm the CLI build cache
        working-directory: cli
        # The e2e script invokes the CLI via `cargo run` (lib.sh's
        # `apprafter()` shell function), so a debug build here warms the
        # cache for the timed script run below -- no PATH binary is used.
        # (The operator + webhook IMAGES are built separately, in-container,
        # by the walk's LOCAL_OPERATOR path.)
        run: cargo build --bin apprafter

      - name: Run the needs.disk k3d walk
        env:
          APPRAFTER_E2E_LOCAL_OPERATOR: "1"
        run: bash e2e/needs-disk-walk.sh
