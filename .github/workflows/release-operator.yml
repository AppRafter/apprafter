name: release-operator

# Builds and pushes the AppRafter operator + admission-webhook
# container images to ghcr.io on every `v0.*` / `v1.*` tag, plus
# on demand via `workflow_dispatch`. Uses the auto-provided
# `GITHUB_TOKEN` — no PAT or external secrets required.
#
# First push of each package creates it as private. Operators
# wanting a no-imagePullSecret pull (the tier-1 default that
# `cluster-bootstrap` assumes) flip visibility to public via the
# GitHub UI once: Packages → <package> → Settings → Change
# visibility → Public. This is a one-shot UI action; subsequent
# tag pushes update the existing public package.
#
# Security note: every dynamic value (`github.ref_name`,
# `github.repository_owner`, `github.actor`) is consumed only as
# an input to docker/login-action / docker/build-push-action —
# never interpolated into a shell `run:` command. The one shell
# step ("Compute lowercase image base") consumes
# `github.repository_owner` via an `env:` binding rather than
# direct expression substitution, which is the documented
# anti-injection pattern. So the action-injection class of risks
# does not apply.
#
# Why the lowercase shim: docker registry repository names MUST
# be lowercase, but `${{ github.repository_owner }}` preserves
# the org's display casing (e.g. `AppRafter`). GitHub Actions
# does not provide a built-in `toLower` expression function, so
# a shell `tr '[:upper:]' '[:lower:]'` step computes the
# lowercase base once per job and exposes it via outputs.
#
# Image references after a successful run:
#
#   ghcr.io/<owner-lowercased>/apprafter-operator:<tag>
#   ghcr.io/<owner-lowercased>/apprafter-operator:latest
#   ghcr.io/<owner-lowercased>/apprafter-admission-webhook:<tag>
#   ghcr.io/<owner-lowercased>/apprafter-admission-webhook:latest

on:
  push:
    tags:
      - 'v0.*'
      - 'v1.*'
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  operator:
    name: build apprafter-operator
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Compute lowercase image base
        id: image-base
        env:
          REPO_OWNER: ${{ github.repository_owner }}
        run: |
          owner_lc=$(echo "$REPO_OWNER" | tr '[:upper:]' '[:lower:]')
          echo "image=ghcr.io/${owner_lc}/apprafter-operator" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push operator image
        uses: docker/build-push-action@v5
        with:
          context: operator
          file: operator/apprafter-operator/Dockerfile
          push: true
          tags: |
            ${{ steps.image-base.outputs.image }}:${{ github.ref_name }}
            ${{ steps.image-base.outputs.image }}:latest
          # Tier-1 substrate is x86 only (Hetzner CPX22).
          # Multi-arch (arm64 for Hetzner CAX*) lands when
          # Infrastructure.spec.nodes[].arch is wired through
          # apply.rs and user_data/k3s installer learn to match
          # — separate phase.
          platforms: linux/amd64
          cache-from: type=gha,scope=operator
          cache-to: type=gha,mode=max,scope=operator

  admission-webhook:
    name: build admission-webhook
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Compute lowercase image base
        id: image-base
        env:
          REPO_OWNER: ${{ github.repository_owner }}
        run: |
          owner_lc=$(echo "$REPO_OWNER" | tr '[:upper:]' '[:lower:]')
          echo "image=ghcr.io/${owner_lc}/apprafter-admission-webhook" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push admission-webhook image
        uses: docker/build-push-action@v5
        with:
          context: operator
          file: operator/admission-webhook/Dockerfile
          push: true
          tags: |
            ${{ steps.image-base.outputs.image }}:${{ github.ref_name }}
            ${{ steps.image-base.outputs.image }}:latest
          platforms: linux/amd64
          cache-from: type=gha,scope=admission-webhook
          cache-to: type=gha,mode=max,scope=admission-webhook

  helm-charts:
    name: package + push helm charts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [operator, admission-webhook]

    # Why publish the helm charts here instead of a standalone
    # workflow: the chart references the operator + webhook
    # container images by version, and a walk-fix that bumps
    # the chart version is meaningful only if the matching
    # image exists. Coupling the chart publish to the same
    # workflow that pushes the images keeps the two in
    # lockstep — image build fails, chart isn't pushed.
    #
    # The chart version comes from Chart.yaml (NOT from
    # github.ref_name). The platform-stack chart pins each
    # operator chart to a specific version (e.g. v0.1.91)
    # that may lag the current monorepo tag — every CLI tag
    # push therefore re-publishes the same chart version,
    # which GHCR's OCI registry tolerates (mutable tags by
    # default). Bumping the chart version is a separate,
    # intentional edit to operator/charts/<chart>/Chart.yaml.

    steps:
      - uses: actions/checkout@v4

      - name: Compute lowercase OCI base
        id: oci-base
        env:
          REPO_OWNER: ${{ github.repository_owner }}
        run: |
          owner_lc=$(echo "$REPO_OWNER" | tr '[:upper:]' '[:lower:]')
          echo "oci=oci://ghcr.io/${owner_lc}" >> "$GITHUB_OUTPUT"

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.4

      - name: Log in to ghcr.io with helm
        env:
          ACTOR: ${{ github.actor }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$TOKEN" | helm registry login ghcr.io \
            --username "$ACTOR" --password-stdin

      - name: Package + push apprafter-operator chart
        env:
          OCI: ${{ steps.oci-base.outputs.oci }}
        run: |
          chart_dir=operator/charts/apprafter-operator
          version=$(grep '^version:' "$chart_dir/Chart.yaml" \
                     | awk '{print $2}')
          helm package "$chart_dir" --destination /tmp
          helm push "/tmp/apprafter-operator-${version}.tgz" "$OCI"

      - name: Package + push apprafter-admission-webhook chart
        env:
          OCI: ${{ steps.oci-base.outputs.oci }}
        run: |
          chart_dir=operator/charts/apprafter-admission-webhook
          version=$(grep '^version:' "$chart_dir/Chart.yaml" \
                     | awk '{print $2}')
          helm package "$chart_dir" --destination /tmp
          helm push "/tmp/apprafter-admission-webhook-${version}.tgz" "$OCI"
