name: release-operator

# Builds and pushes the AppRafter operator + admission-webhook
# container images + Helm charts on operator changes. Mirrors
# the path-filtered + per-stream-tag pattern used by
# `platform-stack-publish.yml` and `argocd-cue-cmp-publish.yml`.
#
# ## Trigger discipline
#
# Walk-fix post-v0.1.156 (operator question: "why did a single
# push just kick off 5 workflows — were they all really
# needed?"): until now the workflow triggered on every `v0.*` /
# `v1.*` tag push — the canonical CLI tag stream — even when
# the operator binary itself hadn't changed since the last
# release. Every CLI release silently rebuilt and re-pushed
# identical operator + webhook images under a new tag,
# burning CI minutes and ghcr.io storage without producing
# any consumer-visible delta (the chart's
# `RELEASED_OPERATOR_VERSION` constant stayed pinned at the
# old version).
#
# New trigger: master push when files under `operator/**`
# change, plus `workflow_dispatch` for manual re-runs. CLI tag
# pushes no longer wake this workflow; pushes that don't touch
# `operator/` no longer wake it; pushes that touch a chart
# YAML without bumping operator code wake it but skip publish
# via the gate below (same image already on ghcr.io). Net
# result: the workflow runs roughly once per operator-binary
# version bump, not once per push.
#
# ## Tag stream
#
# Operator releases live on their own `operator/v<appVersion>`
# tag series (matches `platform-stack/v*` and
# `argocd-cue-cmp/v*` style). `appVersion` comes from the
# operator chart's `Chart.yaml` and is the SoT for the image
# tag. Bumping the chart's appVersion is the operator-side
# equivalent of bumping `cli/Cargo.toml` `workspace.package.
# version` for a CLI release.
#
# The publish job creates the `operator/v<appVersion>` git
# tag itself via `gh release create` at the end of a
# successful run — operators must NOT pre-emptively `git tag`
# the value locally (that would trip the "tag exists" gate
# and skip publish — see `argocd-cue-cmp-publish.yml`'s
# equivalent walk-fix v0.1.154).
#
# ## Detect gate
#
# `detect` reads `operator/charts/apprafter-operator/
# Chart.yaml` `appVersion`, computes the tag, and checks
# TWO axes:
#
#   1. Git tag `operator/v<appVersion>` exists on origin.
#   2. Operator image at `ghcr.io/<owner>/apprafter-operator:
#      v<appVersion>` exists.
#
# BOTH must be present to skip publish. Either being absent
# triggers the build — recovers from the walk-found scenario
# where a tag was created without a matching image push (or
# vice versa).
#
# ## First push of each package
#
# First push creates the ghcr package as private. Operators
# wanting a no-imagePullSecret pull (the tier-1 default that
# `cluster-bootstrap` assumes) flip visibility to public via
# the GitHub UI once: Packages → <package> → Settings →
# Change visibility → Public. This is a one-shot UI action;
# subsequent runs update the existing public package.
#
# ## Security
#
# Every dynamic value (`github.repository_owner`,
# `github.actor`) is consumed only as an input to
# docker/login-action / docker/build-push-action — never
# interpolated into a shell `run:` command. The detect job's
# shell step consumes inputs via `env:` bindings rather than
# direct expression substitution, which is the documented
# anti-injection pattern.

on:
  push:
    branches: [master]
    paths:
      - 'operator/**'
      - '.github/workflows/release-operator.yml'
  workflow_dispatch: {}

permissions:
  contents: write   # create GitHub Release + tag
  packages: write   # push to ghcr.io

jobs:
  detect:
    name: resolve appVersion + check if publish needed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      app_version: ${{ steps.version.outputs.app_version }}
      tag: ${{ steps.version.outputs.tag }}
      should_publish: ${{ steps.gate.outputs.should_publish }}

    steps:
      - uses: actions/checkout@v4

      - name: Resolve appVersion from operator chart
        id: version
        env:
          CHART_FILE: operator/charts/apprafter-operator/Chart.yaml
        run: |
          # The operator + webhook charts share the same
          # appVersion (the chart Chart.yaml files are kept in
          # lockstep by hand). Reading from one is enough.
          app_version=$(grep '^appVersion:' "$CHART_FILE" \
              | awk '{print $2}' | tr -d '"')
          if [[ -z "${app_version:-}" ]]; then
            echo "::error::failed to extract appVersion from $CHART_FILE"
            exit 1
          fi
          # Tag form mirrors platform-stack/v* etc. Always
          # carries the `v` prefix so image tag and git tag
          # match by construction.
          # Strip leading `v` from appVersion when the chart
          # author included one — recover the bare semver
          # before re-prefixing — so `appVersion: "v0.1.134"`
          # and `appVersion: 0.1.134` both produce the same
          # `operator/v0.1.134` tag.
          app_version="${app_version#v}"
          tag="operator/v${app_version}"
          echo "app_version=$app_version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Resolved appVersion=$app_version, tag=$tag"

      - name: Check whether version is already published
        id: gate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
          TAG: ${{ steps.version.outputs.tag }}
          APP_VERSION: ${{ steps.version.outputs.app_version }}
          REPO_OWNER: ${{ github.repository_owner }}
        run: |
          # Two-axis gate (mirrors argocd-cue-cmp-publish.yml
          # walk-fix v0.1.154): the published version requires
          # BOTH the git tag AND the operator + webhook images
          # on ghcr.io. Tag-alone is insufficient — a manually
          # pushed tag without a build leaves the chart pinning
          # a phantom image. Default to "publish" on any
          # uncertainty.
          tag_exists=false
          if git ls-remote --tags --exit-code origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            tag_exists=true
          fi
          owner_lc=$(echo "$REPO_OWNER" | tr '[:upper:]' '[:lower:]')
          operator_image="ghcr.io/${owner_lc}/apprafter-operator:v${APP_VERSION}"
          webhook_image="ghcr.io/${owner_lc}/apprafter-admission-webhook:v${APP_VERSION}"
          echo "${GH_TOKEN}" | docker login ghcr.io \
              -u "${GITHUB_ACTOR}" --password-stdin >/dev/null
          operator_image_exists=false
          webhook_image_exists=false
          if docker manifest inspect "${operator_image}" >/dev/null 2>&1; then
            operator_image_exists=true
          fi
          if docker manifest inspect "${webhook_image}" >/dev/null 2>&1; then
            webhook_image_exists=true
          fi
          if [[ "$tag_exists" == "true" && "$operator_image_exists" == "true" && "$webhook_image_exists" == "true" ]]; then
            echo "::notice::All three exist (tag ${TAG}, ${operator_image}, ${webhook_image}) — skipping publish."
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::tag_exists=${tag_exists}, operator_image_exists=${operator_image_exists}, webhook_image_exists=${webhook_image_exists} — proceeding to publish."
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
          fi

  operator:
    name: build apprafter-operator
    needs: detect
    if: needs.detect.outputs.should_publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Compute lowercase image base
        id: image-base
        env:
          REPO_OWNER: ${{ github.repository_owner }}
        run: |
          owner_lc=$(echo "$REPO_OWNER" | tr '[:upper:]' '[:lower:]')
          echo "image=ghcr.io/${owner_lc}/apprafter-operator" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push operator image
        uses: docker/build-push-action@v5
        with:
          context: operator
          file: operator/apprafter-operator/Dockerfile
          push: true
          tags: |
            ${{ steps.image-base.outputs.image }}:v${{ needs.detect.outputs.app_version }}
            ${{ steps.image-base.outputs.image }}:latest
          # Tier-1 substrate is x86 only (Hetzner CPX22).
          # Multi-arch (arm64 for Hetzner CAX*) lands when
          # Infrastructure.spec.nodes[].arch is wired through
          # apply.rs and user_data/k3s installer learn to match
          # — separate phase.
          platforms: linux/amd64
          cache-from: type=gha,scope=operator
          cache-to: type=gha,mode=max,scope=operator

  admission-webhook:
    name: build admission-webhook
    needs: detect
    if: needs.detect.outputs.should_publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Compute lowercase image base
        id: image-base
        env:
          REPO_OWNER: ${{ github.repository_owner }}
        run: |
          owner_lc=$(echo "$REPO_OWNER" | tr '[:upper:]' '[:lower:]')
          echo "image=ghcr.io/${owner_lc}/apprafter-admission-webhook" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push admission-webhook image
        uses: docker/build-push-action@v5
        with:
          context: operator
          file: operator/admission-webhook/Dockerfile
          push: true
          tags: |
            ${{ steps.image-base.outputs.image }}:v${{ needs.detect.outputs.app_version }}
            ${{ steps.image-base.outputs.image }}:latest
          platforms: linux/amd64
          cache-from: type=gha,scope=admission-webhook
          cache-to: type=gha,mode=max,scope=admission-webhook

  helm-charts:
    name: package + push helm charts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [detect, operator, admission-webhook]
    if: needs.detect.outputs.should_publish == 'true'

    # Why publish the helm charts here instead of a standalone
    # workflow: the chart references the operator + webhook
    # container images by version, and bumping the chart
    # version is meaningful only if the matching image exists.
    # Coupling the chart publish to the same workflow that
    # pushes the images keeps the two in lockstep — image
    # build fails, chart isn't pushed.
    #
    # The chart's `version` field (not `appVersion`) comes
    # from Chart.yaml. The platform-stack chart pins each
    # operator chart to a specific version (e.g. v0.1.115).
    # Bumping the chart version is a separate, intentional
    # edit alongside the appVersion bump.

    steps:
      - uses: actions/checkout@v4

      - name: Compute lowercase OCI base
        id: oci-base
        env:
          REPO_OWNER: ${{ github.repository_owner }}
        run: |
          # Charts publish under the `/charts` sub-namespace, NOT the
          # org root. The operator + admission-webhook charts share a
          # name with their container images (`apprafter-operator`,
          # `apprafter-admission-webhook`); pushing a chart to
          # `ghcr.io/<owner>/<name>:<ver>` with `<ver>` equal to the
          # image tag overwrites the image with the chart .tgz and the
          # pod crash-loops `exec: "/<name>": no such file` (the v0.2.1
          # publish defect). `/charts` keeps the two apart so chart
          # version == appVersion is safe. The matching
          # `repositories: "apprafter-charts"` enableOCI registration
          # lives in platform-stack/cue/loader_values.cue; the
          # components' repoURL points here.
          owner_lc=$(echo "$REPO_OWNER" | tr '[:upper:]' '[:lower:]')
          echo "oci=oci://ghcr.io/${owner_lc}/charts" >> "$GITHUB_OUTPUT"

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.4

      - name: Log in to ghcr.io with helm
        env:
          ACTOR: ${{ github.actor }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$TOKEN" | helm registry login ghcr.io \
            --username "$ACTOR" --password-stdin

      - name: Package + push apprafter-operator chart
        env:
          OCI: ${{ steps.oci-base.outputs.oci }}
        run: |
          chart_dir=operator/charts/apprafter-operator
          version=$(grep '^version:' "$chart_dir/Chart.yaml" \
                     | awk '{print $2}')
          helm package "$chart_dir" --destination /tmp
          helm push "/tmp/apprafter-operator-${version}.tgz" "$OCI"

      - name: Package + push apprafter-admission-webhook chart
        env:
          OCI: ${{ steps.oci-base.outputs.oci }}
        run: |
          chart_dir=operator/charts/apprafter-admission-webhook
          version=$(grep '^version:' "$chart_dir/Chart.yaml" \
                     | awk '{print $2}')
          helm package "$chart_dir" --destination /tmp
          helm push "/tmp/apprafter-admission-webhook-${version}.tgz" "$OCI"

  release:
    name: create GitHub Release + operator/v<appVersion> tag
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [detect, operator, admission-webhook, helm-charts]
    if: needs.detect.outputs.should_publish == 'true'

    steps:
      - uses: actions/checkout@v4

      - name: Create GitHub Release + tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ needs.detect.outputs.tag }}
          APP_VERSION: ${{ needs.detect.outputs.app_version }}
          REPO_OWNER: ${{ github.repository_owner }}
          SHA: ${{ github.sha }}
        run: |
          owner_lc=$(echo "$REPO_OWNER" | tr '[:upper:]' '[:lower:]')
          operator_image="ghcr.io/${owner_lc}/apprafter-operator:v${APP_VERSION}"
          webhook_image="ghcr.io/${owner_lc}/apprafter-admission-webhook:v${APP_VERSION}"
          notes_file=$(mktemp)
          cat > "$notes_file" <<EOF
          ## apprafter-operator + admission-webhook ${APP_VERSION}

          Operator + admission-webhook container images and
          Helm charts. Mounted into the platform-stack chart via
          the chart's `_components` map.

          ### Pull

          \`\`\`sh
          docker pull ${operator_image}
          docker pull ${webhook_image}
          \`\`\`

          Source: [\`operator/\`](https://github.com/${REPO}/tree/${TAG}/operator).
          EOF
          # Recovery path: if the git tag already exists on
          # origin without a matching release (operator pushed
          # a local tag eagerly before the workflow ran, gate
          # saw the tag and skipped, the workflow was re-triggered
          # by another path), reset the release entry cleanly.
          # `gh release create --target $SHA` errors when the
          # tag already exists; drop `--target` in that case so
          # gh anchors the release to the existing tag's SHA.
          release_args=()
          if git ls-remote --tags --exit-code origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "::notice::Tag ${TAG} already on origin — recovering via release re-create."
            gh release delete "$TAG" --yes 2>/dev/null || true
          else
            release_args+=(--target "$SHA")
          fi
          gh release create "$TAG" \
            --title "apprafter-operator ${APP_VERSION}" \
            --notes-file "$notes_file" \
            "${release_args[@]}"
