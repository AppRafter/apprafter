# SPDX-License-Identifier: FSL-1.1-Apache-2.0
name: landing-autotag

# On every push to master that touches landing/**, bump the patch
# component of the latest `landing-v*` tag, push the new tag, and
# kick release-landing.yml at that tag. release-landing.yml is the
# image-build pipeline; this workflow is just the auto-tag glue
# in front of it.
#
# Why we use `gh workflow run` instead of a PAT:
#
#   GitHub's default GITHUB_TOKEN cannot trigger downstream
#   workflows via `push: tags` (anti-recursion), so naively
#   pushing the tag here would leave release-landing dormant.
#
#   BUT — `workflow_dispatch` and `repository_dispatch` are the
#   two explicit exceptions to that anti-recursion rule. Calling
#   `gh workflow run release-landing.yml --ref <new-tag>` (which
#   is a workflow_dispatch call) DOES fire release-landing even
#   though the caller is GITHUB_TOKEN. release-landing reads
#   `github.ref_name` exactly the same way it would for a tag
#   push, so the image gets tagged correctly.
#
#   Net result: no PAT, no extra repo secret, the chain "just
#   works" out of the box.
#
# Version bumping is patch-only: 0.1.0 → 0.1.1 → 0.1.2. Minor and
# major are manual decisions — push a tag like `landing-v0.2.0`
# by hand to set the new minor; the next auto-bump picks up
# from there.

on:
  push:
    branches: [master, main]
    paths:
      - 'landing/**'

permissions:
  contents: write   # for `git push <tag>`
  actions:  write   # for `gh workflow run release-landing.yml`

# Serialise: two pushes in quick succession must NOT race for
# the same tag number. cancel-in-progress=false means the second
# job waits for the first to finish (and read the latest tag)
# before computing its own next version.
concurrency:
  group: landing-autotag
  cancel-in-progress: false

jobs:
  bump-and-release:
    name: bump landing-v* + trigger release-landing
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute next landing-v* tag
        id: compute
        run: |
          git fetch --tags --force --quiet
          latest=$(git tag --list 'landing-v*' --sort=-v:refname | head -n1)
          if [ -z "$latest" ]; then
            next="landing-v0.1.0"
          else
            current="${latest#landing-v}"
            IFS='.' read -r major minor patch <<<"$current"
            next="landing-v${major}.${minor}.$((patch + 1))"
          fi
          echo "next=$next" >> "$GITHUB_OUTPUT"
          echo "Latest: ${latest:-<none>} → Next: $next"

      - name: Create + push tag
        env:
          NEXT: ${{ steps.compute.outputs.next }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$NEXT" -m "Auto-tag: $NEXT (landing/** push to master)"
          git push origin "$NEXT"
          echo "::notice::Pushed $NEXT pointing at $COMMIT_SHA"

      - name: Trigger release-landing.yml at the new tag
        env:
          NEXT: ${{ steps.compute.outputs.next }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # The tag is fresh; give GitHub a beat to index it
          # before workflow_dispatch validates --ref.
          sleep 2
          gh workflow run release-landing.yml --ref "$NEXT"
          echo "::notice::Triggered release-landing.yml at $NEXT"
