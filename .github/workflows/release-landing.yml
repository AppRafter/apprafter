# SPDX-License-Identifier: FSL-1.1-Apache-2.0
name: release-landing

# Builds and pushes the landing web + cms container images to
# ghcr.io on every `landing-v*` tag, plus on demand via
# `workflow_dispatch`. Uses the auto-provided `GITHUB_TOKEN` — no
# PAT or external secrets required.
#
# Tag namespace is intentionally separate from the operator's
# `v0.*` / `v1.*` series so landing releases don't accidentally
# fire the operator pipeline and vice-versa. Example: `landing-v0.1.0`.
#
# Image references after a successful run:
#
#   ghcr.io/<owner-lowercased>/landing-web:<tag>
#   ghcr.io/<owner-lowercased>/landing-web:latest
#   ghcr.io/<owner-lowercased>/landing-cms:<tag>
#   ghcr.io/<owner-lowercased>/landing-cms:latest
#
# Security: dynamic github.* values flow only into action inputs;
# the one shell step uses an `env:` binding to avoid expression
# injection (same anti-injection pattern as release-operator.yml).
#
# Why the lowercase shim: docker registry names MUST be lowercase
# but ${{ github.repository_owner }} preserves the org's display
# casing (e.g. `AppRafter`). GitHub Actions has no built-in
# `toLower` function, so a shell `tr` step computes it once.

on:
  push:
    tags:
      - 'landing-v*'
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  landing-web:
    name: build landing-web
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - name: Compute lowercase image base
        id: image-base
        env:
          REPO_OWNER: ${{ github.repository_owner }}
        run: |
          owner_lc=$(echo "$REPO_OWNER" | tr '[:upper:]' '[:lower:]')
          echo "image=ghcr.io/${owner_lc}/landing-web" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push landing-web image
        uses: docker/build-push-action@v7
        with:
          context: landing
          file: landing/web/Dockerfile
          push: true
          tags: |
            ${{ steps.image-base.outputs.image }}:${{ github.ref_name }}
            ${{ steps.image-base.outputs.image }}:latest
          # BUILT FROM THE LIVE CMS, like the preview build — not from
          # the repository fallbacks.
          #
          # It used to inherit the Dockerfile's `LANDING_USE_FALLBACK=1`
          # default while also pushing `:latest`, which production
          # watches. So any push touching `landing/**` republished the
          # site from the fallback JSONs and silently reverted whatever
          # copy had been edited in the admin — observed on 2026-09-10,
          # when a hero/value-props/footer wording change came back to
          # "Open source" until the owner re-promoted.
          #
          # CONTENT_REV must be unique per run for the same reason the
          # preview build documents: the CMS fetch happens inside the
          # `bun run build` layer and is invisible to BuildKit, so a
          # stable value reuses a cached dist and admin edits never
          # reach the image.
          #
          # The cost, accepted deliberately: this build now needs a
          # reachable CMS. If cms.apprafter.dev is down the release
          # fails rather than shipping stale copy — which is the safer
          # of the two failures, because the other one is silent.
          build-args: |
            LANDING_USE_FALLBACK=0
            LANDING_CMS_URL=https://cms.apprafter.dev
            PUBLIC_CMS_URL=https://cms.apprafter.dev
            CONTENT_REV=${{ github.run_id }}-${{ github.run_attempt }}
          # Same x86-only stance as release-operator until the
          # platform learns multi-arch (Hetzner CAX*).
          platforms: linux/amd64
          cache-from: type=gha,scope=landing-web
          cache-to: type=gha,mode=max,scope=landing-web

  landing-cms:
    name: build landing-cms
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v7

      - name: Compute lowercase image base
        id: image-base
        env:
          REPO_OWNER: ${{ github.repository_owner }}
        run: |
          owner_lc=$(echo "$REPO_OWNER" | tr '[:upper:]' '[:lower:]')
          echo "image=ghcr.io/${owner_lc}/landing-cms" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push landing-cms image
        uses: docker/build-push-action@v7
        with:
          context: landing
          file: landing/cms/Dockerfile
          push: true
          tags: |
            ${{ steps.image-base.outputs.image }}:${{ github.ref_name }}
            ${{ steps.image-base.outputs.image }}:latest
          platforms: linux/amd64
          cache-from: type=gha,scope=landing-cms
          cache-to: type=gha,mode=max,scope=landing-cms
