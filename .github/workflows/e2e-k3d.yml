# SPDX-License-Identifier: FSL-1.1-Apache-2.0
name: e2e-k3d

# Push/PR-triggered k3d end-to-end gate. Runs the local GitOps-walk
# e2e (gitops-walk) on master pushes and pull requests touching the
# relevant paths.
#
# This exercises the full GitOps loop (CMP -> Argo CD -> operator ->
# Deployment) on a local k3d cluster -- no cloud spend, no external
# secrets required.
#
# The platform-scope MigrationPlan walk is NOT run here: the
# PlatformController's OCI client is HTTPS-only while k3d's local
# registry is plain HTTP, so the controller cannot pull fixture
# compat-docs in-cluster. The gate is covered by operator unit +
# integration tests; a real-infra migration walk is a tracked
# nightly-Hetzner follow-up (see plan.md §1.81).
#
# e2e/mvp.sh (real Hetzner provision smoke, costs money) is
# intentionally excluded and continues to live in nightly.yml only.
#
# Security note: no secrets are consumed here. All dynamic values
# come from env: bindings following the same pattern as
# platform-stack-check.yml and nightly.yml.

on:
  push:
    branches:
      - master
    paths:
      - 'e2e/**'
      - 'cli/**'
      - 'operator/**'
      - 'platform-stack/**'
      - 'manifests/**'
      - 'schemas/**'
      - 'Justfile'
      - '.github/workflows/e2e-k3d.yml'
  pull_request:
    paths:
      - 'e2e/**'
      - 'cli/**'
      - 'operator/**'
      - 'platform-stack/**'
      - 'manifests/**'
      - 'schemas/**'
      - 'Justfile'
      - '.github/workflows/e2e-k3d.yml'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  # Gate the e2e job on the artifact-publishing workflows that this same
  # push triggered. The gitops-walk bootstraps from PUBLISHED artifacts
  # (operator + admission-webhook images/charts, cue-cmp image, platform-stack
  # chart); on a release push those publishers run CONCURRENTLY with e2e, so
  # without this gate the walk can bootstrap before they finish and pull
  # not-yet-published images -> ImagePullBackOff -> "no matches for kind
  # ServiceProvider" -> ~22 min bootstrap-timeout FALSE red (observed on the
  # 2.16b app-scope, 2.6c and 2.16b-sc release pushes). A cheap runner does
  # the waiting so the heavy e2e runner only spins up once artifacts exist.
  # Push-only: on pull_request / workflow_dispatch there are no publishers,
  # so this job is skipped and e2e runs directly.
  await-releases:
    name: await release publishes
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    steps:
      - name: Wait for publisher workflows on this commit
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
        run: |
          set -uo pipefail
          # Publishers whose artifacts the gitops-walk consumes. We match
          # completed runs by WORKFLOW NAME (not by re-declaring each one's
          # path filter here) so this gate cannot drift from their triggers.
          publishers="release-operator platform-stack-publish argocd-cue-cmp-publish"
          api="/repos/${REPO}/actions/runs?event=push&per_page=100"

          # Discover which publishers this push triggered — they share our
          # head_sha. `gh run list --commit` uses a search index that lags
          # minutes; the REST head_sha filter is prompt. Early-exit once all
          # three are seen; a publisher whose path filter did not match simply
          # never appears (correct to skip — nothing new to wait for).
          seen=""
          for _ in $(seq 1 10); do   # ~2.5 min appearance window
            seen=$(gh api "$api" --jq ".workflow_runs[] | select(.head_sha==\"${SHA}\") | .name" 2>/dev/null | sort -u || true)
            n=0
            for p in $publishers; do
              if printf '%s\n' "$seen" | grep -qx "$p"; then n=$((n + 1)); fi
            done
            [ "$n" -eq 3 ] && break
            sleep 15
          done

          rc=0
          for p in $publishers; do
            if ! printf '%s\n' "$seen" | grep -qx "$p"; then
              echo "· ${p}: not triggered for this commit — nothing to wait for"
              continue
            fi
            id=$(gh api "$api" --jq ".workflow_runs[] | select(.head_sha==\"${SHA}\" and .name==\"${p}\") | .id" 2>/dev/null | head -1)
            echo "· ${p}: waiting for run ${id} to finish ..."
            if gh run watch "$id" --repo "$REPO" --exit-status >/dev/null 2>&1; then
              echo "  ✓ ${p} (${id}) succeeded — its artifacts are published"
            else
              c=$(gh run view "$id" --repo "$REPO" --json conclusion --jq .conclusion 2>/dev/null || echo unknown)
              echo "::error::${p} (${id}) concluded '${c}'; the gitops-walk would pull missing/broken artifacts — failing the e2e gate."
              rc=1
            fi
          done
          exit "$rc"

  e2e-k3d:
    name: k3d e2e (gitops-walk)
    # Run after the publisher gate. On push: only if the gate passed (a failed
    # publisher means broken/missing artifacts, so skip the pointless e2e and
    # surface the publisher failure). On pull_request / workflow_dispatch the
    # gate is skipped, so run directly.
    needs: [await-releases]
    if: ${{ !cancelled() && (needs.await-releases.result == 'success' || needs.await-releases.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            cli/target
          key: ${{ runner.os }}-cargo-e2e-${{ hashFiles('cli/**/Cargo.lock', 'cli/**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-e2e-
            ${{ runner.os }}-cargo-

      - name: Install CUE
        uses: cue-lang/setup-cue@v1.0.1
        with:
          version: v0.10.0

      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'v1.31.0'

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.2

      - name: Install kind
        run: |
          curl -fsSL --retry 5 --retry-delay 5 --retry-all-errors --connect-timeout 30 -o ./kind https://kind.sigs.k8s.io/dl/v0.24.0/kind-linux-amd64
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind
          kind version

      - name: Load iptables kernel modules for Cilium
        # Cilium's datapath sets up IPv4 + IPv6 iptables rules (the
        # production config is dual-stack, ADR 0017). The k3d nodes
        # share the runner's kernel, but ubuntu-latest does not load
        # the ip6tables modules by default, so the cilium-agent
        # crash-loops with "could not load module ip6_tables". Load
        # them on the host so they are available inside the k3d nodes.
        # NOTE: `modprobe -a` — without it, `modprobe ip6_tables
        # ip6table_mangle ...` loads ONLY the first module and treats
        # the rest as parameters, so ip6table_mangle stayed unloaded
        # and the agent still crashed on it.
        # nat + xt_socket are also needed (the agent logged non-fatal
        # "could not load module iptable_nat / xt_socket" warnings —
        # Cilium masquerade + socket-LB use them); load them too.
        run: |
          sudo modprobe -a \
            ip_tables iptable_mangle iptable_raw iptable_filter iptable_nat \
            ip6_tables ip6table_mangle ip6table_raw ip6table_filter ip6table_nat \
            nf_nat xt_socket || true
          lsmod | grep -E 'ip6?table|nf_nat|xt_socket' || true

      - name: Install just
        # `just e2e` is the suite entrypoint (single source of truth,
        # matches local `just e2e`). `just` is not on ubuntu-latest by
        # default. Pull the prebuilt static binary straight from GitHub
        # releases rather than piping just.systems/install.sh — that CDN
        # intermittently 403s GitHub Actions egress (observed
        # 2026-06-02, run 26815686851).
        env:
          JUST_VERSION: 1.51.0
        run: |
          curl --proto '=https' --tlsv1.2 -sSfL --retry 5 --retry-connrefused \
            "https://github.com/casey/just/releases/download/${JUST_VERSION}/just-${JUST_VERSION}-x86_64-unknown-linux-musl.tar.gz" \
            | sudo tar -xz -C /usr/local/bin just
          just --version

      - name: Warm the CLI build cache
        working-directory: cli
        # The e2e scripts invoke the CLI via `cargo run` (lib.sh's
        # `apprafter()` shell function), so a debug build of the
        # `apprafter` binary here just warms the cache for the timed
        # script runs below — no PATH binary is consumed.
        run: cargo build --bin apprafter

      - name: Run k3d e2e suite
        run: just e2e
