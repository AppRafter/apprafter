# SPDX-License-Identifier: FSL-1.1-Apache-2.0
name: test

# Per-stack test gating. Same pattern as `lint.yml`: each
# stack's job opts in via a `dorny/paths-filter` flag so a
# CLI-only push doesn't `cargo test` the operator workspace
# (300+ tests, slow to compile fresh), and a TypeScript-only
# change doesn't compile any Rust. Walk-fix post-v0.1.156.

on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  changes:
    name: detect stack changes
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      rust_cli: ${{ steps.filter.outputs.rust_cli }}
      rust_operator: ${{ steps.filter.outputs.rust_operator }}
      bun: ${{ steps.filter.outputs.bun }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            rust_cli:
              - 'cli/**'
              - '.github/workflows/test.yml'
            rust_operator:
              - 'operator/**'
              - '.github/workflows/test.yml'
            bun:
              - 'landing/**'
              - 'backstage-plugins/**'
              - '.github/workflows/test.yml'

  rust-cli:
    name: cargo test cli/
    needs: changes
    if: needs.changes.outputs.rust_cli == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # `cargo test --all` here runs docsgen's recipe_corpus_test,
          # which builds the same gate `docsgen gate` does — and that
          # ages every documentation exemption by resolving its
          # `since=vX.Y.Z` to that tag's commit date. An exemption it
          # cannot age is VOID (cli/docsgen/src/gate.rs), and the
          # default `fetch-depth: 1` fetches no tags at all. Without
          # this the corpus test fails HERE while passing on every
          # developer's machine, reporting the exempted line rather than
          # the missing tag — which is exactly what it did. Same reason
          # docs.yml and release-docs.yml carry it.
          fetch-depth: 0
      # cli/cli-providers/build.rs shells out to `cue export`
      # at compile time (Track B.1.71). Without cue on PATH
      # the build script panics with NotFound.
      - uses: cue-lang/setup-cue@v1.0.1
        with:
          version: v0.10.0
      - uses: dtolnay/rust-toolchain@stable
      - working-directory: cli
        run: cargo test --all --all-features

  rust-operator:
    name: cargo test operator/
    needs: changes
    if: needs.changes.outputs.rust_operator == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - working-directory: operator
        run: cargo test --all --all-features

  bun:
    name: bun test
    needs: changes
    if: needs.changes.outputs.bun == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - id: detect
        run: |
          # Skip Bun workspace children: their parent package.json
          # already declares them via `workspaces`, and `bun test`
          # walks the whole tree from the workspace root — running
          # again per child re-discovers the same suite and re-
          # installs deps for no gain.
          dirs=""
          while IFS= read -r pkg; do
            d="$(dirname "$pkg")"
            parent_pkg="$(dirname "$d")/package.json"
            if [ -f "$parent_pkg" ] && grep -q '"workspaces"' "$parent_pkg"; then
              continue
            fi
            dirs="$dirs $d"
          done < <(find . -maxdepth 4 -name package.json \
              -not -path '*/node_modules/*' \
              -not -path '*/skeleton/*' \
              | sort -u)
          dirs="$(echo "$dirs" | xargs)"
          if [ -n "$dirs" ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "dirs=$dirs" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "::notice::no package.json yet — skipping bun test"
          fi
      - if: steps.detect.outputs.found == 'true'
        run: |
          for dir in ${{ steps.detect.outputs.dirs }}; do
            echo "::group::bun test in $dir"
            (cd "$dir" && bun install --frozen-lockfile && bun test)
            echo "::endgroup::"
          done
