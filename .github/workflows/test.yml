# SPDX-License-Identifier: FSL-1.1-MIT
name: test

on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  rust:
    name: cargo test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - id: detect
        run: |
          dirs=$(find . -mindepth 2 -maxdepth 2 -name Cargo.toml \
              -not -path './target/*' -not -path '*/node_modules/*' \
              | xargs -r -n1 dirname | sort -u | tr '\n' ' ')
          if [ -n "$dirs" ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "dirs=$dirs" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "::notice::no Cargo.toml yet — skipping cargo test"
          fi
      - if: steps.detect.outputs.found == 'true'
        run: |
          for dir in ${{ steps.detect.outputs.dirs }}; do
            echo "::group::cargo test in $dir"
            (cd "$dir" && cargo test --all --all-features)
            echo "::endgroup::"
          done

  bun:
    name: bun test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - id: detect
        run: |
          dirs=$(find . -maxdepth 4 -name package.json \
              -not -path '*/node_modules/*' \
              -not -path '*/skeleton/*' \
              | xargs -r -n1 dirname | sort -u | tr '\n' ' ')
          if [ -n "$dirs" ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "dirs=$dirs" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "::notice::no package.json yet — skipping bun test"
          fi
      - if: steps.detect.outputs.found == 'true'
        run: |
          for dir in ${{ steps.detect.outputs.dirs }}; do
            echo "::group::bun test in $dir"
            (cd "$dir" && bun install --frozen-lockfile && bun test)
            echo "::endgroup::"
          done
