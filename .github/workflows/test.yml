# SPDX-License-Identifier: FSL-1.1-Apache-2.0
name: test

# Per-stack test gating. Same pattern as `lint.yml`: each
# stack's job opts in via a `dorny/paths-filter` flag so a
# CLI-only push doesn't `cargo test` the operator workspace
# (300+ tests, slow to compile fresh), and a TypeScript-only
# change doesn't compile any Rust. Walk-fix post-v0.1.156.

on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  changes:
    name: detect stack changes
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      rust_cli: ${{ steps.filter.outputs.rust_cli }}
      rust_operator: ${{ steps.filter.outputs.rust_operator }}
      bun: ${{ steps.filter.outputs.bun }}
      desktop: ${{ steps.filter.outputs.desktop }}
      desktop_web: ${{ steps.filter.outputs.desktop_web }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            rust_cli:
              - 'cli/**'
              - '.github/workflows/test.yml'
            rust_operator:
              - 'operator/**'
              - '.github/workflows/test.yml'
            bun:
              - 'landing/**'
              - 'backstage-plugins/**'
              - '.github/workflows/test.yml'
            # AppRafter Desktop (ADR 0067). The Rust side builds apprafter-core by
            # path, so its whole path-crate closure wakes it (`cargo tree -p
            # apprafter-core -e normal,build` in cli/: apprafter-core, cli-core,
            # cli-providers, backup-core); cli-providers/build.rs runs `cue export`
            # over platform-stack/cue with the repo-root cue.mod/ and reads both
            # operator Chart.yaml files.
            desktop:
              - 'desktop/**'
              - 'cli/apprafter-core/**'
              - 'cli/cli-core/**'
              - 'cli/cli-providers/**'
              - 'cli/backup-core/**'
              - 'cli/Cargo.toml'
              - 'cli/Cargo.lock'
              - 'platform-stack/cue/**'
              - 'cue.mod/**'
              - 'scripts/cue'
              - 'operator/charts/*/Chart.yaml'
              - 'deny.toml'
              - 'scripts/cargo-deny.sh'
              - 'scripts/check-desktop-core-lock.sh'
              - 'scripts/check-desktop-ipc-types.sh'
              - 'scripts/test-osauth-linux.sh'
              - '.github/workflows/test.yml'
            # The desktop's bun package; its CLI-coverage gate reads the
            # generated CLI reference.
            desktop_web:
              - 'desktop/**'
              - 'docs/reference/cli/commands.json'
              - '.github/workflows/test.yml'

  rust-cli:
    name: cargo test cli/ (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.rust_cli == 'true'
    # The CLI ships for macOS and Windows as well as Linux, and code that
    # only compiles on Unix (signals, file modes, `#!/bin/sh` stubs) is
    # caught nowhere else. fail-fast off: a Windows-only failure must not
    # cancel the Linux run that says whether the change is otherwise sound.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # A test that hangs (a lock never released, a child never reaped) must
    # fail the leg, not hold a runner for the six-hour default.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # `cargo test --all` here runs docsgen's recipe_corpus_test,
          # which builds the same gate `docsgen gate` does — and that
          # ages every documentation exemption by resolving its
          # `since=vX.Y.Z` to that tag's commit date. An exemption it
          # cannot age is VOID (cli/docsgen/src/gate.rs), and the
          # default `fetch-depth: 1` fetches no tags at all. Without
          # this the corpus test fails HERE while passing on every
          # developer's machine, reporting the exempted line rather than
          # the missing tag — which is exactly what it did. Same reason
          # docs.yml and release-docs.yml carry it.
          fetch-depth: 0
      # cli/cli-providers/build.rs shells out to `cue export`
      # at compile time (Track B.1.71). Without cue on PATH
      # the build script panics with NotFound.
      - uses: cue-lang/setup-cue@b0e30e540a2dae47304ebf16586a5b2db023b61c # v2.0.0
        with:
          version: v0.17.1
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: "1.98"
      # --no-fail-fast: cargo otherwise stops at the first test target that
      # fails, so a leg reported one broken target and hid every other one
      # behind it — one CI round per failure instead of one for all of them.
      - if: runner.os == 'Linux'
        working-directory: cli
        run: cargo test --all --all-features --no-fail-fast
      # macOS and Windows build two crates fewer. `apprafter-backup` is the
      # in-cluster backup runner: it ships only as a Linux container image.
      # `docsgen` is the documentation generator, and its gate compares the
      # generated CLI reference byte for byte with the committed one, which
      # is a property of the source tree, not of the host — the Linux run
      # above already enforces it. Clippy runs here because lint.yml lints
      # on Linux only, so a warning in Windows- or macOS-only code would
      # otherwise reach master unseen. `shell: bash` on both, so the commands
      # run under the same shell on every runner (Windows defaults to pwsh).
      - if: runner.os != 'Linux'
        name: cargo clippy (macOS, Windows)
        working-directory: cli
        shell: bash
        run: cargo clippy --workspace --exclude apprafter-backup --exclude docsgen --all-targets --all-features -- -D warnings
      # One test is skipped on Windows, by name, because it found a real bug
      # that cannot be fixed in the change that found it:
      # backup-core's `repo_parent_to_create` reads a drive path (`D:\x\repo`)
      # as a remote `<scheme>:` repository, so a fresh local repository on
      # Windows gets no parent directory and `restic init` fails. Any edit
      # under cli/backup-core moves the chart's backup-runner pin
      # (scripts/check-backup-runner-pin.sh), which is a platform-stack
      # release; the fix rides the runner re-pin planned for D.11 (WI-439),
      # and that change deletes this skip.
      - if: runner.os != 'Linux'
        name: cargo test (macOS, Windows)
        working-directory: cli
        shell: bash
        run: |
          skip=()
          if [[ "$RUNNER_OS" == Windows ]]; then
            skip=(-- --skip engine::tests::ensure_repo_initialises_a_missing_local_repo_and_creates_its_parent)
          fi
          cargo test --workspace --exclude apprafter-backup --exclude docsgen --all-features --no-fail-fast "${skip[@]}"

  # One check under the fixed name `cargo test cli/`, whatever the matrix
  # does. The matrix reports a check per leg, `cargo test cli/ (<os>)`, so a
  # branch protection rule that requires the pre-matrix name would wait for
  # a check that never comes — and when nothing under cli/ changed, the
  # skipped matrix reports one check with its name's expression unexpanded.
  # This job passes when every leg passed, or when the matrix was skipped
  # because nothing under cli/ changed, and fails otherwise. "Skipped" is
  # only that when the change detection itself succeeded: a failed
  # `changes` job skips the matrix too, and must not read as a pass.
  rust-cli-result:
    name: cargo test cli/
    needs: [changes, rust-cli]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: every leg of the matrix passed
        env:
          CHANGES: ${{ needs.changes.result }}
          RESULT: ${{ needs.rust-cli.result }}
        run: |
          echo "changes: $CHANGES, rust-cli: $RESULT"
          if [ "$CHANGES" != success ]; then
            exit 1
          fi
          case "$RESULT" in
            success | skipped) ;;
            *) exit 1 ;;
          esac

  # AppRafter Desktop (ADR 0067) ships for Linux, macOS and Windows, so it is
  # tested and built on all three. fail-fast off for the reason rust-cli gives.
  rust-desktop:
    name: cargo test desktop/ (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.desktop == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # A cold Tauri build on Windows takes 15–25 minutes.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - if: runner.os == 'Linux'
        name: Install WebKitGTK / GTK (Tauri 2 Linux prerequisites)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential pkg-config file \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev
      # cli/cli-providers/build.rs runs `cue export` — same reason as rust-cli.
      - uses: cue-lang/setup-cue@b0e30e540a2dae47304ebf16586a5b2db023b61c # v2.0.0
        with:
          version: v0.17.1
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: "1.98"
          components: clippy
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.x"
      # Clippy runs here on macOS and Windows because lint.yml lints on Linux only.
      - if: runner.os != 'Linux'
        name: cargo clippy (macOS, Windows)
        working-directory: desktop
        shell: bash
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: cargo test
        working-directory: desktop
        shell: bash
        run: cargo test --locked --all-features --no-fail-fast
      # The committed TypeScript IPC types match a fresh export. One leg is enough: the
      # export writes the same bytes on every OS.
      - if: runner.os == 'Linux'
        name: TypeScript IPC types are current
        run: bash scripts/check-desktop-ipc-types.sh
      # Evidence that the app builds on this OS: a debug binary, no installer.
      - name: tauri build --debug --no-bundle
        working-directory: desktop
        shell: bash
        run: |
          bun install --frozen-lockfile
          bun run tauri build --debug --no-bundle

  # The Linux polkit backend (desktop/os-auth) against a real polkitd: every case of
  # desktop/os-auth/tests/polkit_container.rs in a fresh Debian container, through the same
  # script a developer runs. Rootful podman: each case puts the test in a logind-style session
  # cgroup, and a rootless podman can write the cgroup tree only under a systemd user session,
  # which the runner does not have. The script fails, never skips, when podman is missing.
  osauth-linux:
    name: OS authentication on Linux (polkit container)
    needs: changes
    if: needs.changes.outputs.desktop == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The test links apprafter-core, so cli/cli-providers/build.rs runs `cue export`.
      - uses: cue-lang/setup-cue@b0e30e540a2dae47304ebf16586a5b2db023b61c # v2.0.0
        with:
          version: v0.17.1
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: "1.98"
      - name: polkit cases
        env:
          PODMAN: sudo podman
        run: bash scripts/test-osauth-linux.sh

  # One check under the fixed name `cargo test desktop/`, whatever the matrix
  # does — the same reasoning and logic as rust-cli-result above. It also
  # stands for osauth-linux, the desktop's other test job.
  rust-desktop-result:
    name: cargo test desktop/
    needs: [changes, rust-desktop, osauth-linux]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: every desktop test job passed
        env:
          CHANGES: ${{ needs.changes.result }}
          RESULT: ${{ needs.rust-desktop.result }}
          OSAUTH: ${{ needs.osauth-linux.result }}
        run: |
          echo "changes: $CHANGES, rust-desktop: $RESULT, osauth-linux: $OSAUTH"
          if [ "$CHANGES" != success ]; then
            exit 1
          fi
          for result in "$RESULT" "$OSAUTH"; do
            case "$result" in
              success | skipped) ;;
              *) exit 1 ;;
            esac
          done

  rust-operator:
    name: cargo test operator/
    needs: changes
    if: needs.changes.outputs.rust_operator == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: "1.98"
      - working-directory: operator
        run: cargo test --all --all-features

  # Dependency HEALTH, which is a different question from the version watcher's
  # "are we behind?" — a dead crate sits on its own final release forever and so
  # is never behind, and an advisory with no patched version is not a version
  # gap either. The first run of this found five things the watcher had never
  # reported: rsa/Marvin plus four unmaintained crates, all four arriving
  # through a single dependency.
  #
  # It runs HERE rather than only in `just lint` because `just lint` is invoked
  # by no workflow at all — a gate that lives only there fires only when
  # somebody happens to type it.
  #
  # The job installs the binary and runs scripts/cargo-deny.sh rather than
  # calling a cargo-deny action directly, so CI and a local run execute the
  # SAME gate. Two invocations of the same tool with separately-maintained
  # arguments is how a CI gate and its local twin drift apart.
  cargo-deny:
    name: cargo-deny (advisories, licences, sources)
    needs: changes
    if: needs.changes.outputs.rust_cli == 'true' || needs.changes.outputs.rust_operator == 'true' || needs.changes.outputs.desktop == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: "1.98"
      # The minor is pinned (patch floats): 0.20 moved `--config` to the top
      # level, and an unpinned install picks up such a CLI change on the day
      # install-action's manifest moves. scripts/cargo-deny.sh places the
      # flag for 0.19 (the nixpkgs fallback) and 0.20 alike.
      - uses: taiki-e/install-action@dfae9bf3d6f6c6f20ef4ebb3486c01a51341ff12 # v2.87.18
        with:
          tool: cargo-deny@0.20
      - run: bash scripts/cargo-deny.sh

  bun:
    name: bun test
    needs: changes
    if: needs.changes.outputs.bun == 'true' || needs.changes.outputs.desktop_web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - id: detect
        run: |
          # Skip Bun workspace children: their parent package.json
          # already declares them via `workspaces`, and `bun test`
          # walks the whole tree from the workspace root — running
          # again per child re-discovers the same suite and re-
          # installs deps for no gain.
          # desktop/design-source/ is the design export, kept verbatim:
          # nothing there is a package of ours.
          dirs=""
          while IFS= read -r pkg; do
            d="$(dirname "$pkg")"
            parent_pkg="$(dirname "$d")/package.json"
            if [ -f "$parent_pkg" ] && grep -q '"workspaces"' "$parent_pkg"; then
              continue
            fi
            dirs="$dirs $d"
          done < <(find . -maxdepth 4 -name package.json \
              -not -path '*/node_modules/*' \
              -not -path '*/skeleton/*' \
              -not -path './desktop/design-source/*' \
              | sort -u)
          dirs="$(echo "$dirs" | xargs)"
          if [ -n "$dirs" ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "dirs=$dirs" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "::notice::no package.json yet — skipping bun test"
          fi
      - if: steps.detect.outputs.found == 'true'
        run: |
          for dir in ${{ steps.detect.outputs.dirs }}; do
            echo "::group::bun test in $dir"
            (cd "$dir" && bun install --frozen-lockfile && bun test)
            echo "::endgroup::"
          done
