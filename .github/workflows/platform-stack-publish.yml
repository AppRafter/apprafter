# SPDX-License-Identifier: FSL-1.1-Apache-2.0
name: platform-stack-publish

# Builds, signs, and publishes the AppRafter platform-stack
# umbrella Helm chart. The chart is pushed to two channels in
# parallel (ADR 0028):
#
#   1. OCI registry — `oci://ghcr.io/<owner>/platform-stack:<version>`.
#      Primary distribution; Argo CD pulls from here on every
#      `PlatformStack` reconcile.
#   2. GitHub Release attachment — the rendered `.tgz` plus its
#      cosign signature, for users who want to consume the chart
#      via plain Helm without involving AppRafter components.
#
# Signing is cosign keyless (Sigstore OIDC + GitHub Actions
# ambient identity). No long-lived signing keys to manage.
#
# Version resolution: the canonical chart version lives in
# `platform-stack/cue/platform.cue` as `currentVersion`. The
# workflow reads it via `cue export ./platform-stack/cue/... -e
# currentVersion` — `tier1.version`, `tier2.version`, and the
# `compatibility.cue` key invariant all flow from that single
# definition. The optional `version_override` workflow input
# is for emergency / debugging re-publishes against a specific
# commit; normal release flow leaves it empty.
#
# Trigger model (auto-publish on currentVersion bump):
#
# - Workflow runs on every push to master that touches
#   `platform-stack/**` plus the workflow file itself.
#   `workflow_dispatch` stays as the manual / emergency
#   override path.
# - The `detect` job reads `currentVersion` from CUE and
#   checks whether `platform-stack/v<version>` is already a
#   tag on origin. If yes, the publish job is skipped — the
#   commit was a non-bump edit (typo / refactor / drift). If
#   no, the publish job runs.
# - The `publish` job CREATES the git tag `platform-stack/v<version>`
#   as its LAST step via `gh release create --target $GITHUB_SHA`.
#   The pre-publish state is "branch master is ahead of the
#   latest published tag"; the post-publish state is "tag
#   exists on origin, future master pushes at the same
#   currentVersion no-op".
# - Drift between commits-and-publishes is enforced by the
#   sibling `platform-stack-check.yml` workflow at PR time:
#   chart source changes without a currentVersion bump fail
#   that workflow before merge.
#
# Compatibility gate: before publishing, the workflow asserts
# that `compatibility.cue` contains an entry for the resolved
# version. Combined with the CUE-level invariant
# `compatibility: (currentVersion): #VersionRecord`, missing
# entries are caught at edit time (`cue vet -c`), at PR time
# (`platform-stack-check.yml`), and at publish time (here).
#
# Security note (per the workflow-injection guide): every
# dynamic value (`github.repository_owner`,
# `github.event.inputs.*`, `github.repository`) is consumed via
# an `env:` binding rather than direct expression
# interpolation into `run:` bodies. Pattern matches
# `release-operator.yml`.

on:
  push:
    branches: [master]
    paths:
      - 'platform-stack/**'
      - 'scripts/check-platform-stack-version.sh'
      - '.github/workflows/platform-stack-publish.yml'
  workflow_dispatch:
    inputs:
      version_override:
        description: |
          Optional. Publish a specific version regardless of
          what `currentVersion` says in `platform.cue`. Leave
          empty for the normal flow (workflow reads
          `currentVersion` from the CUE source). Use only for
          emergency re-publishes; the value MUST still have a
          matching `compatibility.cue` entry.
        required: false
        type: string

permissions:
  contents: write   # create GitHub Release, push tag
  packages: write   # push to ghcr.io
  id-token: write   # cosign keyless OIDC

jobs:
  detect:
    name: resolve currentVersion + check if publish needed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      is_prerelease: ${{ steps.version.outputs.is_prerelease }}
      tag: ${{ steps.version.outputs.tag }}
      should_publish: ${{ steps.gate.outputs.should_publish }}

    steps:
      - uses: actions/checkout@v4

      - name: Install CUE (needed for currentVersion resolution)
        uses: cue-lang/setup-cue@v1.0.1
        with:
          version: v0.10.0

      - name: Resolve version from CUE or override
        id: version
        env:
          OVERRIDE: ${{ github.event.inputs.version_override }}
        run: |
          # Normal flow: read `currentVersion` from the CUE
          # source — the single source of truth declared in
          # `platform-stack/cue/platform.cue`. The override
          # input is for emergency re-publishes only.
          if [[ -n "${OVERRIDE:-}" ]]; then
            version="${OVERRIDE}"
            echo "::notice::Using version_override='${version}' (skipping currentVersion lookup)"
          else
            version=$(cue export ./platform-stack/cue/... \
              -e currentVersion --out text)
            if [[ -z "${version:-}" ]]; then
              echo "::error::failed to resolve currentVersion from CUE source"
              exit 1
            fi
            echo "Resolved currentVersion=${version} from platform.cue"
          fi
          # Pre-release (`0.1.0-rc1`) → push only `:<version>`.
          # Stable (`0.1.0`) → also tag `:latest`.
          if [[ "$version" == *-* ]]; then
            is_prerelease=true
          else
            is_prerelease=false
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "is_prerelease=$is_prerelease" >> "$GITHUB_OUTPUT"
          echo "tag=platform-stack/v$version" >> "$GITHUB_OUTPUT"

      - name: Check whether currentVersion is already published
        id: gate
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          # Tag is created by the publish job as its LAST step.
          # If it already exists on origin, this push touched
          # platform-stack/** without bumping currentVersion —
          # i.e. a refactor, docs fix, or (caught by
          # platform-stack-check.yml at PR time) a drift bug.
          # Either way, publishing again would be wrong.
          if git ls-remote --tags --exit-code origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "::notice::Tag ${TAG} already exists on origin — currentVersion has not been bumped. Skipping publish."
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Tag ${TAG} not yet on origin — proceeding to publish."
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
          fi

  publish:
    name: render, sign, and publish
    needs: detect
    if: needs.detect.outputs.should_publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Re-expose detect outputs as a single step source
        id: version
        env:
          VERSION: ${{ needs.detect.outputs.version }}
          IS_PRERELEASE: ${{ needs.detect.outputs.is_prerelease }}
          TAG: ${{ needs.detect.outputs.tag }}
        run: |
          # Mirroring detect.outputs onto this job's step
          # outputs keeps the rest of the file readable —
          # all later steps reference `steps.version.outputs.*`
          # the same way they did before the job split.
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "is_prerelease=$IS_PRERELEASE" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Compute lowercase owner
        id: owner
        env:
          REPO_OWNER: ${{ github.repository_owner }}
        run: |
          owner_lc=$(echo "$REPO_OWNER" | tr '[:upper:]' '[:lower:]')
          echo "lowercase=$owner_lc" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${owner_lc}/platform-stack" >> "$GITHUB_OUTPUT"

      - name: Install CUE
        # `detect` ran in its own job and installed CUE in
        # that runner — the `publish` job starts on a fresh
        # runner, so we install CUE here too. The
        # compatibility-gate script + `make render-only`
        # below both shell out to `cue`.
        uses: cue-lang/setup-cue@v1.0.1
        with:
          version: v0.10.0

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.2

      - name: Install cosign
        uses: sigstore/cosign-installer@v3
        with:
          cosign-release: v2.4.1

      - name: Verify compatibility.cue has an entry for the version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: bash scripts/check-platform-stack-version.sh "$VERSION"

      - name: Verify every yanked entry carries a non-empty yankedReason
        # B.1.74a CI guard. The CUE schema cannot express the
        # conditional invariant "yankedReason required when
        # yanked: true" as a single field constraint, so we
        # enforce it here at publish time. A yanked entry
        # without a reason is a chart-author error — fresh
        # clusters would see a YankedVersion=True condition with
        # an empty message, which defeats the purpose of the
        # soft-recall flow.
        run: |
          set -euo pipefail
          json=$(cue export ./platform-stack/cue/... -e compatibility --out json)
          missing=$(jq -r '
            to_entries[]
            | select(.value.yanked == true)
            | select((.value.yankedReason // "") == "")
            | .key
          ' <<<"$json")
          if [[ -n "$missing" ]]; then
            echo "::error::compatibility.cue has yanked entries without a yankedReason:"
            echo "$missing"
            echo "::error::Set a non-empty yankedReason on every yanked: true entry before publish."
            exit 1
          fi
          echo "::notice::All yanked entries (if any) carry a non-empty yankedReason."

      - name: Render umbrella chart from CUE
        run: make -C platform-stack render-only

      - name: helm lint
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: helm lint "platform-stack/dist/platform-stack-${VERSION}"

      - name: helm template smoke (tier-1 + tier-2)
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          helm template platform "platform-stack/dist/platform-stack-${VERSION}" \
            > /tmp/rendered-tier1.yaml
          # Default render must contain the six tier-1 Apps.
          # Backstage + argocd-cue-cmp are intentionally absent.
          for app in admission-webhook apprafter-operator argocd cert-manager cilium network-policies; do
            if ! grep -q "name: \"${app}\"" /tmp/rendered-tier1.yaml; then
              echo "::error::tier-1 render missing expected Argo CD Application: ${app}"
              exit 1
            fi
          done
          helm template platform "platform-stack/dist/platform-stack-${VERSION}" \
            --values "platform-stack/dist/platform-stack-${VERSION}/examples/values.team.yaml" \
            > /tmp/rendered-tier2.yaml
          grep -q 'name: "backstage"' /tmp/rendered-tier2.yaml || {
            echo "::error::tier-2 render did not enable backstage"
            exit 1
          }

      - name: helm package
        id: package
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          helm package "platform-stack/dist/platform-stack-${VERSION}" \
            --destination platform-stack/dist
          echo "tgz=platform-stack/dist/platform-stack-${VERSION}.tgz" >> "$GITHUB_OUTPUT"

      - name: Set up oras
        # Needed by the channel-tag move below (`oras tag`) and
        # the `:latest` retag. oras carbon-copies the Helm OCI
        # *image manifest* under a new tag; `docker buildx
        # imagetools create` would instead wrap it in an image
        # INDEX, which the operator's ADR-0041 fast path rejects
        # (`expected image manifest, got image index`) — breaking
        # channel-latest resolution on every release. Pinning the
        # action also makes the `:latest` step's runtime guard a
        # belt-and-braces check rather than the sole guarantee.
        uses: oras-project/setup-oras@v1

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: helm push to OCI
        id: push
        env:
          IMAGE: ${{ steps.owner.outputs.image }}
          VERSION: ${{ steps.version.outputs.version }}
          OWNER_LC: ${{ steps.owner.outputs.lowercase }}
          TGZ: ${{ steps.package.outputs.tgz }}
        run: |
          # `helm push` of an OCI artifact derives the registry
          # tag from Chart.yaml's `version` — exactly what we
          # want for the primary push.
          #
          # Capture the push stdout so we can extract the
          # `Digest: sha256:…` line — that's the immutable
          # digest cosign signs against (Sigstore best
          # practice: never sign a mutable tag). `helm show
          # chart` prints the Chart.yaml metadata, which has
          # NO `digest:` field, so we can't fall back to that.
          push_output=$(mktemp)
          helm push "$TGZ" "oci://ghcr.io/${OWNER_LC}" \
            2>&1 | tee "$push_output"
          digest=$(awk '/^Digest:/ {print $2; exit}' "$push_output")
          if [[ -z "$digest" ]]; then
            echo "::error::failed to resolve OCI digest for ${IMAGE}:${VERSION} from helm push output"
            exit 1
          fi
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "::notice::Resolved OCI digest: ${digest}"

      - name: Move channel tags (:stable / :beta / :edge)
        # ADR 0041: after the immutable `:<version>` chart is
        # pushed, MOVE the rolling channel tag(s) the version
        # belongs to so they point at this release. Channel
        # membership:
        #   stable (no pre-release segment) -> stable, beta, edge
        #   rc.* / beta.*                    -> beta, edge
        #   any other pre-release            -> edge
        # This step is REQUIRED — a failed `oras tag` fails the
        # job. A missed channel tag must be visible; the
        # operator's absent-tag fallback covers a genuinely
        # missing tag, but a silent move-failure must not pass.
        # We are already inside the publish path (the whole
        # `publish` job is gated on should_publish == 'true'),
        # so this only runs when actually publishing.
        #
        # `oras tag` (NOT `docker buildx imagetools create`):
        # carbon-copies the Helm OCI image manifest under the
        # channel tag. buildx would re-wrap it in an image index
        # the operator's fast path rejects — see the `Set up oras`
        # step. The membership regex MUST mirror the operator's
        # `channel_matches` exactly: `^(rc|beta)(\.|$)` (dot or
        # end-of-string — bare `rc`/`beta` and `rc.`/`beta.`).
        # A hyphen form like `rc-1` is `#Version`-legal but
        # edge-only on both sides; keeping the two identical
        # prevents a `:beta` tag pointing at a chart the operator
        # treats as edge.
        env:
          REPO: ${{ steps.owner.outputs.image }}
          VER: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          ver="$VER"
          repo="$REPO"
          # Channel membership (ADR 0041): stable(no pre) -> all
          # three; rc./beta. (or bare rc/beta) -> beta,edge; other
          # pre -> edge.
          pre="${ver#*-}"
          [ "$pre" = "$ver" ] && pre=""
          if [ -z "$pre" ]; then
            channels="stable beta edge"
          elif printf '%s' "$pre" | grep -qE '^(rc|beta)(\.|$)'; then
            channels="beta edge"
          else
            channels="edge"
          fi
          echo "::notice::moving channel tags [${channels}] -> ${repo}:${ver}"
          # shellcheck disable=SC2086 # word-splitting $channels is intentional
          oras tag "${repo}:${ver}" $channels

      - name: cosign sign (keyless via OIDC)
        env:
          IMAGE: ${{ steps.owner.outputs.image }}
          DIGEST: ${{ steps.push.outputs.digest }}
          COSIGN_EXPERIMENTAL: "1"
        run: |
          # Sign the immutable digest, not the mutable tag —
          # protects against tag-overwrite attacks.
          cosign sign --yes "${IMAGE}@${DIGEST}"

      - name: cosign sign-blob for the `.tgz` attachment
        env:
          TGZ: ${{ steps.package.outputs.tgz }}
          COSIGN_EXPERIMENTAL: "1"
        run: |
          # Detached signature for users who consume the GitHub
          # Release `.tgz` directly without OCI. Outputs
          # <tgz>.sig + <tgz>.pem; verify with
          # `cosign verify-blob --signature <sig> --certificate <pem>`.
          cosign sign-blob --yes \
            --output-signature "${TGZ}.sig" \
            --output-certificate "${TGZ}.pem" \
            "$TGZ"

      - name: Tag `:latest` on stable releases
        if: steps.version.outputs.is_prerelease == 'false'
        env:
          IMAGE: ${{ steps.owner.outputs.image }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # Helm OCI push doesn't natively re-tag. The
          # `oras` CLI ships on `ubuntu-latest` since the
          # November 2024 runner image; the guard below
          # surfaces a clear warning if a future runner image
          # rolls it back.
          if command -v oras >/dev/null 2>&1; then
            oras tag "${IMAGE}:${VERSION}" latest
          else
            echo "::warning::oras not available on this runner; :latest tag not updated. Add `uses: oras-project/setup-oras@v1` in a follow-up."
          fi

      - name: Create GitHub Release + tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          TGZ: ${{ steps.package.outputs.tgz }}
          IMAGE: ${{ steps.owner.outputs.image }}
          DIGEST: ${{ steps.push.outputs.digest }}
          IS_PRERELEASE: ${{ steps.version.outputs.is_prerelease }}
          SHA: ${{ github.sha }}
        run: |
          # `gh release create <tag>` creates the tag implicitly
          # when it doesn't exist — pointing it at the workflow's
          # checkout SHA via `--target`. This is the LAST step;
          # if anything earlier failed, no tag and no release
          # land. The pre-flight "tag does not exist" guard at
          # the top of the job ensures we never overwrite a tag
          # silently.
          # Heredoc is double-quoted by default so $VARS expand.
          # GitHub Actions expression syntax (the dollar +
          # double-brace form) is NOT used inside this run body
          # — all dynamic inputs come from the `env:` block
          # above, so no untrusted value reaches the heredoc.
          notes_file=$(mktemp)
          cat > "$notes_file" <<EOF
          ## platform-stack ${VERSION}

          AppRafter platform-stack umbrella Helm chart. CUE source
          in [platform-stack/cue/](https://github.com/${REPO}/tree/${TAG}/platform-stack/cue).

          ### Install via Argo CD (recommended)

          \`\`\`yaml
          apiVersion: argoproj.io/v1alpha1
          kind: Application
          metadata:
            name: platform
            namespace: argocd
          spec:
            source:
              repoURL: oci://${IMAGE}
              chart: platform-stack
              targetRevision: ${VERSION}
            destination: { server: https://kubernetes.default.svc, namespace: argocd }
          \`\`\`

          ### Install via plain Helm

          \`\`\`sh
          helm install platform oci://${IMAGE} --version ${VERSION}
          \`\`\`

          ### Verify the signature

          \`\`\`sh
          # OCI artifact (Argo CD path):
          cosign verify ${IMAGE}@${DIGEST} \\
              --certificate-identity-regexp "https://github.com/${REPO}/" \\
              --certificate-oidc-issuer "https://token.actions.githubusercontent.com"

          # .tgz attachment (plain Helm path):
          cosign verify-blob \\
              --certificate platform-stack-${VERSION}.tgz.pem \\
              --signature platform-stack-${VERSION}.tgz.sig \\
              --certificate-identity-regexp "https://github.com/${REPO}/" \\
              --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \\
              platform-stack-${VERSION}.tgz
          \`\`\`

          Compatibility class + operator pairing in
          [\`platform-stack/cue/compatibility.cue\`](https://github.com/${REPO}/blob/${TAG}/platform-stack/cue/compatibility.cue).
          EOF
          if [[ "$IS_PRERELEASE" == "true" ]]; then
            gh release create "$TAG" \
              "$TGZ" "$TGZ.sig" "$TGZ.pem" \
              --title "platform-stack ${VERSION}" \
              --notes-file "$notes_file" \
              --prerelease
          else
            gh release create "$TAG" \
              "$TGZ" "$TGZ.sig" "$TGZ.pem" \
              --title "platform-stack ${VERSION}" \
              --notes-file "$notes_file"
          fi
