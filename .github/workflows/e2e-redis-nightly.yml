# SPDX-License-Identifier: FSL-1.1-Apache-2.0
name: e2e-redis-nightly

# Standalone nightly k3d gate for the Phase-2.6 needs.redis ResourceClaim
# chain (e2e/needs-redis-walk.sh): generate -> schedule -> provision ->
# resume + DSN inject -> $N-ACL cross-DB isolation proof (NOPERM SELECT +
# MOVE/COPY/SWAPDB escape DENIED) -> scripting/client-init/restart-repin
# (EVAL confinement, ioredis/BullMQ client init, pod-restart ACL re-pin) ->
# persistent variant (separate PVC-backed pool instance, restart-durable
# data) -> delete + RetainedClaim snapshot -> force-GC -> FLUSHDB/DELUSER
# proof.
#
# Why a separate workflow (NOT folded into e2e-k3d.yml or e2e-pg-nightly):
#   - It boots a real Dragonfly pod (the shared in-cluster Redis-compatible
#     instance), so it is heavier than the gitops-walk gate -- keep it off
#     the per-push critical path.
#   - It is decoupled from the Hetzner-cost nightly.yml so the free-k3d
#     failure domain stays independent (no cloud spend, no secrets).
#
# Security note: no secrets are consumed here. Everything runs on a
# local k3d cluster; the only outbound traffic is public image /
# chart pulls. `permissions: contents: read` is the minimum. No
# `github.event.*` input is interpolated into any run: block.

on:
  schedule:
    # 06:00 UTC -- staggered after nightly.yml (04:00 UTC) and
    # e2e-pg-nightly.yml (05:00 UTC) so the nightly gates don't contend
    # for the runner pool.
    - cron: '0 6 * * *'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  e2e-redis-nightly:
    name: k3d e2e (needs.redis nightly)
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            cli/target
          key: ${{ runner.os }}-cargo-e2e-${{ hashFiles('cli/**/Cargo.lock', 'cli/**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-e2e-
            ${{ runner.os }}-cargo-

      - name: Install CUE
        uses: cue-lang/setup-cue@v1.0.1
        with:
          version: v0.10.0

      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'v1.31.0'

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.2

      - name: Install kind
        run: |
          curl -fsSL -o ./kind https://kind.sigs.k8s.io/dl/v0.24.0/kind-linux-amd64
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind
          kind version

      - name: Load iptables kernel modules for Cilium
        # Mirrors e2e-pg-nightly.yml: cluster-bootstrap skips Cilium on k3d
        # (APPRAFTER_BOOTSTRAP_SKIP_CILIUM=1 in lib.sh) so these are a
        # belt-and-braces no-op here, kept for parity in case a future
        # walk re-enables the eBPF datapath.
        run: |
          sudo modprobe -a \
            ip_tables iptable_mangle iptable_raw iptable_filter iptable_nat \
            ip6_tables ip6table_mangle ip6table_raw ip6table_filter ip6table_nat \
            nf_nat xt_socket || true
          lsmod | grep -E 'ip6?table|nf_nat|xt_socket' || true

      - name: Warm the CLI build cache
        working-directory: cli
        # The e2e script invokes the CLI via `cargo run` (lib.sh's
        # `apprafter()` shell function), so a debug build here warms the
        # cache for the timed script run below -- no PATH binary is used.
        run: cargo build --bin apprafter

      - name: Run the needs.redis k3d walk
        run: bash e2e/needs-redis-walk.sh
