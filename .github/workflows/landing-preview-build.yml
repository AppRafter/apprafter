name: landing-preview-build

# Triggered by Payload's notifyRebuild afterChange hook on every
# content-global save (see landing/cms/src/hooks/notifyRebuild.ts)
# via a GitHub `repository_dispatch` event of type
# `landing-content-changed`.
#
# Builds the static landing-web image with LANDING_USE_FALLBACK=0
# so the build fetches live content from cms.apprafter.dev, then
# pushes the PREVIEW stream:
#
#   ghcr.io/<owner-lc>/landing-web:preview
#   ghcr.io/<owner-lc>/landing-web:preview-<sha>
#
# Promotion to prod happens in a separate workflow
# (landing-promote-to-prod.yml) which retags :preview → :prod
# byte-for-byte via `docker buildx imagetools create` — there's
# no second build, so prod is guaranteed to match what the
# operator just inspected on the preview host.
#
# Concurrency: only the latest dispatch finishes. Multiple admin
# saves in a row → in-flight builds get cancelled and replaced by
# a single fresh build.

on:
  repository_dispatch:
    types: [landing-content-changed]
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

concurrency:
  group: landing-preview-build
  cancel-in-progress: true

jobs:
  build:
    name: build landing-web :preview (live CMS)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Compute lowercase image base
        id: image-base
        env:
          REPO_OWNER: ${{ github.repository_owner }}
        run: |
          owner_lc=$(echo "$REPO_OWNER" | tr '[:upper:]' '[:lower:]')
          echo "image=ghcr.io/${owner_lc}/landing-web" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push landing-web :preview
        uses: docker/build-push-action@v5
        with:
          context: landing
          file: landing/web/Dockerfile
          push: true
          tags: |
            ${{ steps.image-base.outputs.image }}:preview
            ${{ steps.image-base.outputs.image }}:preview-${{ github.sha }}
          # CONTENT_REV is unique per run so BuildKit always rebuilds the
          # `bun run build` layer against live CMS — the network fetch is
          # invisible to the layer cache, so without this a cached dist/
          # is reused and admin edits never reach the image (see
          # landing/web/Dockerfile).
          build-args: |
            LANDING_USE_FALLBACK=0
            LANDING_CMS_URL=https://cms.apprafter.dev
            PUBLIC_CMS_URL=https://cms.apprafter.dev
            CONTENT_REV=${{ github.run_id }}-${{ github.run_attempt }}
          platforms: linux/amd64
          # Share the cache scope with release-landing.yml's web job so the
          # install/deps layers are reused. The `bun run build` layer is
          # deliberately NOT reused here (CONTENT_REV differs from the
          # release build's stable default), so the fallback dist never
          # leaks into a preview image.
          cache-from: type=gha,scope=landing-web
          cache-to: type=gha,mode=max,scope=landing-web
