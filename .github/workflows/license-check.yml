# SPDX-License-Identifier: FSL-1.1-Apache-2.0
name: license-check

on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  spdx:
    name: SPDX headers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/check-spdx-headers.sh
