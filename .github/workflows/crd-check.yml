# SPDX-License-Identifier: FSL-1.1-Apache-2.0
name: crd-check

# Drift gate for the CUE->CRD codegen (ADR 0047): the committed operator
# chart crd-*.yaml must be byte-identical to what `crdgen` renders from the
# schemas/v1alpha1 CUE schemas. Runs under the repo flake (nix) so cue is
# the flake.lock-pinned version - the byte-compare needs ONE cue version
# across local + CI (ADR 0047 R4); the same flake shell provides cargo.
on:
  pull_request:
    paths:
      - 'schemas/v1alpha1/**'
      - 'operator/operator-core/**'
      - 'operator/crdgen/**'
      - 'operator/charts/apprafter-operator/templates/crd-*.yaml'
      - 'scripts/crd-check.sh'
      - 'flake.nix'
      - 'flake.lock'
      - '.github/workflows/crd-check.yml'
  push:
    branches: [master]
    paths:
      - 'schemas/v1alpha1/**'
      - 'operator/operator-core/**'
      - 'operator/crdgen/**'
      - 'operator/charts/apprafter-operator/templates/crd-*.yaml'
      - 'scripts/crd-check.sh'
      - 'flake.nix'
      - 'flake.lock'
      - '.github/workflows/crd-check.yml'

permissions:
  contents: read

jobs:
  crd-check:
    name: CRD codegen drift gate (CUE vs committed)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Pinned to a release's commit SHA, not @main: this action runs
      # third-party code inside the job, a branch ref re-fetches whatever
      # is on that branch at job start, and a tag can be re-pointed (see
      # scripts/check-workflows.sh). It matters here specifically — crd-check
      # is the ADR-0047 byte-identity gate, whose premise is that local and
      # CI evaluate the SAME cue. The pin bounds the ACTION only; upstream
      # installs the newest Determinate Nix either way. The cue version
      # itself is pinned by flake.lock, which is what actually protects
      # the byte comparison.
      - name: Install Nix (flake toolchain - cue + cargo)
        uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
      - name: crdgen check
        run: bash scripts/crd-check.sh
