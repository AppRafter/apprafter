# SPDX-License-Identifier: FSL-1.1-Apache-2.0
name: release-cli

# Builds the `apprafter` CLI binary for linux + macOS on every
# `v0.*` / `v1.*` tag, packages each into a tarball, and creates
# a GitHub Release with the tarballs as assets.
#
# The release is what `apprafter`'s built-in newer-version check
# polls (`commands::version_check` GETs
# `https://api.github.com/repos/<owner>/<repo>/releases/latest`).
# Without this workflow, the courtesy banner stays silent on
# every invocation — operators never learn a newer CLI exists.
#
# Security:
#
#   Every potentially-tainted GitHub Actions input
#   (`inputs.tag`, `github.ref_name`, the changelog section
#   extracted from the repo) flows through an `env:` binding
#   before reaching any shell `run:` step. No `${{ }}`
#   interpolation occurs inside `run:` body — eliminates the
#   action-injection class of risks documented at
#   https://github.blog/security/vulnerability-research/how-to-catch-github-actions-workflow-injections-before-attackers-do/.
#
#   The tag-glob trigger (`v0.*` / `v1.*`) further constrains
#   `github.ref_name` to a known-safe shape; the workflow only
#   fires on tag pushes whose name matches the version pattern.
#
# Tag scope policy:
#
#   - Every `v0.*` / `v1.*` tag triggers a build. Some tags
#     (landing-stream releases, chart-only releases) don't
#     actually change the CLI binary; the build still succeeds
#     and the artefacts are byte-equivalent to the previous
#     CLI-touching tag's. Cheaper than wiring tag-classification
#     logic into the workflow.
#
#   - The release notes are autogenerated from the changelog
#     section naming the tag: the root `CHANGELOG.md` that ATM
#     writes, falling back to the frozen pre-ATM archive
#     `docs/changelog/history.md` for tags cut before the
#     switch. This keeps the GitHub Releases UI in sync with the
#     monorepo changelog without a separate release-notes
#     maintenance burden. A tag with no section FAILS the job —
#     this workflow runs once per tag and never regenerates, so
#     a stub would be permanent.
#
# Cross-compile targets:
#
#   - `x86_64-unknown-linux-gnu` — the tier-1 substrate
#     (Hetzner CPX22). Native build on the `ubuntu-latest`
#     runner.
#   - `x86_64-apple-darwin` — Intel Macs. Built on
#     `macos-latest` (currently `macos-14`, ARM-based) via
#     Rust's standard Apple cross-compile.
#   - `aarch64-apple-darwin` — Apple Silicon Macs. Native on
#     `macos-latest`.
#
# Linux aarch64 (Hetzner CAX cloud servers) is deliberately
# absent for now — tier-1 ships on x86 only and adding cross-
# compile for Linux ARM requires `cross` or Docker QEMU, which
# is a separate complication. Phase 2+ wires it in alongside
# Infrastructure-side arch detection.

on:
  push:
    tags:
      - 'v0.*'
      - 'v1.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (e.g. v0.1.148). Must already exist.'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25

    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
          - target: x86_64-apple-darwin
            runner: macos-latest
          - target: aarch64-apple-darwin
            runner: macos-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # `cli-providers/build.rs` shells out to `cue export` at
      # compile time to extract `_loaderValues` + chart versions
      # from `platform-stack/cue/`. The runner doesn't ship `cue`
      # by default — without it the build script panics with
      # `neither cue nor nix run nixpkgs#cue is on PATH`. Use the
      # upstream action; v1.0.1 matches what lint.yml +
      # nightly.yml already pin so all CI workflows share one
      # cue version.
      - name: Install CUE
        uses: cue-lang/setup-cue@v1.0.1
        with:
          version: v0.10.0

      - name: Build CLI binary
        working-directory: cli
        env:
          TARGET: ${{ matrix.target }}
        run: cargo build --release --locked --target "$TARGET" -p apprafter

      - name: Strip binary
        env:
          TARGET: ${{ matrix.target }}
        run: |
          binary="cli/target/${TARGET}/release/apprafter"
          if [ "$RUNNER_OS" = "macOS" ]; then
            strip -x "$binary"
          else
            strip --strip-unneeded "$binary"
          fi

      - name: Verify binary matches tag version
        env:
          EXPECTED_TAG: ${{ inputs.tag || github.ref_name }}
          TARGET: ${{ matrix.target }}
        run: |
          # The CLI's `cli/Cargo.toml` `workspace.package.version`
          # must match the tag minus the leading `v` per the
          # CLAUDE.md versioning rule. A mismatch means the
          # commit that received the tag forgot to bump the
          # Cargo.toml version — the published binary would
          # report a stale `--version` string, which the
          # version_check banner relies on for comparison.
          # Fail loudly so the operator catches the drift
          # before publishing.
          expected="${EXPECTED_TAG#v}"
          actual=$(cli/target/"${TARGET}"/release/apprafter --version | awk '{print $2}')
          if [ "$expected" != "$actual" ]; then
            echo "::error::CLI --version output '$actual' does not match tag '$EXPECTED_TAG' (expected '$expected')"
            exit 1
          fi
          echo "Binary version $actual matches tag $EXPECTED_TAG"

      - name: Package tarball
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
          TARGET: ${{ matrix.target }}
        run: |
          stage=$(mktemp -d)
          cp "cli/target/${TARGET}/release/apprafter" "$stage/"
          cp README.md "$stage/" 2>/dev/null || true
          cp LICENSE "$stage/" 2>/dev/null || true
          archive="apprafter-${TAG}-${TARGET}.tar.gz"
          tar -czf "$archive" -C "$stage" .
          shasum -a 256 "$archive" > "${archive}.sha256"
          {
            echo "ARCHIVE=$archive"
            echo "CHECKSUM=${archive}.sha256"
          } >> "$GITHUB_ENV"

      - name: Upload archive artifact
        uses: actions/upload-artifact@v4
        with:
          name: apprafter-${{ matrix.target }}
          path: |
            ${{ env.ARCHIVE }}
            ${{ env.CHECKSUM }}
          retention-days: 7

  release:
    name: create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Extract changelog section for this tag
        id: changelog
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          # Pull the `## ` section naming this tag. The canonical file is
          # the root CHANGELOG.md that ATM's changelog sync writes; the
          # frozen pre-ATM archive (docs/changelog/history.md) is searched
          # only as a fallback, so a tag cut before the switch still finds
          # its notes.
          #
          # `TAG` reaches this script through `env:` above and is used only
          # as "$TAG" — no `${{ }}` interpolation occurs in this body, per
          # the injection policy in this file's header.
          #
          # The heading names the streams a release moved, which is this
          # repository's own long-standing convention and the reason a
          # plain tag search works at all:
          #
          #   ## cli v0.2.75 — …
          #   ## platform-stack 0.2.77 / cli v0.2.74 — …
          #
          # The CLI is written WITH its `v`, identically to the tag, so the
          # tag string IS the search key and no separate machine-readable
          # marker is needed. A CLI-only release simply carries no chart
          # number, because no chart was cut — the most common shape in
          # this repository's history, not an edge case.
          #
          # TWO DEFECTS ARE FIXED HERE, both found by reading rather than
          # by a failure. This step runs ONCE per tag and never regenerates
          # an older release, so anything it gets wrong is permanent:
          #
          #   1. The match was a SUBSTRING test (`index($0, tag)`), so tag
          #      `v0.2.5` matched inside `## cli v0.2.51 — …`. Verified
          #      reproducible. It stayed hidden only because the file is
          #      newest-first, so the intended section happened to come
          #      first anyway. The match is now anchored on both sides and
          #      the tag's dots are escaped so they cannot act as regex `.`.
          #
          #   2. An empty result fell back to a STUB body and exited 0 — a
          #      green run publishing a release that describes nothing,
          #      forever. A missing section is now a loud failure.
          #
          # Only the part of the heading BEFORE the dash is searched. The
          # version identifiers live in that prefix; everything after it is
          # prose, and prose mentions other versions — `## platform-stack
          # 0.2.67 / operator v0.2.48 — the runner fix reaches clusters
          # since v0.2.32` must not answer to tag v0.2.32, which has its
          # own section elsewhere or none at all. Verified against both
          # heading shapes, including the ATM form `## [0.2.79] - <date>`.
          for file in CHANGELOG.md docs/changelog/history.md; do
            [ -f "$file" ] || continue
            awk -v tag="$TAG" '
              BEGIN {
                # Escape the tag for use inside a regex: the dots in
                # v0.2.5 are metacharacters that would match any byte.
                gsub(/\./, "\\.", tag)
                re = "(^|[^0-9A-Za-z.])" tag "([^0-9A-Za-z.]|$)"
                capture = 0
              }
              /^## / {
                if (capture) exit
                head = $0
                sub(/ (—|-) .*$/, "", head)
                if (head ~ re) capture = 1
              }
              capture { print }
            ' "$file" > /tmp/release-notes.md
            [ -s /tmp/release-notes.md ] && break
          done
          if [ ! -s /tmp/release-notes.md ]; then
            echo "::error::No changelog section names ${TAG}." >&2
            echo "::error::Searched CHANGELOG.md then docs/changelog/history.md." >&2
            echo "::error::A release whose notes are missing is published that way" >&2
            echo "::error::permanently — this workflow runs once per tag and never" >&2
            echo "::error::regenerates. Add the section, delete the tag, re-tag." >&2
            exit 1
          fi
          {
            echo "body<<RELEASE_NOTES_EOF"
            cat /tmp/release-notes.md
            echo "RELEASE_NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release with assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.ref_name }}
          BODY: ${{ steps.changelog.outputs.body }}
        run: |
          # Flatten the per-target subdirectories `actions/
          # download-artifact@v4` produces into a single
          # `release-assets/` directory the `gh release` upload
          # step then consumes.
          mkdir -p release-assets
          find artifacts -type f \( -name '*.tar.gz' -o -name '*.sha256' \) \
            -exec cp -v {} release-assets/ \;
          # Recreate the release if it already exists (re-runs
          # via workflow_dispatch). `gh release create` errors
          # when the release already exists; delete + create
          # gets us a clean slate without --clobber quirks
          # across asset types.
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release delete "$TAG" --yes
          fi
          gh release create "$TAG" \
            --title "$TAG" \
            --notes "$BODY" \
            release-assets/*
