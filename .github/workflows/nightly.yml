# SPDX-License-Identifier: FSL-1.1-Apache-2.0
name: nightly

# Runs the full E2E smoke against real Hetzner Cloud. Required
# repository secrets (Settings → Secrets and variables → Actions):
#
#   HCLOUD_TOKEN              — Hetzner Cloud API token (Read+Write).
#   APPRAFTER_SSH_PUBLIC_KEY  — single-line OpenSSH public key.
#
# Without those secrets the smoke fails fast (exit 2) with a
# clear error — the workflow stays safe to merge before
# credentials are wired.
#
# Cost: each successful run provisions one Hetzner cpx22 (shared
# vCPU, mass availability) for ~10 minutes (plus tear-down) —
# single-digit cents per night. The `e2e/mvp.sh` `EXIT` trap
# auto-destroys on failure, so a crashed run won't leave a server
# idling. Override the type via the `APPRAFTER_E2E_SERVER_TYPE`
# env var.
#
# Security note: this workflow only consumes secrets via the
# `env:` block (the safe pattern). It does NOT inject any
# untrusted `github.event.*` content into shell commands, so the
# action-injection class of risks does not apply.

on:
  schedule:
    # 04:00 UTC nightly. Off-peak for both EU + US Pacific.
    - cron: '0 4 * * *'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  e2e:
    name: e2e/mvp.sh
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: "1.98"

      - name: Cache cargo build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            cli/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('cli/**/Cargo.lock', 'cli/**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install kubectl
        uses: azure/setup-kubectl@829323503d1be3d00ca8346e5391ca0b07a9ab0d # v5.1.0
        with:
          version: 'v1.37.0'

      - name: Install CUE
        uses: cue-lang/setup-cue@b0e30e540a2dae47304ebf16586a5b2db023b61c # v2.0.0
        with:
          version: v0.17.1

      - name: Write the SSH private key (kubeconfig SSH-in)
        env:
          APPRAFTER_SSH_PRIVATE_KEY: ${{ secrets.APPRAFTER_SSH_PRIVATE_KEY }}
        run: |
          # The mvp walk provisions the Hetzner server with the PUBLIC key, then
          # SSHes in to fetch the k3s kubeconfig using the DEFAULT identity
          # (~/.ssh/id_ed25519). The runner has no private key, so materialise
          # the matching one from a secret. ADD `APPRAFTER_SSH_PRIVATE_KEY` (the
          # private half of APPRAFTER_SSH_PUBLIC_KEY) to the repo secrets.
          if [ -z "${APPRAFTER_SSH_PRIVATE_KEY:-}" ]; then
            echo "::error::APPRAFTER_SSH_PRIVATE_KEY secret is not set — the mvp walk needs the private half of APPRAFTER_SSH_PUBLIC_KEY to SSH in for the kubeconfig." >&2
            exit 1
          fi
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$APPRAFTER_SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

      - name: Run E2E MVP smoke
        env:
          HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
          APPRAFTER_SSH_PUBLIC_KEY: ${{ secrets.APPRAFTER_SSH_PUBLIC_KEY }}
          APPRAFTER_E2E_REGION: nbg1
        run: |
          ./e2e/mvp.sh
