# SPDX-License-Identifier: FSL-1.1-Apache-2.0
name: docs

# Documentation gate. Runs under the repo flake (nix) so mkdocs, the
# material theme and the plugins are the flake.lock-pinned versions —
# the generated-reference byte-compare needs ONE toolchain across
# local and CI. Before this workflow existed a docs-only PR ran zero
# jobs (lint.yml's paths-filter had no docs entry).
on:
  pull_request:
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      # Wider than cli.rs: the clap tree pulls in ValueEnums defined
      # under commands/ (e.g. app::CoverageGate), whose variants
      # render in --help and therefore in the generated reference.
      - 'cli/platform-cli/src/**'
      - 'cli/docsgen/**'
      # commands.json embeds `cli_version`, so a release bump is a
      # reference change: without this a bumped-but-not-regenerated
      # tree lands on master and fails the NEXT contributor's
      # unrelated docs PR.
      - 'cli/Cargo.toml'
      - 'scripts/docs-check.sh'
      - 'flake.nix'
      - 'flake.lock'
      - '.github/workflows/docs.yml'
  push:
    branches: [master]
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      # Wider than cli.rs: the clap tree pulls in ValueEnums defined
      # under commands/ (e.g. app::CoverageGate), whose variants
      # render in --help and therefore in the generated reference.
      - 'cli/platform-cli/src/**'
      - 'cli/docsgen/**'
      # commands.json embeds `cli_version`, so a release bump is a
      # reference change: without this a bumped-but-not-regenerated
      # tree lands on master and fails the NEXT contributor's
      # unrelated docs PR.
      - 'cli/Cargo.toml'
      - 'scripts/docs-check.sh'
      - 'flake.nix'
      - 'flake.lock'
      - '.github/workflows/docs.yml'

permissions:
  contents: read

jobs:
  docs-check:
    name: docs gate (strict build + reference drift)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install Nix (flake toolchain — mkdocs + cargo)
        uses: DeterminateSystems/nix-installer-action@main
      # `docsgen check` links the whole CLI (459 crates) to read its
      # clap tree, so an uncached docs-only PR spent minutes compiling
      # dependencies that had not changed. Keyed on the lockfile (it
      # decides the dependency graph) plus flake.lock: the compiler
      # doing the work comes from the flake, not from the runner's
      # preinstalled toolchain that rust-cache reads for its own key.
      - name: Cache cargo build (docsgen links the CLI)
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: cli
          key: docsgen-${{ hashFiles('cli/Cargo.lock', 'flake.lock') }}
      - name: docs-check
        run: bash scripts/docs-check.sh
