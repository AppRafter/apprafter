name: docs

# Documentation gate. Runs under the repo flake (nix) so mkdocs, the
# material theme and the plugins are the flake.lock-pinned versions —
# the generated-reference byte-compare needs ONE toolchain across
# local and CI. Before this workflow existed a docs-only PR ran zero
# jobs (lint.yml's paths-filter had no docs entry).
on:
  pull_request:
    paths:
      - 'docs/**'
      # Redundant under `docs/**` above, and listed for the same reason
      # the census is: the two mkdocs build hooks are not pages, they are
      # the machinery that renders and exports EVERY page. A one-line
      # change in either alters the whole site — CUE fences stop being
      # highlighted, or llms.txt/llms-full.txt/the markdown twins stop
      # being written, and the mkdocs build stays green through both.
      # Spelling the path out means a future narrowing of `docs/**` (to
      # `docs/**/*.md`, say) cannot silently drop the trigger for the one
      # change class that has no page in its diff.
      - 'docs/hooks/**'
      # The corpus is `docs/**` PLUS the root README: `scan::in_scope`
      # lists `git ls-files -- docs README.md`, so the README is one of
      # the pages the census counts. No `docs/` pattern reaches it,
      # so without this entry a commit that rewrote or deleted it moved
      # the census and ran this job zero times — landing the
      # finding on master, to be discovered by the NEXT contributor's
      # unrelated docs pull request. Same failure as the
      # `cli/Cargo.toml` entry below, from the other direction.
      - 'README.md'
      # Redundant under `docs/**` above, and listed anyway: the gate
      # compares this committed census by value, so it is an INPUT to
      # the job and not just another page. Spelling it out means a
      # future narrowing of `docs/**` (to `docs/**/*.md`, say) cannot
      # silently drop the one trigger that notices a deleted page.
      # `lefthook.yml` needs the entry for real — its glob is `.md`
      # only — and that comment records why the file is never
      # regenerated by a hook.
      - 'docs/measurements/docs-health.json'
      - 'mkdocs.yml'
      # Wider than cli.rs: the clap tree pulls in ValueEnums defined
      # under commands/ (e.g. app::CoverageGate), whose variants
      # render in --help and therefore in the generated reference.
      - 'cli/platform-cli/src/**'
      - 'cli/docsgen/**'
      # commands.json embeds `cli_version`, so a release bump is a
      # reference change: without this a bumped-but-not-regenerated
      # tree lands on master and fails the NEXT contributor's
      # unrelated docs PR.
      - 'cli/Cargo.toml'
      # The gate's schema-identifier check resolves every documented
      # field path against these two, so renaming a schema field is a
      # documentation change even when the pull request touches no page
      # and no CLI source. Without them the job never runs on that pull
      # request and the finding lands on master, to be discovered by the
      # NEXT contributor's unrelated docs PR — exactly the failure the
      # `cli/Cargo.toml` entry above exists to prevent.
      - 'schemas/v1alpha1/**'
      - 'operator/charts/apprafter-operator/templates/crd-*.yaml'
      - 'scripts/docs-check.sh'
      # Pass 2 of that script, in its own file — see its docstring for why.
      - 'scripts/docs-artefacts-check.py'
      - 'flake.nix'
      - 'flake.lock'
      - '.github/workflows/docs.yml'
  push:
    branches: [master]
    paths:
      - 'docs/**'
      # See the identical entry on the pull_request trigger above.
      - 'docs/hooks/**'
      # See the identical entry on the pull_request trigger above.
      - 'README.md'
      # See the identical entry on the pull_request trigger above.
      - 'docs/measurements/docs-health.json'
      - 'mkdocs.yml'
      # Wider than cli.rs: the clap tree pulls in ValueEnums defined
      # under commands/ (e.g. app::CoverageGate), whose variants
      # render in --help and therefore in the generated reference.
      - 'cli/platform-cli/src/**'
      - 'cli/docsgen/**'
      # commands.json embeds `cli_version`, so a release bump is a
      # reference change: without this a bumped-but-not-regenerated
      # tree lands on master and fails the NEXT contributor's
      # unrelated docs PR.
      - 'cli/Cargo.toml'
      # See the identical entry on the pull_request trigger above.
      - 'schemas/v1alpha1/**'
      - 'operator/charts/apprafter-operator/templates/crd-*.yaml'
      - 'scripts/docs-check.sh'
      # Pass 2 of that script, in its own file — see its docstring for why.
      - 'scripts/docs-artefacts-check.py'
      - 'flake.nix'
      - 'flake.lock'
      - '.github/workflows/docs.yml'

permissions:
  contents: read

jobs:
  docs-check:
    name: docs gate (strict build + reference drift)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          # `docsgen gate` ages every documentation exemption by
          # resolving its `since=vX.Y.Z` to that tag's commit date, and
          # an exemption it cannot age is VOID (cli/docsgen/src/gate.rs).
          # The default `fetch-depth: 1` fetches no tags at all, so
          # without this every exemption would go void here while
          # expiring correctly on a developer's machine — the gate
          # would be loudest in the one place nobody wrote it for.
          fetch-depth: 0
      - name: Install Nix (flake toolchain — mkdocs + cargo)
        uses: DeterminateSystems/nix-installer-action@main
      # `docsgen check` links the whole CLI to read its clap tree —
      # hundreds of crates, per `cargo tree -p docsgen` — so an uncached
      # docs-only PR spent minutes compiling dependencies that had not
      # changed. Keyed on the lockfile (it
      # decides the dependency graph) plus flake.lock: the compiler
      # doing the work comes from the flake, not from the runner's
      # preinstalled toolchain that rust-cache reads for its own key.
      - name: Cache cargo build (docsgen links the CLI)
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: cli
          key: docsgen-${{ hashFiles('cli/Cargo.lock', 'flake.lock') }}
      - name: docs-check
        run: bash scripts/docs-check.sh
