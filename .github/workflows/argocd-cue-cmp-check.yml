# SPDX-License-Identifier: FSL-1.1-Apache-2.0
name: argocd-cue-cmp-check

# PR + push-to-master gate for `argocd-cue-cmp/**`. Three
# layers, mirroring the platform-stack-check pattern:
#
#   1. version.cue sanity: reads bare semver via
#      `cue export -e version --out text`, validates format.
#   2. Image smoke build: `docker build` succeeds against
#      the Dockerfile.
#   3. Drift detection: if `argocd-cue-cmp/v<version>` is
#      already a tag on origin and any file under
#      `argocd-cue-cmp/` differs from that tag, fail.
#      Forces the maintainer to bump version.cue or revert.
#
# The publish workflow's `should_publish` gate silently
# no-ops on non-bump pushes; this check turns that into a
# loud red CI status so accidental drift can't slip past.

on:
  pull_request:
    paths:
      - 'argocd-cue-cmp/**'
      - '.github/workflows/argocd-cue-cmp-check.yml'
      - '.github/workflows/argocd-cue-cmp-publish.yml'
  push:
    branches: [master]
    paths:
      - 'argocd-cue-cmp/**'
      - '.github/workflows/argocd-cue-cmp-check.yml'
      - '.github/workflows/argocd-cue-cmp-publish.yml'

permissions:
  contents: read

jobs:
  check:
    name: version.cue + dockerfile smoke + drift
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: cue-lang/setup-cue@v1.0.1
        with:
          version: v0.10.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: version.cue sanity
        id: version
        run: |
          version=$(cue export -e version --out text ./argocd-cue-cmp/...)
          if [[ -z "${version:-}" ]]; then
            echo "::error::failed to extract version from argocd-cue-cmp/version.cue"
            exit 1
          fi
          if ! echo "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::argocd-cue-cmp/version.cue '${version}' is not semver"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=argocd-cue-cmp/v$version" >> "$GITHUB_OUTPUT"

      - name: Image smoke build (no push)
        uses: docker/build-push-action@v5
        with:
          context: argocd-cue-cmp
          file: argocd-cue-cmp/Dockerfile
          push: false
          load: true
          tags: argocd-cue-cmp:check
          build-args: |
            IMAGE_VERSION=${{ steps.version.outputs.version }}
            IMAGE_REVISION=${{ github.sha }}
          platforms: linux/amd64
          cache-from: type=gha,scope=argocd-cue-cmp
          cache-to: type=gha,mode=max,scope=argocd-cue-cmp

      - name: Discover script regression test
        # Walk-fix #10 (chart 0.1.46, cue-cmp v0.1.5)
        # discipline — extracts the `discover.find.command`
        # shell snippet from plugin.yaml, runs it against
        # fixture repos, asserts stdout non-emptiness matches
        # the expected match/no-match signal. Catches both
        # "stdout silently empty" regressions (the v0.1.4 →
        # v0.1.5 bug) and "matches too eagerly" regressions
        # (plain CUE repos getting intercepted).
        run: bash argocd-cue-cmp/test-discover.sh

      - name: Entrypoint smoke (cue export of a tiny fixture)
        run: |
          mkdir -p /tmp/cue-smoke/apprafter
          cat > /tmp/cue-smoke/apprafter/Application.cue <<'EOF'
          package app
          apiVersion: "apprafter.io/v1alpha1"
          kind:       "Application"
          metadata: {
              name:      "hello"
              namespace: "default"
          }
          spec: image: "nginxdemos/hello:plain-text"
          EOF
          out=$(docker run --rm \
              -v /tmp/cue-smoke:/repo \
              -w /repo \
              --entrypoint /usr/local/bin/entrypoint.sh \
              argocd-cue-cmp:check)
          if ! echo "$out" | grep -q "kind: Application"; then
            echo "::error::entrypoint did not render Application kind"
            echo "--- captured output ---"
            echo "$out"
            exit 1
          fi
          echo "::notice::entrypoint smoke: rendered Application correctly"

      - name: Drift detection (image source changed without version.cue bump)
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if ! git ls-remote --tags --exit-code origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "::notice::${TAG} not on origin yet — version.cue is in-flight, drift check no-op."
            exit 0
          fi
          # Pathspec covers ONLY files that affect the built
          # image — Dockerfile + entrypoint.sh + plugin.yaml.
          # `version.cue` is metadata (the version itself, not
          # image source); editing it IS the version bump, so
          # the detect job's `cue export -e version` + tag-
          # exists check handles bump-detection separately.
          # README is documentation. Including version.cue here
          # produced a false positive after the B.1.71b refactor
          # that replaced plain-text `VERSION` with `version.cue`
          # (v0.1.1 tag's snapshot didn't have version.cue, so
          # the diff registered it as "added file" and incorrectly
          # demanded a version bump).
          if git diff --quiet "${TAG}" HEAD -- \
              'argocd-cue-cmp/Dockerfile' \
              'argocd-cue-cmp/plugin.yaml' \
              'argocd-cue-cmp/entrypoint.sh'; then
            echo "::notice::No drift vs ${TAG} — image source unchanged."
            exit 0
          fi
          echo "::error::Image source under argocd-cue-cmp/ changed since ${TAG} was published, but version.cue is still ${VERSION}."
          echo "::error::Either bump argocd-cue-cmp/version.cue, or revert the source changes."
          echo ""
          echo "--- Diff vs ${TAG} (truncated to 80 lines) ---"
          git diff "${TAG}" HEAD -- \
            'argocd-cue-cmp/Dockerfile' \
            'argocd-cue-cmp/plugin.yaml' \
            'argocd-cue-cmp/entrypoint.sh' \
            | head -80 || true
          exit 1
