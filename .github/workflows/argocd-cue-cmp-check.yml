# SPDX-License-Identifier: FSL-1.1-Apache-2.0
name: argocd-cue-cmp-check

# PR + push-to-master gate for `argocd-cue-cmp/**`. Two
# layers:
#
#   1. version.cue sanity: reads bare semver via
#      `cue export -e version --out text`, validates format.
#   2. Image smoke build: `docker build` succeeds against
#      the Dockerfile, plus the discover/inject/entrypoint
#      regression tests against the built image.
#
# Drift detection — image source changed since
# `argocd-cue-cmp/v<version>` was published, without a
# version.cue bump — used to be a third, inline step here.
# It is `scripts/check-argocd-cue-cmp-drift.sh` in lint.yml's
# `version-guards` job now (WI-373), with the other version
# guards: one implementation instead of an inline copy and a
# local mirror, run on every pull request and push, and
# failing when origin cannot say whether the tag is published
# instead of reading that as "in flight". The publish
# workflow's `should_publish` gate silently no-ops on
# non-bump pushes; that job is what turns drift into a red
# CI status.

on:
  pull_request:
    paths:
      - 'argocd-cue-cmp/**'
      # 2.12f: the image bundles schemas/v1alpha1 (ADR 0046).
      - 'schemas/v1alpha1/**'
      - '.github/workflows/argocd-cue-cmp-check.yml'
      - '.github/workflows/argocd-cue-cmp-publish.yml'
  push:
    branches: [master]
    paths:
      - 'argocd-cue-cmp/**'
      - 'schemas/v1alpha1/**'
      - '.github/workflows/argocd-cue-cmp-check.yml'
      - '.github/workflows/argocd-cue-cmp-publish.yml'

permissions:
  contents: read

jobs:
  check:
    name: version.cue + dockerfile smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cue-lang/setup-cue@b0e30e540a2dae47304ebf16586a5b2db023b61c # v2.0.0
        with:
          version: v0.17.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: version.cue sanity
        id: version
        run: |
          version=$(cue export -e version --out text ./argocd-cue-cmp/...)
          if [[ -z "${version:-}" ]]; then
            echo "::error::failed to extract version from argocd-cue-cmp/version.cue"
            exit 1
          fi
          if ! echo "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::argocd-cue-cmp/version.cue '${version}' is not semver"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Image smoke build (no push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          # Repo-root context (2.12f): the image bundles the AppRafter
          # CUE schema (schemas/v1alpha1) alongside the sidecar files.
          context: .
          file: argocd-cue-cmp/Dockerfile
          push: false
          load: true
          tags: argocd-cue-cmp:check
          build-args: |
            IMAGE_VERSION=${{ steps.version.outputs.version }}
            IMAGE_REVISION=${{ github.sha }}
          platforms: linux/amd64
          cache-from: type=gha,scope=argocd-cue-cmp
          cache-to: type=gha,mode=max,scope=argocd-cue-cmp

      - name: Discover script regression test
        # Walk-fix #10 (chart 0.1.46, cue-cmp v0.1.5)
        # discipline — extracts the `discover.find.command`
        # shell snippet from plugin.yaml, runs it against
        # fixture repos, asserts stdout non-emptiness matches
        # the expected match/no-match signal. Catches both
        # "stdout silently empty" regressions (the v0.1.4 →
        # v0.1.5 bug) and "matches too eagerly" regressions
        # (plain CUE repos getting intercepted).
        run: bash argocd-cue-cmp/test-discover.sh

      - name: Inject script regression test
        # 2.9 (ADR 0044) — asserts entrypoint.sh injects
        # `spec.environment` + the `apprafter.io/environment` label
        # from the APPRAFTER_APP_ENV plugin env (Style A single-doc
        # + Style B multi-doc), and emits the manifest UNCHANGED when
        # the var is unset. Same stdout-only discipline as discover:
        # Argo reads stdout, so a botched injection that pollutes or
        # empties stdout must fail here, not in a live sync.
        run: bash argocd-cue-cmp/test-inject.sh

      - name: Entrypoint smoke (cue export of a tiny fixture)
        run: |
          mkdir -p /tmp/cue-smoke/apprafter
          cat > /tmp/cue-smoke/apprafter/Application.cue <<'EOF'
          package app
          apiVersion: "apprafter.io/v1alpha1"
          kind:       "Application"
          metadata: {
              name:      "hello"
              namespace: "default"
          }
          spec: image: "nginxdemos/hello:plain-text"
          EOF
          # 2.12f (ADR 0046): the entrypoint now WRITES into the package
          # dir — cue.mod/ + the generated apprafter_claim_gen.cue sibling
          # (schema + claim binding injection). Argo CD's real CMP hands
          # the plugin (uid 999) a writable repo copy; this bind-mounted
          # fixture is root-owned, so make it writable to match — else the
          # render dies with "mkdir: .../cue.mod: Permission denied".
          chmod -R 0777 /tmp/cue-smoke
          out=$(docker run --rm \
              -v /tmp/cue-smoke:/repo \
              -w /repo \
              --entrypoint /usr/local/bin/entrypoint.sh \
              argocd-cue-cmp:check)
          if ! echo "$out" | grep -q "kind: Application"; then
            echo "::error::entrypoint did not render Application kind"
            echo "--- captured output ---"
            echo "$out"
            exit 1
          fi
          echo "::notice::entrypoint smoke: rendered Application correctly"

      - name: Entrypoint smoke — vendored cue.mod from parent dir (walk-fix #11)
        # Reproduces the `apprafter app scaffold` layout: an
        # `apprafter/` directory carrying its OWN `cue.mod/`
        # (vendored AppRafter schemas), with a typed manifest
        # that `import`s `apprafter.io/schemas/v1alpha1`. The
        # entrypoint runs with cwd = the PARENT (as Argo CD
        # does when `spec.source.path` is the repo root), and
        # must cd into `apprafter/` so `cue export` crosses the
        # nested module boundary. Before walk-fix #11 this
        # failed with `cue: "./..." matched no packages`.
        run: |
          root=/tmp/cue-mod-smoke
          pkg="$root/apprafter/cue.mod/pkg/apprafter.io/schemas/v1alpha1"
          mkdir -p "$pkg"
          # Vendor the real schemas (exactly what scaffold copies).
          cp schemas/v1alpha1/types.cue "$pkg/types.cue"
          cp schemas/v1alpha1/application.cue "$pkg/application.cue"
          cat > "$root/apprafter/cue.mod/module.cue" <<'EOF'
          module: "apprafter.io/local-app"

          language: {
          	version: "v0.10.0"
          }
          EOF
          cat > "$root/apprafter/Application.cue" <<'EOF'
          package apprafter

          import v1alpha1 "apprafter.io/schemas/v1alpha1"

          landing: v1alpha1.#Application & {
          	metadata: {
          		name:      "landing"
          		namespace: "apprafter"
          	}
          	spec: base: {
          		image: "ghcr.io/procvue/landing:latest"
          		expose: port: 8080
          	}
          }
          EOF
          # Same writability requirement as the first smoke: uid 999 must
          # write apprafter_claim_gen.cue and inject-wins into cue.mod/pkg.
          chmod -R 0777 "$root"
          out=$(docker run --rm \
              -v "$root":/repo \
              -w /repo \
              --entrypoint /usr/local/bin/entrypoint.sh \
              argocd-cue-cmp:check)
          if ! echo "$out" | grep -q "kind: Application"; then
            echo "::error::entrypoint did not render typed manifest from nested cue.mod"
            echo "--- captured output ---"
            echo "$out"
            exit 1
          fi
          if ! echo "$out" | grep -q "ghcr.io/procvue/landing:latest"; then
            echo "::error::entrypoint output missing the expected image ref"
            echo "$out"
            exit 1
          fi
          echo "::notice::entrypoint smoke: vendored cue.mod from parent dir rendered correctly"
