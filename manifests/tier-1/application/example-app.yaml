# SPDX-License-Identifier: MIT
# Minimal example of `kind: Application` for the v1alpha1 CRD —
# used as a `kubectl apply` smoke-test starting point. No operator
# reconciles this in v0.1.22; field-level validation comes from the
# CRD's OpenAPI v3 schema. Admission-webhook validation lands in
# v0.1.23.
apiVersion: apprafter.io/v1alpha1
kind: Application
metadata:
  name: parser
  namespace: default
  labels:
    apprafter: "true"
spec:
  base:
    image: nginxdemos/hello:plain-text
    replicas: 1
    expose:
      port: 80
      network: internal
    env:
      LOG_LEVEL: info
  environments:
    prod:
      replicas: 3
