# SPDX-License-Identifier: FSL-1.1-Apache-2.0
#
# cargo-deny policy, shared by all three Cargo workspaces (`cli/`, `operator/`
# and `desktop/` are separate workspaces with no top-level Cargo.toml, so
# `scripts/cargo-deny.sh` runs cargo-deny once per workspace against THIS file).
# An ignore that only one workspace needs makes the other runs warn "advisory
# was not encountered"; that warning is expected.
#
# ## Why this file exists
#
# Until 2026-09 there was no advisory tooling here at all. The version watcher
# (`scripts/upstream-versions.py`) asks "are we behind the newest release?",
# which cannot see the two states that actually hurt:
#
#   * a crate that is ABANDONED sits on its own final release forever, so it is
#     never "behind" — `oci-distribution` reported as perfectly current for
#     eighteen months while the project had been renamed to `oci-client`;
#   * a crate with an unfixable advisory is not behind either.
#
# So the report made a dead dependency look healthier than a maintained one
# that ships often. This file asks the other two questions: is it alive, and is
# it known-vulnerable.
#
# ## The rule for `ignore`
#
# Every entry below is a REVIEWED decision with its reasoning inline, and the
# value is exactly that: without this file the same advisories were simply
# silent. An ignore with no `reason` is not acceptable here — if it cannot be
# justified in a sentence, it should not be ignored.
#
# When an ignored entry names a work item that clears it, delete the entry in
# the same change that closes the item. `unmaintained` is set to `all` rather
# than `workspace` on purpose: three of the four unmaintained crates below are
# transitive, and transitive is where this class hides.

[advisories]
version = 2
# `all` includes transitive dependencies. The narrower `workspace` setting
# would have reported NONE of the four unmaintained crates found on
# 2026-09-22 (rustls-pemfile, backoff, derivative, instant), because every one
# of them arrived through kube 0.95. The kube 4.2 bump (WI-357) cleared all four
# and their ignore entries went with it.
unmaintained = "all"
yanked = "deny"

ignore = [
    { id = "RUSTSEC-2023-0071", reason = """
The Marvin timing side-channel in the `rsa` crate. NOT REACHABLE HERE, and
no published version fixes it — 0.9.10 is the newest stable and the 0.10 RC
line does not address it either (RustCrypto/RSA#626 is still open, and the
advisory's own `patched` list is empty).

Marvin attacks PRIVATE-KEY decryption. This repo performs none in production.
The only production `RsaPrivateKey` is cli/cli-providers/src/cert.rs:67, which
calls `to_public_key()` and compares it against the certificate's key — no
decrypt, no sign. Every `.decrypt()` in the tree is inside a `#[cfg(test)]`
module. The production RSA operation is `RsaPublicKey::encrypt(Oaep)` in
cli/backup-core/src/sealing.rs, which is public-key only.

The algorithm is not ours to change: RSA-OAEP is in the type signature of
sealed-secrets' own `Unseal(codecs, privKeys map[string]*rsa.PrivateKey)`, and
the SealedSecret object carries no algorithm identifier or format version.

RE-EXAMINE THIS if a private-key decrypt or sign ever enters a production path.
That is the condition that makes this ignore wrong, not a version bump.
""" },
    # Desktop only, Linux only, build time only: tauri 2.12 -> tao/wry/muda/webkit2gtk
    # -> gtk 0.18 -> glib-macros 0.18 and gtk3-macros 0.18 -> proc-macro-error 1.0.4.
    # A proc-macro: it runs inside rustc and is not in the shipped binary. Unfixable
    # on GTK3: glib-macros dropped it in 0.19, but the archived GTK3 bindings (gtk,
    # gtk3-macros) end at 0.18 on glib 0.18; Tauri's move to GTK4 is its 3.0
    # milestone. Not reachable from cli/ or operator/. Delete with the GTK4 move.
    { id = "RUSTSEC-2024-0370", reason = "proc-macro-error via tauri -> gtk 0.18 -> glib-macros/gtk3-macros 0.18 on Linux (build-time proc-macro)" },
    # All three workspaces: serde_yaml 0.9.34+deprecated -> unsafe-libyaml 0.2.11 (cli-core,
    # platform-cli, operator/crdgen, operator-controllers/platform-stack; the desktop through
    # cli-core). An UNMAINTAINED notice, not a vulnerability: no advisory names a flaw, and no
    # maintained release exists to move to. The YAML parsed is the user's own target store, the
    # repo's manifests and CUE output. WI-460 moves every workspace off serde_yaml; delete this
    # entry in that change.
    { id = "RUSTSEC-2024-0449", reason = "unsafe-libyaml (via serde_yaml) unmaintained; WI-460 moves off serde_yaml" },
    # Desktop only, Linux only: zbus 5.19 -> zvariant 5.15, zbus_names 4.3, zvariant_derive 5.15.
    # UNMAINTAINED notices, not vulnerabilities, all three from 2026-10-16 with an empty patched
    # list: zbus 6.0.0 (MSRV 1.89) absorbed the crates as zbus::wire, zbus::names and its own
    # derives, and each advisory names zbus 6 as the move. No dependent here can make it yet: the
    # newest release of each still requires zbus ^5 — zbus_polkit 5.1.0 (its default branch is on
    # zbus 6, unreleased), tauri-plugin-opener 2.7.2 and tauri-plugin-single-instance 2.5.4 (their
    # 3.0 alphas too). Our own direct zbus cannot go first: os-auth hands its connection to
    # zbus_polkit, and src-tauri's single_instance.rs must parse the session bus address with the
    # plugin's zbus. Moving them alone would add a second zbus major and keep all three crates in
    # the lock. WI-544: delete these three entries in the change that takes zbus 6 everywhere.
    { id = "RUSTSEC-2026-0370", reason = "zvariant unmaintained (merged into zbus 6 as zbus::wire); zbus_polkit and the Tauri plugins still require zbus 5; WI-544" },
    { id = "RUSTSEC-2026-0371", reason = "zbus_names unmaintained (merged into zbus 6 as zbus::names); zbus_polkit and the Tauri plugins still require zbus 5; WI-544" },
    { id = "RUSTSEC-2026-0372", reason = "zvariant_derive unmaintained (derives moved into zbus 6); zbus_polkit and the Tauri plugins still require zbus 5; WI-544" },
    # cli and desktop (the desktop through apprafter-core and cli-core), build time only: age
    # 0.12.1 -> i18n-embed-fl 0.10.1, and i18n-embed 0.16 -> i18n-embed-impl 0.8.4, both
    # proc-macros -> i18n-config 0.4.8 -> basic-toml 0.1.10. It parses age's own i18n.toml inside
    # rustc while the `fl!` macros expand, and it is in no shipped binary (`cargo tree -e
    # no-proc-macro` cannot find it). An UNMAINTAINED notice of 2026-09-26 with an empty patched
    # list, not a vulnerability; the advisory suggests `toml`. No release moves it yet. age 0.12.1
    # (2026-07-14) is the newest, and it requires i18n-embed-fl ^0.10 with no feature to turn it
    # off: ours are already `default-features = false` + `armor`, and str4d/rage#422 (i18n behind
    # a feature) is still open. Both i18n-embed-fl 0.10 releases require i18n-config ^0.4.7, and
    # 0.4.7 and 0.4.8 (2025-07-09, the newest) both require basic-toml. cargo-i18n's main branch
    # took `toml` instead (kellpossible/cargo-i18n#176, merged 2026-09-26), with no release yet.
    # WI-546: delete this entry in the change that takes a released i18n-config on `toml`. A 0.4.x
    # patch is a `cargo update`; a new minor needs an age release on it, and age is the vault's
    # crypto, so that change re-checks the vault and age vectors byte for byte.
    { id = "RUSTSEC-2026-0374", reason = "basic-toml unmaintained; build time only, through age's i18n proc-macros (i18n-embed-fl, i18n-embed-impl -> i18n-config 0.4.8); cargo-i18n's move to toml is unreleased; WI-546" },
]

[bans]
# Duplicate versions are reported, not fatal. They are usually somebody else's
# pin rather than a defect of ours — e.g. sha2 0.10 arriving through
# async-nats -> nkeys -> ed25519-dalek while our own direct dependencies are on
# 0.11, or rand 0.9 through kube-client's tungstenite beside the held rand 0.8
# in cli/backup-core. Worth seeing; not worth blocking on.
multiple-versions = "warn"
wildcards = "deny"
# The workspace's own crates depend on each other by `path`, which cargo-deny
# counts as a wildcard. That is the normal shape of a multi-crate workspace,
# not a dependency we failed to pin — the check is here for wildcards on
# THIRD-PARTY crates, which is where an unpinned range is a real hazard.
allow-wildcard-paths = true

[licenses]
# Deliberately NOT a policy yet. A license allow-list is its own decision with
# its own review, and asserting one here as a side effect of adding advisory
# scanning would be the wrong way to make it. `version = 2` means unlisted
# licenses are denied, so this list is the current, observed set rather than an
# endorsement — extend it consciously.
version = 2
# Our own crates declare `license = "FSL-1.1-Apache-2.0"` (CLAUDE.md, ADR 0032),
# which is a real licence but not an SPDX identifier, so cargo-deny reads them
# as unlicensed. They are workspace members and are not published to crates.io,
# so the licence question this section exists to answer — "what are we
# redistributing?" — does not apply to them. SPDX conformance of our OWN
# headers is `scripts/check-spdx-headers.sh`'s job, and it already runs.
private = { ignore = true }
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    # Community Data License Agreement, Permissive 2.0 — the licence on
    # `webpki-roots`, which is Mozilla's root-certificate bundle. It is a DATA
    # licence rather than a code one, which is why it does not appear on the
    # usual permissive-code list; permissive in the same sense.
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "OpenSSL",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
