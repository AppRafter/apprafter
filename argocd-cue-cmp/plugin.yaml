#
# Argo CD Config Management Plugin manifest for CUE
# compilation of user application repositories. ADR 0029.
#
# The plugin activates only when an Argo CD Application's
# source repository contains a file matching `**/apprafter*.cue`.
# When it does, Argo CD's repo-server hands control to this
# sidecar, which runs `cue export ./... --out yaml` via
# `entrypoint.sh` and pipes the rendered manifests back into
# Argo CD's standard sync pipeline.
#
# Users who prefer raw YAML are unaffected — without
# `apprafter*.cue` in the repo, the CMP discover step skips
# the repository.
apiVersion: argoproj.io/v1alpha1
kind: ConfigManagementPlugin
metadata:
  name: cue
spec:
  # Detection rule. Globs are evaluated relative to the
  # repo-server's checkout of the user repository. Two
  # conventions are accepted:
  #
  #   1. `apprafter*.cue` filename anywhere in the tree —
  #      e.g. `apprafter.cue`, `apprafter-web.cue`. The
  #      "filename starts with apprafter" convention is
  #      compact for small repos.
  #
  #   2. Any `*.cue` file inside an `apprafter/` directory —
  #      e.g. `landing/web/apprafter/Application.cue`. The
  #      directory-as-marker convention is more readable in
  #      larger repos where multiple apps share а tree.
  #
  # Walk-fix #5 post-B.1.79a (cue-cmp v0.1.2) added the
  # second pattern. The first was already supported but
  # forced operators к use prefixed filenames; the directory-
  # marker form matches how AppRafter's own landing manifests
  # are laid out (`landing/web/apprafter/Application.cue`,
  # `landing/cms/apprafter/Application.cue`).
  #
  # Doublestar v4 brace alternation handles both patterns in
  # а single glob; Argo CD's repo-server uses that library
  # for CMP discovery as of 2.13.
  discover:
    find:
      glob: "{**/apprafter*.cue,**/apprafter/**/*.cue}"
  # Render command. `entrypoint.sh` lives in the sidecar
  # image and wraps `cue export` so CUE compile errors
  # surface as structured single-line summaries in the
  # Argo CD UI (full stderr remains available in the sync
  # log). Sync details: see ADR 0029 §Rationale.
  generate:
    command: [sh, "-c"]
    args:
      - /usr/local/bin/entrypoint.sh
