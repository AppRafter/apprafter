#
# Argo CD Config Management Plugin manifest for CUE
# compilation of user application repositories. ADR 0029.
#
# This file is kept in sync with the chart's embedded mirror
# at `platform-stack/cue/component_argocd.cue` —
# `data."plugin.yaml"`. The chart-side ConfigMap is what Argo
# CD actually mounts at runtime; the file here is the source
# of truth that the CI smoke test (`argocd-cue-cmp-check.yml`)
# verifies on every cue-cmp change.
#
# Walk-fix #8 post-B.1.79a (cue-cmp v0.1.3 → unchanged image,
# config-only):
#
#   Initial v0.1.2 plugin used `discover.find.glob:
#   "{**/apprafter*.cue,**/apprafter/**/*.cue}"` — brace
#   alternation that doublestar v4 supports. Argo CD 2.13.1's
#   vendored doublestar either treats the braces literally or
#   never received the v4 brace support — CMP returned
#   no-match on real-world paths and Argo CD fell back to
#   default directory mode, choking on `package.json`.
#
#   Switched to `discover.find.command` — a shell script that
#   runs from the path's directory and exits 0 on match. Two
#   conventions handled in one expression:
#
#     * cwd basename `apprafter` (operator's path points
#       directly at the convention directory): match any
#       `.cue` file at depth 1.
#     * otherwise: match any `.cue` file inside an
#       `apprafter/` subdirectory OR with a filename starting
#       `apprafter`.
#
# Users who prefer raw YAML are unaffected — without a
# matching `.cue` file the CMP discover step exits non-zero
# and Argo CD picks the next plugin / default handler.
apiVersion: argoproj.io/v1alpha1
kind: ConfigManagementPlugin
metadata:
  name: cue
spec:
  discover:
    find:
      command:
        - sh
        - -c
        - |
          if [ "$(basename "$PWD")" = "apprafter" ]; then
            find . -maxdepth 1 -type f -name '*.cue' -print -quit | grep -q .
          else
            find . -type f -name '*.cue' \( -path '*/apprafter/*' -o -name 'apprafter*.cue' \) -print -quit | grep -q .
          fi
  # Render command. `entrypoint.sh` lives in the sidecar
  # image and wraps `cue export` so CUE compile errors
  # surface as structured single-line summaries in the
  # Argo CD UI (full stderr remains available in the sync
  # log). Sync details: see ADR 0029 §Rationale.
  generate:
    command: [sh, "-c"]
    args:
      - /usr/local/bin/entrypoint.sh
