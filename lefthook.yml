#
# Local Git hooks managed by lefthook (https://lefthook.dev).
# Install with `lefthook install` after `nix run nixpkgs#lefthook --`
# or `bun add -D lefthook && bun lefthook install`.

pre-commit:
  parallel: true
  commands:
    cue:
      glob: "{cue.mod/**,schemas/**,examples/**}/*.cue"
      run: ./scripts/lint-cue.sh
    spdx:
      run: ./scripts/check-spdx-headers.sh
    cyrillic:
      run: ./scripts/check-no-cyrillic.sh
    crd-check:
      glob: "{schemas/v1alpha1/*.cue,operator/operator-core/src/*.rs,operator/charts/apprafter-operator/templates/crd-*.yaml}"
      run: ./scripts/crd-check.sh
    docs-check:
      glob: "{docs/**/*.md,mkdocs.yml,docs/hooks/**,scripts/docs-check.sh}"
      run: ./scripts/docs-check.sh
    # The CLI reference is generated from the clap tree, so a touched
    # cli.rs (or anything else under platform-cli) is a docs change
    # too. Regenerating and staging it here means a contributor never
    # sees "the docs drifted" for a file they were never asked to
    # edit — the gate in docs-check then only fires for a hand-edited
    # generated page.
    docsgen:
      glob: "cli/platform-cli/src/**"
      run: just docsgen-generate && git add docs/reference/cli

commit-msg:
  commands:
    conventional:
      run: ./scripts/check-commit-msg.sh "{1}"
