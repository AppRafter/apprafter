# SPDX-License-Identifier: FSL-1.1-Apache-2.0
site_name: AppRafter
site_description: Opinionated, vertically-integrated PaaS on Kubernetes
# ADR 0057 decision 8: the docs are their own deployable on their own
# hostname. A path on the landing origin (`apprafter.dev/docs`) was
# considered and REJECTED there — it couples the docs release cadence
# to the landing's and shares one cache and one rollback unit between
# two artefacts with unrelated change rates. This value is not
# cosmetic: `docs/hooks/llm_export.py` bakes it into every absolute URL
# in llms.txt, llms-full.txt and the per-page markdown twins, and
# mkdocs bakes it into sitemap.xml, so the wrong value here publishes
# the rejected design in four artefacts.
site_url: https://docs.apprafter.dev/
copyright: >
  © 2026 AppRafter Authors. Documentation licensed CC-BY-4.0;
  code samples Apache-2.0. Platform core FSL-1.1-Apache-2.0.
docs_dir: docs

repo_url: https://github.com/apprafter/apprafter
edit_uri: edit/master/docs/

# Internal artefacts that live under docs/ but are NOT part of the
# published site: the release-note working file (also parsed by
# release-cli.yml — excluded from the SITE, never moved), the plan
# ledger, RSS measurements, and the gitignored superpowers tree.
#
# A markdown link INTO one of these paths resolves locally but 404s on
# the published site — mkdocs logs only INFO for that case, so --strict
# will not catch it. Reference these files by path in backticks, never
# as a link.
exclude_docs: |
  superpowers/
  changelog/UNRELEASED.md
  changelog/plan-history.md
  measurements/
  # The literate-nav fragment is nav data, not a page. literate-nav
  # already keeps it out of the nav and out of search, but it still
  # rendered at /reference/cli/SUMMARY/ and appeared in sitemap.xml —
  # a crawlable page that is just a link list under a "do not edit"
  # banner. Excluding it from the SITE does not hide it from
  # literate-nav, which reads the docs tree, not the build output.
  reference/cli/SUMMARY.md
  # Build hooks (see `hooks:` below). They live under docs/ to sit
  # beside what they act on, but they are build machinery, not
  # content: without this, mkdocs copies them to the site as static
  # files — verified, it published both hooks/cue_lexer.py and the
  # hooks/__pycache__/ directory CPython left there. Excluding them
  # from the SITE does not stop `hooks:` loading them, which reads the
  # path directly, not the docs tree.
  hooks/

# Pages deliberately reachable by URL but absent from nav. Anything
# NOT on this list that is missing from nav fails the build — an
# orphaned guide (node-prep.md was invisible for months) is a bug.
# Only the ADR bodies are on it: `adr/README.md` is the nav entry and
# indexes every record, so listing each one beside it would be noise.
not_in_nav: |
  adr/*

# NOTE: mkdocs 1.6.1's validation levels are warn/info/ignore only —
# there is no literal "error" level. `--strict` (see the Justfile) is
# what promotes "warn" to a build failure, so "warn" here is the
# strictest real setting and is what actually enforces these checks.
# `just docs-build` passes --strict; `just docs-serve` (local preview)
# does not, so there a warn is only a printed line — the enforcement
# point is the build, not the live-reload server.
validation:
  nav:
    omitted_files: warn
    not_found: warn
    absolute_links: ignore
  links:
    not_found: warn
    anchors: warn
    unrecognized_links: warn
    absolute_links: warn

theme:
  name: material
  # Adds one <link rel="alternate" type="text/markdown"> per page (see
  # overrides/main.html), so an agent on a rendered page can reach the
  # markdown twin without guessing /llms.txt exists.
  custom_dir: overrides
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

plugins:
  - search
  # The CLI reference is generated (`just docsgen-generate`), so its
  # nav is generated with it: `docs/reference/cli/SUMMARY.md` is a nav
  # fragment docsgen emits alongside the pages. Listing 26 command
  # pages by hand here would be a second source of truth that drifts
  # the first time a command is added.
  - literate-nav:
      nav_file: SUMMARY.md

# Build hooks. mkdocs loads these by PATH (not as importable modules)
# and calls the same event API a plugin gets, so a hook can do what no
# packaged plugin here can — pygments ships no CUE lexer, and nixpkgs
# has no llms.txt plugin (ADR 0057 §"Keep MkDocs-Material" records both
# as accepted costs).
#
# Hooks live under docs/ so they sit beside what they act on; that also
# puts them inside docs_dir, where mkdocs would otherwise copy them to
# the site as static files — hence the exclude_docs entry above.
hooks:
  # Registers a CUE lexer and FAILS THE BUILD if the registration did
  # not take. pymdownx.highlight catches a lexer-lookup failure and
  # falls back to `text`, so without that self-check a broken hook is a
  # green build with every ```cue fence silently unhighlighted.
  - docs/hooks/cue_lexer.py
  # Writes llms.txt, llms-full.txt and a markdown twin per page into
  # the built site. Nothing it writes is committed: all three derive
  # from committed content at build time, so they cannot drift from it.
  # Listed after the lexer because it captures each page's markdown and
  # a hook that edited markdown would have to run first to be seen.
  - docs/hooks/llm_export.py

markdown_extensions:
  - attr_list          # explicit {#stable-anchor} ids — the docs cross-reference gate resolves against these
  - admonition
  - pymdownx.details
  - pymdownx.highlight # explicit: a build hook registers a CUE pygments lexer and needs this extension present to attach to
  - pymdownx.superfences:
      # Structural concepts (the tier model, the bootstrap → Argo CD
      # handover, the need → claim → secret → env chain, the migration
      # gate) are carried as `mermaid` diagrams. Material renders these to
      # `<pre class="mermaid">` and loads mermaid.js itself; the source
      # fence reaches the twin/bundle unchanged (it IS the diagram).
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.snippets: # guides include REAL files instead of carrying copies
      # Snippet paths are written repo-root-relative (e.g.
      # "examples/applications/redis-app.cue"). `!relative $config_dir`
      # anchors that root to this file's directory rather than to the
      # caller's CWD — a bare `base_path: ["."]` silently depends on
      # every caller cd-ing to the repo root first.
      base_path: !relative $config_dir
      # Traversal above the base is blocked (this is the default; pinned
      # here because a repo-root base is worth being explicit about).
      restrict_base_path: true
      # A missing include is a hard build failure, not a literal
      # "--8<--" line nobody notices.
      check_paths: true
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Operator Guide:
      - Overview: operator-guide/index.md
      - Quickstart: operator-guide/quickstart.md
      - Target store: operator-guide/target-store.md
      # Sits with the target pages rather than under "Day 2": the
      # machine is chosen when the target is set up, and after
      # provisioning it can only be changed by rebuilding.
      - Choosing the machine: operator-guide/choosing-the-machine.md
      - Node preparation: operator-guide/node-prep.md
      # Public ingress was a top-level section of two pages. Both are
      # about cluster-owned resources (the zones on the platform Gateway
      # and the certificate that terminates TLS for them), which is
      # operator work, so they live in this section rather than holding
      # a tab of their own.
      - Connect a domain: operator-guide/connect-a-domain.md
      - Cloudflare Origin CA cert: operator-guide/cloudflare-origin-cert.md
      # The worked instance of the two pages above: one application on a
      # subdomain of an already-connected zone. It sits here rather than
      # under Contributing because its three steps are cluster and DNS
      # work, which is the operator's, not a contributor's.
      - Publish the docs site: operator-guide/publish-the-docs-site.md
      - Postgres: operator-guide/postgres.md
      - Redis: operator-guide/redis.md
      - Persistent disk: operator-guide/persistent-disk.md
      - Shared volumes: operator-guide/shared-volumes.md
      - Egress policy: operator-guide/egress-policy.md
      - Backup & restore: operator-guide/backup-restore.md
      - Platform management: operator-guide/platform-management.md
      - Migration plans: operator-guide/migration-plans.md
      - Troubleshooting: operator-guide/troubleshooting.md
      - Recovery: operator-guide/recovery.md
  - How it works:
      # Mechanism, split out of the guides by ADR 0058: a guide is a
      # recipe, and an explanation of what the platform does behind a
      # step is a different job for a different reader. Sits after the
      # two guide sections because that is the order the reader meets
      # them in — run the recipe first, come here when it surprises you.
      - Overview: how-it-works/index.md
      - Declared Postgres dependencies: how-it-works/needs-pg.md
      - Declared Redis dependencies: how-it-works/needs-redis.md
      - Declared disk dependencies: how-it-works/needs-disk.md
      - Egress derived from declared dependencies: how-it-works/egress-policy.md
      - Right-sizing an application's requests: how-it-works/resources-and-autoscaling.md
  - Developer Guide:
      - Overview: dev-guide/index.md
      - Quickstart: dev-guide/quickstart.md
      - Writing Application.cue: dev-guide/application-cue.md
      # Ordered as the work happens: author the manifest, then the
      # three things you reach for while filling it in (environments,
      # sizing, secrets), then the credentials a private source needs,
      # then the push-to-deploy loop you live in afterwards.
      - Deploying more than one environment: dev-guide/environments.md
      - Resources and autoscaling: dev-guide/resources-and-autoscaling.md
      - Secrets: dev-guide/secrets.md
      - Private repos & registries: dev-guide/private-repos-and-registries.md
      - Image iteration: dev-guide/image-iteration.md
  - Reference:
      - Overview: reference/index.md
      # Expanded by literate-nav from reference/cli/SUMMARY.md, which
      # docsgen writes — a new top-level command needs no edit here.
      - CLI: reference/cli/
      # Hand-written on purpose: only four of these variables are
      # declared through clap (`#[arg(env = …)]`), so the generated
      # tree cannot carry the rest — they are read by `std::env::var`
      # in command code, or by a dependency (miette, owo-colors,
      # tracing-subscriber).
      - Environment variables: reference/environment.md
  - Contributing:
      - Overview: contributing/README.md
      - Setup: contributing/setup.md
      - Writing documentation: contributing/documentation.md
      - Documentation gate: contributing/documentation-gate.md
      - License headers: contributing/license-headers.md
      # Which license covers which directory and how the FSL conversion
      # works. It was reachable by URL but absent from the nav, which
      # made it findable only by search — this is a page visitors look
      # for by name.
      - Licensing: license.md
  - ADRs: adr/README.md
  - Status: status.md
