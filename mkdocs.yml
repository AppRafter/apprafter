# SPDX-License-Identifier: FSL-1.1-Apache-2.0
site_name: AppRafter
site_description: Opinionated, vertically-integrated PaaS on Kubernetes
site_url: https://apprafter.dev/docs
docs_dir: docs

repo_url: https://github.com/apprafter/apprafter
edit_uri: edit/main/docs/

# Local-only artefacts (gitignored) physically present in docs/
# during development. Skip them at build time.
exclude_docs: |
  superpowers/

# Tone down the "page exists but not in nav" message for ADR pages
# we deliberately keep accessible by URL only — the ADR index is
# linked from nav as a single page.
validation:
  nav:
    omitted_files: info
    not_found: warn
    absolute_links: ignore

theme:
  name: material
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

plugins:
  - search

markdown_extensions:
  - attr_list
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Architecture: architecture/index.md
  - Concepts: concepts/index.md
  - Operator Guide:
      - Overview: operator-guide/index.md
      - Quickstart: operator-guide/quickstart.md
      - Target store: operator-guide/target-store.md
      - GitOps walk: operator-guide/gitops-walk.md
      - needs.pg walk: operator-guide/needs-pg-walk.md
      - needs.redis walk: operator-guide/needs-redis-walk.md
      - needs.disk walk: operator-guide/needs-disk-walk.md
      - needs.networkpolicy walk: operator-guide/needs-networkpolicy-walk.md
      - Shared volumes: operator-guide/shared-volumes.md
      - Backup & restore: operator-guide/backup-restore.md
      - Platform management: operator-guide/platform-management.md
      - Migration plans: operator-guide/migration-plans.md
      - Troubleshooting: operator-guide/troubleshooting.md
      - Recovery: operator-guide/recovery.md
  - Public ingress:
      - Connect a domain: public-ingress/connect-a-domain.md
      - Cloudflare Origin CA cert: public-ingress/cloudflare-origin-cert.md
  - Developer Guide:
      - Overview: dev-guide/index.md
      - Quickstart: dev-guide/quickstart.md
      - Writing Application.cue: dev-guide/application-cue.md
      - Private repos & registries: dev-guide/private-repos-and-registries.md
      - Image iteration: dev-guide/image-iteration.md
  - Reference:
      - Overview: reference/index.md
      - CLI: reference/cli.md
  - Contributing:
      - Setup: contributing/setup.md
      - License Headers: contributing/license-headers.md
  - ADRs: adr/README.md
